name: CINÉVA automated checks
on:
  push:
    branches: [main]
    paths-ignore:
      - "repository-site/**"
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: cineva-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  widget-manager-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build release ZIP and verify true idempotence
        run: |
          python tools/build_skin_archive.py
          before="$(sha256sum skin.cineva-0.5.13.zip | cut -d' ' -f1)"
          python tools/build_skin_archive.py
          after="$(sha256sum skin.cineva-0.5.13.zip | cut -d' ' -f1)"
          if [ "$before" != "$after" ]; then
            echo "::error::The second archive build changed the ZIP; generated XML is not idempotent."
            exit 1
          fi
          echo "Archive SHA-256 is stable across consecutive builds: $after"
      - name: Expand uploaded CINÉVA archive
        run: |
          test -s skin.cineva-0.5.13.zip
          unzip -q skin.cineva-0.5.13.zip -d .
      - name: Validate Settings-only widget configuration navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          home = ET.parse("skin.cineva/xml/Home.xml").getroot()
          nav = next((g for g in home.findall("./controls/control[@type='group']") if g.find("./control[@id='1001']") is not None), None)
          if nav is None:
              raise SystemExit("Home navigation group is missing")
          buttons = nav.findall("./control[@type='button']")
          if any(b.findtext("label", "").strip().upper() == "MY WIDGETS" or "ActivateWindow(11119)" in b.findtext("onclick", "") for b in buttons):
              raise SystemExit("Separate My Widgets destination must not appear in Home navigation")
          settings = nav.find("./control[@id='1005']")
          if settings is None or (settings.findtext("label"), settings.findtext("left"), settings.findtext("width"), settings.findtext("onclick")) != ("SETTINGS", "670", "150", "ActivateWindow(11113)"):
              raise SystemExit("Settings must occupy the reclaimed Home navigation slot")
          if nav.find("./control[@id='1006']") is not None:
              raise SystemExit("Obsolete Home navigation control 1006 remains")
          if Path("skin.cineva/xml/CinevaWidgetHub.xml").exists():
              raise SystemExit("Obsolete My Widgets hub window must not be packaged")
          print("Home navigation is Settings-only; widget slots remain configurable in Skin Settings.")
          PY
      - name: Validate branded Home poster fallback
        run: |
          python - <<'PY'
          import pathlib
          import struct
          import zlib
          import xml.etree.ElementTree as ET
          root = pathlib.Path("skin.cineva")
          includes = ET.parse(root / "xml/Includes.xml").getroot()
          names = ["CinevaPosterItem", "CinevaFocusedPosterItem"] + [
              f"CinevaFocusedPosterItem{row}" for row in (9001, 9002, 9003, 9004)
          ]
          for name in names:
              include = includes.find(f"./include[@name='{name}']")
              if include is None:
                  raise SystemExit(f"Missing poster include: {name}")
              poster_images = [
                  node for node in include.findall("./control[@type='image']")
                  if (node.findtext("texture") or "").strip() == "$INFO[ListItem.Art(poster)]"
              ]
              if not poster_images or any(
                  node.find("texture").attrib.get("fallback") != "poster-placeholder.png"
                  for node in poster_images
              ):
                  raise SystemExit(f"{name} does not provide the branded missing-poster fallback")
          data = (root / "media/poster-placeholder.png").read_bytes()
          if data[:8] != bytes.fromhex("89504e470d0a1a0a"):
              raise SystemExit("Branded poster fallback is not a PNG")
          width, height = struct.unpack(">II", data[16:24])
          if (width, height) != (342, 513):
              raise SystemExit(f"Poster fallback must be 342x513, got {width}x{height}")
          offset, compressed = 8, bytearray()
          while offset < len(data):
              length = int.from_bytes(data[offset:offset + 4], "big")
              kind = data[offset + 4:offset + 8]
              payload = data[offset + 8:offset + 8 + length]
              crc = int.from_bytes(data[offset + 8 + length:offset + 12 + length], "big")
              if zlib.crc32(kind + payload) & 0xffffffff != crc:
                  raise SystemExit("Poster fallback PNG has a corrupt chunk CRC")
              if kind == b"IDAT":
                  compressed.extend(payload)
              offset += length + 12
          decoded = zlib.decompress(bytes(compressed))
          if len(decoded) != (1 + width * 4) * height:
              raise SystemExit("Poster fallback PNG pixel payload has an invalid length")
          stride = 1 + width * 4
          # The fallback is intentionally cinematic abstract artwork, not a
          # play-button placeholder. Confirm it has real tonal variation and
          # a non-flat composition after decoding the PNG payload.
          samples = [
              decoded[y * stride + 1 + x * 4: y * stride + 1 + x * 4 + 3]
              for y, x in ((40, 40), (140, 240), (250, 170), (390, 80), (450, 270))
          ]
          if len({tuple(pixel) for pixel in samples}) < 4:
              raise SystemExit("Poster fallback artwork is too flat; expected cinematic tonal variation")
          print("Normal and focused Home cards package valid 342x513 cinematic poster fallback artwork.")
          PY

      - name: Python syntax
        run: python -m compileall -q tools/build_skin_archive.py tools/download_test_posters.py tools/script.cineva.widgets tools/test-fixtures/plugin.video.pov
      - name: Validate GUI artwork JPEG signature contract
        run: |
          python - <<'PY'
          import runpy
          module = runpy.run_path("tools/download_test_posters.py")
          assert module["JPEG_SIGNATURE"] == bytes.fromhex("ffd8ff")
          print("GUI artwork downloader uses the correct JPEG SOI signature.")
          PY
      - name: Widget manager unit tests (Kodi API mocked)
        run: python -m unittest discover -s tests -v
      - name: Validate packaged skin and widget settings
        run: |
          python - <<'PY'
          import pathlib
          import struct
          import sys
          import zlib
          import xml.etree.ElementTree as ET
          root = pathlib.Path("skin.cineva")
          files = sorted(root.rglob("*.xml"))
          errors = []
          for path in files:
              try:
                  tree = ET.parse(path)
                  if path.parent.name == "xml" and path.name.startswith("custom"):
                      wid = tree.getroot().attrib.get("id")
                      if wid and path.stem != "custom" + str(int(wid) + 10000):
                          errors.append(f"{path}: custom window filename/id offset mismatch")
              except ET.ParseError as exc:
                  errors.append(f"{path}: {exc}")
          home = ET.parse(root / "xml/Home.xml").getroot()
          if home.findtext("defaultcontrol") != "1001":
              errors.append("Home default focus must be navigation control 1001")
          if (home.findtext("onload") or "").strip() != "RunScript(script.cineva.widgets,action=init)":
              errors.append("Home must initialize widgets through the Python manager")
          confirm = ET.parse(root / "xml/DialogConfirm.xml").getroot()
          if confirm.findtext("defaultcontrol") != "11":
              errors.append("Keep Skin must default to Yes (control 11)")
          for button in confirm.findall(".//control[@type='button']"):
              if button.findtext("texturefocus") != "focus-bar.png" or button.findtext("texturenofocus") != "black.png":
                  errors.append("Keep Skin buttons need explicit visible textures")
          startup = ET.parse(root / "xml/Startup.xml").getroot()
          if startup.find("defaultcontrol") is not None or startup.find(".//control[@id='50']") is not None:
              errors.append("Startup.xml still focuses the empty panel")
          if (startup.findtext("onload") or "").strip() != "ReplaceWindow(Home)":
              errors.append("Startup.xml must hand off to Home")
          controls = home.find("controls")
          row_focus_conditions = {f"Control.HasFocus({focus_id})" for focus_id in (9001, 9002, 9003, 9004)}
          orphan_row_accents = [node for node in controls.findall("control")
                                if node.get("type") == "image"
                                and node.findtext("texture") == "focus-bar.png"
                                and node.findtext("visible", "") in row_focus_conditions
                                and (node.findtext("left"), node.findtext("width"), node.findtext("height")) == ("0", "58", "3")]
          if orphan_row_accents:
              errors.append("Home row focus accents must remain inside their scrolling shelf groups")
          hero_group = next((g for g in controls.findall("control") if g.get("type") == "group" and g.findtext("control/label", "").startswith("$INFO[Container(")), None)
          hero_title = next((c for c in hero_group.findall("control") if c.get("type") == "label" and "$INFO[Container(9001).ListItem.Label]" in c.findtext("label", "")), None) if hero_group is not None else None
          hero_plot = hero_group.find("./control[@type='textbox']") if hero_group is not None else None
          hero_meta = next((c for c in hero_group.findall("control") if c.get("type") == "label" and "$INFO[Container(9001).ListItem.Year]" in c.findtext("label", "")), None) if hero_group is not None else None
          hero_eyebrow = hero_group.find("./control[@id='9300']") if hero_group is not None else None
          hero_logo = hero_group.find("./control[@id='9190']") if hero_group is not None else None
          if hero_group is None or hero_group.findtext("top") != "118" or hero_group.findtext("height") != "318" or hero_title is None or (hero_title.findtext("top"), hero_title.findtext("height"), hero_title.findtext("font"), hero_title.findtext("width"), hero_title.findtext("wrapmultiline"), hero_title.findtext("aligny")) != ("36", "82", "font22", "1200", "true", "center") or hero_meta is None or (hero_meta.findtext("top"), hero_meta.findtext("height"), hero_meta.findtext("font"), hero_meta.findtext("textcolor"), hero_meta.findtext("width")) != ("128", "28", "font10", "silver", "340") or hero_plot is None or (hero_plot.findtext("top"), hero_plot.findtext("height"), hero_plot.findtext("font")) != ("172", "56", "font13") or hero_eyebrow is None or (hero_eyebrow.findtext("top"), hero_eyebrow.findtext("height"), hero_eyebrow.findtext("label"), hero_eyebrow.findtext("visible"), hero_eyebrow.findtext("font"), hero_eyebrow.findtext("textcolor")) != ("0", "24", "CONTINUE WATCHING", "String.Contains(Skin.String(Cineva.Widget1.Path),in_progress)", "font9", "FFE50914") or hero_logo is None or (hero_logo.findtext("top"), hero_logo.findtext("height"), hero_logo.findtext("width")) != ("36", "70", "900"):
              errors.append("Home hero eyebrow, title/clearlogo, metadata and synopsis must occupy separate, title-safe vertical bands")
          for group in (g for g in controls.findall("control") if g.get("type") == "group" and g.findtext("control/label", "").startswith("$INFO[Container(")):
              source_label = group.findtext("control/label", "")
              container_id = int(source_label.split("Container(", 1)[1].split(")", 1)[0])
              metadata = next((c for c in group.findall("control") if c.get("type") == "label" and ".ListItem.Year]" in c.findtext("label", "")), None)
              expected = (f"$INFO[Container({container_id}).ListItem.Year]"
                          f"$INFO[Container({container_id}).ListItem.Duration,  •  ]"
                          f"$INFO[Container({container_id}).ListItem.Genre,  •  ]")
              row_index = container_id - 9000
              eyebrow_base_id = 9300 + (row_index - 1) * 3
              source_path = f"Skin.String(Cineva.Widget{row_index}.Path)"
              eyebrow_specs = (
                  ("CONTINUE WATCHING", f"String.Contains({source_path},in_progress)"),
                  ("TRENDING NOW", f"String.Contains({source_path},trending)"),
                  ("YOUR COLLECTION", f"!String.Contains({source_path},in_progress) + !String.Contains({source_path},trending)")
              )
              for offset, (expected_label, expected_visibility) in enumerate(eyebrow_specs):
                  eyebrow = group.find(f"./control[@id='{eyebrow_base_id + offset}']")
                  if eyebrow is None or (eyebrow.findtext("top"), eyebrow.findtext("height"), eyebrow.findtext("label"), eyebrow.findtext("visible"), eyebrow.findtext("font"), eyebrow.findtext("textcolor")) != ("0", "24", expected_label, expected_visibility, "font9", "FFE50914"):
                      errors.append(f"Home hero {container_id} is missing its source-aware {expected_label} eyebrow")
              buttons = group.findall("./control[@type='button']")
              if len(buttons) != 2 or any(button.findtext("top") != "240" for button in buttons) or [(button.findtext("left"), button.findtext("width"), button.findtext("height")) for button in buttons] != [("0", "190", "54"), ("212", "220", "54")]:
                  errors.append(f"Home hero {container_id} actions are not aligned beneath the synopsis")
              if metadata is None or metadata.findtext("label") != expected:
                  errors.append(f"Home hero {container_id} metadata must omit separators for empty fields")
              rating_id = 9340 + (container_id - 9001) * 3
              rating_bg = group.find(f"./control[@id='{rating_id}']")
              rating_logo = group.find(f"./control[@id='{rating_id + 1}']")
              rating_text = group.find(f"./control[@id='{rating_id + 2}']")
              if (rating_bg is None or rating_bg.findtext("texture") != "rating-badge.png"
                      or (rating_bg.findtext("left"), rating_bg.findtext("top"), rating_bg.findtext("width"), rating_bg.findtext("height")) != ("360", "126", "148", "32")
                      or rating_logo is None or rating_logo.findtext("texture") != "imdb-logo.png"
                      or (rating_logo.findtext("left"), rating_logo.findtext("top"), rating_logo.findtext("width"), rating_logo.findtext("height")) != ("368", "130", "48", "24")
                      or rating_text is None or "ListItem.Rating" not in rating_text.findtext("label", "")
                      or "★" in rating_text.findtext("label", "")
                      or (rating_text.findtext("left"), rating_text.findtext("top"), rating_text.findtext("width"), rating_text.findtext("height")) != ("422", "126", "84", "32")):
                  errors.append(f"Home hero {container_id} must render an IMDb-branded score chip with a separate rating value")
          rating_control_ids = [node.get("id") for node in home.iter()
                                if node.get("id") in {str(value) for value in range(9340, 9352)}]
          if len(rating_control_ids) != 12 or len(set(rating_control_ids)) != 12:
              errors.append("All four Home IMDb rating chips must use twelve unique control IDs")
          rating_badge = (root / "media/rating-badge.png").read_bytes()
          imdb_logo = (root / "media/imdb-logo.png").read_bytes()
          for asset_name in ("hero-primary.png", "hero-primary-focus.png", "hero-secondary.png", "hero-secondary-focus.png"):
              asset = (root / "media" / asset_name).read_bytes()
              if asset[:8] != bytes.fromhex("89504e470d0a1a0a") or (int.from_bytes(asset[16:20], "big"), int.from_bytes(asset[20:24], "big")) != (32, 32):
                  errors.append(f"Home CTA texture {asset_name} must be a valid 32x32 PNG")
          if rating_badge[:8] != bytes.fromhex("89504e470d0a1a0a") or (int.from_bytes(rating_badge[16:20], "big"), int.from_bytes(rating_badge[20:24], "big")) != (148, 32):
              errors.append("Packaged rating badge must be a valid 148x32 PNG")
          if imdb_logo[:8] != bytes.fromhex("89504e470d0a1a0a") or (int.from_bytes(imdb_logo[16:20], "big"), int.from_bytes(imdb_logo[20:24], "big")) != (48, 24):
              errors.append("Packaged IMDb wordmark must be a valid 48x24 PNG")
          topbar_index = next((i for i, node in enumerate(list(controls))
                               if node.tag == "include" and (node.text or "").strip() == "CinevaTopBar"), -1)
          shade_index = next((i for i, node in enumerate(list(controls))
                              if node.tag == "control" and node.findtext("texture") == "hero-shade.png"), -1)
          if topbar_index <= shade_index:
              errors.append("CINÉVA top navigation is layered underneath the hero artwork")
          top_shade = controls.find("./control[@id='9100']")
          top_texture = top_shade.find("texture") if top_shade is not None else None
          if top_shade is None or top_shade.findtext("height") != "320" or top_texture is None or top_texture.attrib.get("flipy") != "true":
              errors.append("Home hero is missing the mirrored top fade for readable navigation")
          left_shade = controls.find("./control[@id='9105']")
          if left_shade is None or (left_shade.findtext("left"), left_shade.findtext("top"), left_shade.findtext("width"), left_shade.findtext("height")) != ("0", "0", "1920", "440") or left_shade.findtext("texture") != "hero-left-shade.png":
              errors.append("Home hero is missing the cinematic left-side contrast overlay")
          left_shade_index = next((i for i, node in enumerate(list(controls)) if node is left_shade), -1)
          if left_shade_index < 0 or topbar_index <= left_shade_index:
              errors.append("CINÉVA top navigation must render above the hero contrast overlay")
          topbar_shade = controls.find("./control[@id='9108']")
          topbar_shade_index = next((i for i, node in enumerate(list(controls)) if node is topbar_shade), -1)
          nav_group_index = next((i for i, node in enumerate(list(controls))
                                  if node.get("type") == "group" and node.find("./control[@id='1001']") is not None), -1)
          if topbar_shade is None or (topbar_shade.findtext("left"), topbar_shade.findtext("top"), topbar_shade.findtext("width"), topbar_shade.findtext("height"), topbar_shade.findtext("texture")) != ("0", "0", "1920", "180", "hero-topbar-shade.png") or nav_group_index <= topbar_shade_index or topbar_index <= topbar_shade_index:
              errors.append("Home topbar must sit above a full-width contrast veil")
          topbar_fade_path = root / "media/hero-topbar-shade.png"
          if not topbar_fade_path.is_file():
              errors.append("Packaged topbar contrast texture is missing")
          else:
              topbar_fade_data = topbar_fade_path.read_bytes()
              if topbar_fade_data[:8] != bytes.fromhex("89504e470d0a1a0a") or (int.from_bytes(topbar_fade_data[16:20], "big"), int.from_bytes(topbar_fade_data[20:24], "big")) != (1920, 180):
                  errors.append("Topbar contrast texture must be a 1920x180 PNG")
              else:
                  offset = 8
                  idat = bytearray()
                  while offset < len(topbar_fade_data):
                      chunk_length = int.from_bytes(topbar_fade_data[offset:offset + 4], "big")
                      chunk_type = topbar_fade_data[offset + 4:offset + 8]
                      chunk_data = topbar_fade_data[offset + 8:offset + 8 + chunk_length]
                      if chunk_type == b"IDAT":
                          idat.extend(chunk_data)
                      offset += chunk_length + 12
                  decoded = zlib.decompress(bytes(idat))
                  stride = 1 + 1920 * 4
                  alpha_at = lambda row: decoded[row * stride + 1 + 3]
                  if len(decoded) != stride * 180 or not (150 <= alpha_at(0) <= 170) or not (20 <= alpha_at(90) <= 50) or alpha_at(179) != 0 or not (alpha_at(0) > alpha_at(90) > alpha_at(179)):
                      errors.append("Topbar contrast veil must fade smoothly from strong top opacity to transparent")
          hero_artwork = [node for node in controls.findall("control")
                          if node.get("type") == "image"
                          and ".ListItem.Art(fanart)]" in node.findtext("texture", "")]
          hero_shade = next((node for node in controls.findall("control")
                             if node.get("type") == "image" and node.findtext("texture") == "hero-shade.png"), None)
          if len(hero_artwork) != 4 or any(node.findtext("height") != "750" for node in hero_artwork) or hero_shade is None or hero_shade.findtext("height") != "750":
              errors.append("Home hero fanart and shade must extend through the lower-row transition")
          row1_artwork = next((node for node in hero_artwork if "Container(9001)" in node.findtext("texture", "")), None)
          if row1_artwork is None or row1_artwork.find("visible") is not None:
              errors.append("Home row 1 hero fallback must remain visible on initial navigation focus")
          for container_id, play_id in ((9002, 9113), (9003, 9115), (9004, 9117)):
              artwork = next((node for node in hero_artwork if f"Container({container_id})" in node.findtext("texture", "")), None)
              expected_art_visibility = " | ".join(
                  f"Control.HasFocus({focus_id})"
                  for focus_id in (container_id, play_id, play_id + 1)
              )
              texture_node = artwork.find("texture") if artwork is not None else None
              if artwork is None or texture_node is None or texture_node.attrib.get("fallback") != "hero-placeholder.png" or artwork.findtext("visible") != expected_art_visibility:
                  errors.append(f"Home row {container_id} hero must show fanart or the branded fallback while its actions are focused")
          if any((node.find("texture") is None or node.find("texture").attrib.get("fallback") != "hero-placeholder.png") for node in hero_artwork):
              errors.append("All four Home hero artwork controls must package the missing-fanart fallback")
          hero_fallback_path = root / "media/hero-placeholder.png"
          if not hero_fallback_path.is_file():
              errors.append("Packaged missing-fanart hero placeholder is missing")
          else:
              hero_fallback_data = hero_fallback_path.read_bytes()
              if hero_fallback_data[:8] != bytes.fromhex("89504e470d0a1a0a") or (int.from_bytes(hero_fallback_data[16:20], "big"), int.from_bytes(hero_fallback_data[20:24], "big")) != (1920, 750):
                  errors.append("Packaged missing-fanart hero placeholder must be a 1920x750 PNG")
          row1_exclusions = (9002, 9113, 9114, 9003, 9115, 9116, 9004, 9117, 9118)
          for row_index, container_id in enumerate((9001, 9002, 9003, 9004), start=1):
              art_conditions = (f"String.IsEmpty(Container({container_id}).ListItem.Art(fanart))", f"!String.IsEmpty(Container({container_id}).ListItem.Art(poster))")
              if row_index == 1:
                  expected_visible = " + ".join([f"!Control.HasFocus({focus_id})" for focus_id in row1_exclusions] + list(art_conditions))
              else:
                  play_id = 9111 + (row_index - 1) * 2
                  expected_visible = " | ".join(" + ".join((f"Control.HasFocus({focus_id})",) + art_conditions) for focus_id in (container_id, play_id, play_id + 1))
              poster_layer = controls.find(f"./control[@id='{9139 + row_index}']")
              vignette_layer = controls.find(f"./control[@id='{9143 + row_index}']")
              if poster_layer is None or (poster_layer.findtext("left"), poster_layer.findtext("top"), poster_layer.findtext("width"), poster_layer.findtext("height"), poster_layer.findtext("texture"), poster_layer.findtext("visible")) != ("1280", "0", "640", "750", f"$INFO[Container({container_id}).ListItem.Art(poster)]", expected_visible):
                  errors.append(f"Home row {container_id} is missing its conditional poster-led hero panel")
              else:
                  aspect = poster_layer.find("aspectratio")
                  if aspect is None or aspect.text != "keep" or aspect.attrib != {"align": "center", "aligny": "center"}:
                      errors.append(f"Home row {container_id} poster hero must preserve portrait aspect ratio")
              if vignette_layer is None or (vignette_layer.findtext("left"), vignette_layer.findtext("top"), vignette_layer.findtext("width"), vignette_layer.findtext("height"), vignette_layer.findtext("texture"), vignette_layer.findtext("visible")) != ("1280", "0", "640", "750", "hero-poster-vignette.png", expected_visible):
                  errors.append(f"Home row {container_id} is missing its poster edge vignette")
          vignette_path = root / "media/hero-poster-vignette.png"
          if not vignette_path.is_file():
              errors.append("Packaged poster-led hero vignette is missing")
          else:
              vignette_data = vignette_path.read_bytes()
              if vignette_data[:8] != bytes.fromhex("89504e470d0a1a0a") or struct.unpack(">II", vignette_data[16:24]) != (640, 750):
                  errors.append("Poster-led hero vignette must be a valid 640x750 PNG")
              else:
                  offset, compressed = 8, bytearray()
                  while offset < len(vignette_data):
                      chunk_length = int.from_bytes(vignette_data[offset:offset + 4], "big")
                      chunk_type = vignette_data[offset + 4:offset + 8]
                      if chunk_type == b"IDAT":
                          compressed.extend(vignette_data[offset + 8:offset + 8 + chunk_length])
                      offset += chunk_length + 12
                  decoded = zlib.decompress(bytes(compressed))
                  stride = 1 + 640 * 4
                  alpha_at = lambda x: decoded[(375 * stride) + 1 + x * 4 + 3]
                  if len(decoded) != stride * 750 or not (
                      alpha_at(0) >= 220 and alpha_at(70) >= 220
                      and 70 <= alpha_at(100) <= 110 and alpha_at(140) < 10
                      and alpha_at(320) < 10 and alpha_at(500) < 10
                      and 70 <= alpha_at(540) <= 110 and alpha_at(570) >= 220
                      and alpha_at(639) >= 220
                  ):
                      errors.append("Poster-led hero vignette must align its soft fade to the fitted 2:3 poster edges")
          bottom_shade = controls.find("./control[@id='9106']")
