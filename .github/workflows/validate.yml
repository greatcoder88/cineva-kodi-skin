name: CINÉVA static validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate XML and add-on manifest
        run: |
          python - <<'PY'
          import pathlib, sys, xml.etree.ElementTree as ET
          root = pathlib.Path("skin.cineva")
          if not root.is_dir():
              print("skin.cineva/ source directory is not present yet")
              sys.exit(1)
          files = sorted(root.rglob("*.xml"))
          if not files:
              print("No XML files found")
              sys.exit(1)
          errors = []
          for path in files:
              try:
                  ET.parse(path)
              except ET.ParseError as exc:
                  errors.append(f"{path}: {exc}")
          manifest = root / "addon.xml"
          if not manifest.exists():
              errors.append("skin.cineva/addon.xml is missing")
          if errors:
              print("\\n".join(errors))
              sys.exit(1)
          print(f"Parsed {len(files)} XML files successfully")
          PY
