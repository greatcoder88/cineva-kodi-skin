name: CINÉVA automated checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  widget-manager-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build release ZIP from runtime source fixes
        run: python tools/build_skin_archive.py
      - name: Expand uploaded CINÉVA archive
        run: |
          test -s skin.cineva-0.5.3.zip
          unzip -q skin.cineva-0.5.3.zip -d .
      - name: Python syntax
        run: python -m compileall -q tools/build_skin_archive.py tools/download_test_posters.py tools/script.cineva.widgets tools/test-fixtures/plugin.video.pov
      - name: Validate GUI artwork JPEG signature contract
        run: |
          python - <<'PY'
          import runpy
          module = runpy.run_path("tools/download_test_posters.py")
          assert module["JPEG_SIGNATURE"] == bytes.fromhex("ffd8ff")
          print("GUI artwork downloader uses the correct JPEG SOI signature.")
          PY
      - name: Widget manager unit tests (Kodi API mocked)
        run: python -m unittest discover -s tests -v
      - name: Validate packaged skin and widget settings
        run: |
          python - <<'PY'
          import pathlib
          import sys
          import xml.etree.ElementTree as ET
          root = pathlib.Path("skin.cineva")
          files = sorted(root.rglob("*.xml"))
          errors = []
          for path in files:
              try:
                  tree = ET.parse(path)
                  if path.parent.name == "xml" and path.name.startswith("custom"):
                      wid = tree.getroot().attrib.get("id")
                      if wid and path.stem != "custom" + wid:
                          errors.append(f"{path}: custom window filename/id mismatch")
              except ET.ParseError as exc:
                  errors.append(f"{path}: {exc}")
          home = ET.parse(root / "xml/Home.xml").getroot()
          if home.findtext("defaultcontrol") != "1001":
              errors.append("Home default focus must be navigation control 1001")
          if (home.findtext("onload") or "").strip() != "RunScript(script.cineva.widgets,action=init)":
              errors.append("Home must initialize widgets through the Python manager")
          confirm = ET.parse(root / "xml/DialogConfirm.xml").getroot()
          if confirm.findtext("defaultcontrol") != "11":
              errors.append("Keep Skin must default to Yes (control 11)")
          for button in confirm.findall(".//control[@type='button']"):
              if button.findtext("texturefocus") != "focus-bar.png" or button.findtext("texturenofocus") != "black.png":
                  errors.append("Keep Skin buttons need explicit visible textures")
          startup = ET.parse(root / "xml/Startup.xml").getroot()
          if startup.find("defaultcontrol") is not None or startup.find(".//control[@id='50']") is not None:
              errors.append("Startup.xml still focuses the empty panel")
          if (startup.findtext("onload") or "").strip() != "ActivateWindow(Home)":
              errors.append("Startup.xml must hand off to Home")
          row_positions = ((370, 406), (715, 751), (1060, 1096), (1405, 1441))
          controls = home.find("controls")
          topbar_index = next((i for i, node in enumerate(list(controls))
                               if node.tag == "include" and (node.text or "").strip() == "CinevaTopBar"), -1)
          shade_index = next((i for i, node in enumerate(list(controls))
                              if node.tag == "control" and node.findtext("texture") == "hero-shade.png"), -1)
          if topbar_index <= shade_index:
              errors.append("CINÉVA top navigation is layered underneath the hero artwork")
          for index, (heading_top, shelf_top) in enumerate(row_positions, 1):
              heading = next((c for c in controls.findall("control")
                              if c.get("type") == "label"
                              and c.findtext("label") == f"$INFO[Skin.String(Cineva.Widget{index}.Name)]"), None)
              shelf = controls.find(f"./control[@type='fixedlist'][@id='{9000 + index}']")
              if heading is None or heading.findtext("top") != str(heading_top):
                  errors.append(f"Home widget {index} heading overlaps the shelf above")
              if shelf is None or shelf.findtext("top") != str(shelf_top) or shelf.findtext("height") != "300":
                  errors.append(f"Home widget {index} shelf geometry is incorrect")
          nav = next((g for g in controls.findall("control") if g.get("type") == "group" and g.find("./control[@id='1001']") is not None), None)
          if nav is None or any(button.findtext("focusedcolor") != "white" or button.findtext("texturefocus") != "focus-bar.png" for button in nav.findall("./control[@type='button']")):
              errors.append("Home navigation buttons need visible explicit textures and text color")
          if controls.find("./control[@id='9010']") is not None:
              errors.append("Floating More Widgets button still obscures the fourth shelf")
          includes = ET.parse(root / "xml/Includes.xml").getroot()
          poster = includes.find("./include[@name='CinevaPosterItem']")
          if poster is None or poster.findtext("./control[@type='image']/height") != "276" or poster.findtext("./control[@type='label']/width") != "270":
              errors.append("Poster image geometry is not the redesigned large-card layout")
          catalogue = ET.parse(root / "xml/MyVideoNav.xml").getroot()
          panel = catalogue.find("./controls/control[@type='panel']")
          layout = panel.find("itemlayout") if panel is not None else None
          if panel is None or (panel.findtext("left"), panel.findtext("top"), panel.findtext("width"), panel.findtext("height")) != ("54", "252", "1812", "790"):
              errors.append("Catalogue panel is not using the full-width cinematic grid")
          if layout is None or (layout.get("width"), layout.get("height")) != ("300", "350"):
              errors.append("Catalogue poster cards are missing the redesigned grid geometry")
          details = ET.parse(root / "xml/DialogVideoInfo.xml").getroot()
          detail_poster = next((c for c in details.findall("./controls/control") if c.get("type") == "image" and c.findtext("texture") == "$INFO[ListItem.Art(poster)]"), None)
          detail_plot = details.find("./controls/control[@type='textbox']")
          if detail_poster is None or (detail_poster.findtext("left"), detail_poster.findtext("top"), detail_poster.findtext("width"), detail_poster.findtext("height")) != ("1260", "116", "430", "650"):
              errors.append("Video details poster is not in the redesigned right-side composition")
          if detail_plot is None or (detail_plot.findtext("left"), detail_plot.findtext("top"), detail_plot.findtext("width"), detail_plot.findtext("height")) != ("104", "350", "1000", "300"):
              errors.append("Video details synopsis is not using the redesigned text column")
          osd = ET.parse(root / "xml/VideoOSD.xml").getroot()
          osd_progress = osd.find("./controls/control[@type='progress']")
          if osd_progress is None or (osd_progress.findtext("left"), osd_progress.findtext("top"), osd_progress.findtext("width")) != ("80", "880", "1760"):
              errors.append("Player OSD seek bar is not using the full-width layout")
          search = ET.parse(root / "xml/custom11112.xml").getroot()
          if any(button.findtext("texturefocus") != "focus-bar.png" for button in search.findall(".//control[@type='button']")):
              errors.append("Search hub buttons are missing the unified focus treatment")
          skin = ET.parse(root / "addon.xml").getroot()
          if skin.attrib.get("version") != "0.5.3":
              errors.append("Skin ZIP version is not 0.5.3")
          settings = ET.parse("tools/script.cineva.widgets/resources/settings.xml").getroot()
          registry = settings.find(".//setting[@id='widget_registry']")
          if registry is None or registry.attrib.get("type") != "string":
              errors.append("widget_registry must be declared as a string setting")
          if errors:
              print("\n".join(errors))
              sys.exit(1)
          print(f"Validated {len(files)} skin XML files and widget settings.")
          PY
