name: CINÉVA automated checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  widget-manager-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python syntax
        run: python -m compileall -q tools/script.cineva.widgets
      - name: Widget manager unit tests (Kodi API mocked)
        run: python -m unittest discover -s tests -v
      - name: Validate XML when skin source is present
        run: |
          python - <<'PY'
          import pathlib, sys, xml.etree.ElementTree as ET
          root = pathlib.Path("skin.cineva")
          if not root.is_dir():
              print("Skin source is not yet committed; widget-manager tests completed.")
              sys.exit(0)
          files = sorted(root.rglob("*.xml"))
          errors = []
          for path in files:
              try:
                  tree = ET.parse(path)
                  if path.parent.name == "xml" and path.name.startswith("custom"):
                      wid = tree.getroot().attrib.get("id")
                      if wid and path.stem != "custom" + wid:
                          errors.append(f"{path}: custom window filename/id mismatch")
              except ET.ParseError as exc:
                  errors.append(f"{path}: {exc}")
          if errors:
              print("\\n".join(errors))
              sys.exit(1)
          print(f"Parsed {len(files)} skin XML files successfully")
          PY
