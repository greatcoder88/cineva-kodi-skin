name: CINÉVA automated checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  widget-manager-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build release ZIP from runtime source fixes (idempotence check)
        run: |
          python tools/build_skin_archive.py
          python tools/build_skin_archive.py
      - name: Expand uploaded CINÉVA archive
        run: |
          test -s skin.cineva-0.5.3.zip
          unzip -q skin.cineva-0.5.3.zip -d .
      - name: Python syntax
        run: python -m compileall -q tools/build_skin_archive.py tools/download_test_posters.py tools/script.cineva.widgets tools/test-fixtures/plugin.video.pov
      - name: Validate GUI artwork JPEG signature contract
        run: |
          python - <<'PY'
          import runpy
          module = runpy.run_path("tools/download_test_posters.py")
          assert module["JPEG_SIGNATURE"] == bytes.fromhex("ffd8ff")
          print("GUI artwork downloader uses the correct JPEG SOI signature.")
          PY
      - name: Widget manager unit tests (Kodi API mocked)
        run: python -m unittest discover -s tests -v
      - name: Validate packaged skin and widget settings
        run: |
          python - <<'PY'
          import pathlib
          import sys
          import zlib
          import xml.etree.ElementTree as ET
          root = pathlib.Path("skin.cineva")
          files = sorted(root.rglob("*.xml"))
          errors = []
          for path in files:
              try:
                  tree = ET.parse(path)
                  if path.parent.name == "xml" and path.name.startswith("custom"):
                      wid = tree.getroot().attrib.get("id")
                      if wid and path.stem != "custom" + wid:
                          errors.append(f"{path}: custom window filename/id mismatch")
              except ET.ParseError as exc:
                  errors.append(f"{path}: {exc}")
          home = ET.parse(root / "xml/Home.xml").getroot()
          if home.findtext("defaultcontrol") != "1001":
              errors.append("Home default focus must be navigation control 1001")
          if (home.findtext("onload") or "").strip() != "RunScript(script.cineva.widgets,action=init)":
              errors.append("Home must initialize widgets through the Python manager")
          confirm = ET.parse(root / "xml/DialogConfirm.xml").getroot()
          if confirm.findtext("defaultcontrol") != "11":
              errors.append("Keep Skin must default to Yes (control 11)")
          for button in confirm.findall(".//control[@type='button']"):
              if button.findtext("texturefocus") != "focus-bar.png" or button.findtext("texturenofocus") != "black.png":
                  errors.append("Keep Skin buttons need explicit visible textures")
          startup = ET.parse(root / "xml/Startup.xml").getroot()
          if startup.find("defaultcontrol") is not None or startup.find(".//control[@id='50']") is not None:
              errors.append("Startup.xml still focuses the empty panel")
          if (startup.findtext("onload") or "").strip() != "ActivateWindow(Home)":
              errors.append("Startup.xml must hand off to Home")
          controls = home.find("controls")
          hero_group = next((g for g in controls.findall("control") if g.get("type") == "group" and g.findtext("control/label", "").startswith("$INFO[Container(")), None)
          hero_title = next((c for c in hero_group.findall("control") if c.get("type") == "label" and "$INFO[Container(9001).ListItem.Label]" in c.findtext("label", "")), None) if hero_group is not None else None
          hero_plot = hero_group.find("./control[@type='textbox']") if hero_group is not None else None
          hero_meta = next((c for c in hero_group.findall("control") if c.get("type") == "label" and "$INFO[Container(9001).ListItem.Year]" in c.findtext("label", "")), None) if hero_group is not None else None
          if hero_group is None or hero_group.findtext("top") != "118" or hero_title is None or hero_title.findtext("top") != "0" or hero_title.findtext("height") != "84" or hero_meta is None or hero_meta.findtext("top") != "88" or hero_meta.findtext("font") != "font10" or hero_meta.findtext("textcolor") != "silver" or hero_plot is None or (hero_plot.findtext("top"), hero_plot.findtext("height"), hero_plot.findtext("font")) != ("142", "72", "font13"):
              errors.append("Home hero must present title first, metadata second and synopsis third with distinct baselines")
          for group in (g for g in controls.findall("control") if g.get("type") == "group" and g.findtext("control/label", "").startswith("$INFO[Container(")):
              source_label = group.findtext("control/label", "")
              container_id = int(source_label.split("Container(", 1)[1].split(")", 1)[0])
              metadata = next((c for c in group.findall("control") if c.get("type") == "label" and ".ListItem.Year]" in c.findtext("label", "")), None)
              expected = (f"$INFO[Container({container_id}).ListItem.Year]"
                          f"$INFO[Container({container_id}).ListItem.Duration,  •  ]"
                          f"$INFO[Container({container_id}).ListItem.Genre,  •  ]"
                          f"$INFO[Container({container_id}).ListItem.Rating,  •  ]")
              if metadata is None or metadata.findtext("label") != expected:
                  errors.append(f"Home hero {container_id} metadata must omit separators for empty fields")
          topbar_index = next((i for i, node in enumerate(list(controls))
                               if node.tag == "include" and (node.text or "").strip() == "CinevaTopBar"), -1)
          shade_index = next((i for i, node in enumerate(list(controls))
                              if node.tag == "control" and node.findtext("texture") == "hero-shade.png"), -1)
          if topbar_index <= shade_index:
              errors.append("CINÉVA top navigation is layered underneath the hero artwork")
          top_shade = controls.find("./control[@id='9100']")
          top_texture = top_shade.find("texture") if top_shade is not None else None
          if top_shade is None or top_shade.findtext("height") != "320" or top_texture is None or top_texture.attrib.get("flipy") != "true":
              errors.append("Home hero is missing the mirrored top fade for readable navigation")
          left_shade = controls.find("./control[@id='9105']")
          if left_shade is None or (left_shade.findtext("left"), left_shade.findtext("top"), left_shade.findtext("width"), left_shade.findtext("height")) != ("0", "0", "1920", "440") or left_shade.findtext("texture") != "hero-left-shade.png":
              errors.append("Home hero is missing the cinematic left-side contrast overlay")
          left_shade_index = next((i for i, node in enumerate(list(controls)) if node is left_shade), -1)
          if left_shade_index < 0 or topbar_index <= left_shade_index:
              errors.append("CINÉVA top navigation must render above the hero contrast overlay")
          hero_artwork = [node for node in controls.findall("control")
                          if node.get("type") == "image" and node.findtext("texture", "").startswith("$INFO[Container(")]
          hero_shade = next((node for node in controls.findall("control")
                             if node.get("type") == "image" and node.findtext("texture") == "hero-shade.png"), None)
          if len(hero_artwork) != 4 or any(node.findtext("height") != "660" for node in hero_artwork) or hero_shade is None or hero_shade.findtext("height") != "660":
              errors.append("Home hero fanart and shade must extend through the lower-row transition")
          for container_id, play_id in ((9002, 9113), (9003, 9115), (9004, 9117)):
              artwork = next((node for node in hero_artwork if f"Container({container_id})" in node.findtext("texture", "")), None)
              expected_art_visibility = " | ".join(
                  f"Control.HasFocus({focus_id}) + !String.IsEmpty(Container({container_id}).ListItem.Art(fanart))"
                  for focus_id in (container_id, play_id, play_id + 1)
              )
              if artwork is None or artwork.findtext("visible") != expected_art_visibility:
                  errors.append(f"Home row {container_id} hero fanart must remain visible while its actions are focused")
          bottom_shade = controls.find("./control[@id='9106']")
          if bottom_shade is None or (bottom_shade.findtext("left"), bottom_shade.findtext("top"), bottom_shade.findtext("width"), bottom_shade.findtext("height")) != ("0", "320", "1920", "430") or bottom_shade.findtext("texture") != "hero-bottom-fade.png":
              errors.append("Home hero is missing the extended full-width fade into the poster shelves")
          bottom_fade_path = root / "media/hero-bottom-fade.png"
          if not bottom_fade_path.is_file():
              errors.append("Packaged hero-to-shelf fade texture is missing")
          else:
              bottom_fade_data = bottom_fade_path.read_bytes()
              if bottom_fade_data[:8] != bytes.fromhex("89504e470d0a1a0a") or (int.from_bytes(bottom_fade_data[16:20], "big"), int.from_bytes(bottom_fade_data[20:24], "big")) != (1920, 430):
                  errors.append("Packaged hero-to-shelf fade texture must be a 1920x430 PNG")
          overlay_path = root / "media/hero-left-shade.png"
          if not overlay_path.is_file():
              errors.append("Packaged hero contrast texture is missing")
          else:
              overlay_data = overlay_path.read_bytes()
              if overlay_data[:8] != bytes.fromhex("89504e470d0a1a0a") or (int.from_bytes(overlay_data[16:20], "big"), int.from_bytes(overlay_data[20:24], "big")) != (1920, 440):
                  errors.append("Packaged hero contrast texture must be a 1920x440 PNG")
          scroll_mask_path = root / "media/rail-scroll-mask.png"
          if not scroll_mask_path.is_file():
              errors.append("Packaged lower-row scroll mask is missing")
          else:
              scroll_mask_data = scroll_mask_path.read_bytes()
              if scroll_mask_data[:8] != bytes.fromhex("89504e470d0a1a0a") or (int.from_bytes(scroll_mask_data[16:20], "big"), int.from_bytes(scroll_mask_data[20:24], "big")) != (1920, 220):
                  errors.append("Packaged lower-row scroll mask must be a 1920x220 PNG")
              else:
                  offset = 8
                  idat = bytearray()
                  while offset < len(scroll_mask_data):
                      chunk_length = int.from_bytes(scroll_mask_data[offset:offset + 4], "big")
                      chunk_type = scroll_mask_data[offset + 4:offset + 8]
                      chunk_data = scroll_mask_data[offset + 8:offset + 8 + chunk_length]
                      if chunk_type == b"IDAT":
                          idat.extend(chunk_data)
                      offset += chunk_length + 12
                  decoded = zlib.decompress(bytes(idat))
                  stride = 1 + 1920 * 4
                  alpha_at = lambda row: decoded[row * stride + 1 + 3]
                  if len(decoded) != stride * 220 or alpha_at(0) != 0 or not (70 <= alpha_at(109) <= 130) or alpha_at(219) < 190:
                      errors.append("Lower-row scroll mask must use a gradual 0-to-200 alpha fade, not an opaque 16px band")
          rail_list = controls.find("./control[@type='grouplist'][@id='9050']")
          if rail_list is None or (rail_list.findtext("left"), rail_list.findtext("top"), rail_list.findtext("width"), rail_list.findtext("height")) != ("105", "410", "1710", "670") or (rail_list.findtext("orientation"), rail_list.findtext("itemgap"), rail_list.findtext("scrolltime")) != ("vertical", "12", "220"):
              errors.append("Home rails must use the pinned-hero vertical scrolling viewport")
          scroll_mask = controls.find("./control[@id='9107']")
          expected_scroll_focus = " | ".join(f"Control.HasFocus({control_id})" for control_id in (9002, 9113, 9114, 9003, 9115, 9116, 9004, 9117, 9118))
          if scroll_mask is None or (scroll_mask.findtext("left"), scroll_mask.findtext("top"), scroll_mask.findtext("width"), scroll_mask.findtext("height")) != ("0", "350", "1920", "220") or scroll_mask.findtext("texture") != "rail-scroll-mask.png" or scroll_mask.findtext("visible") != expected_scroll_focus:
              errors.append("Home lower-row focus must fade the previous rail beneath the pinned hero")
          if rail_list is not None and scroll_mask is not None and list(controls).index(scroll_mask) <= list(controls).index(rail_list):
              errors.append("Home lower-row scroll mask must render above the scrolling poster rails")
          home_hero_groups = [group for group in controls.findall("control")
                              if group.get("type") == "group"
                              and group.findtext("control/label", "").startswith("$INFO[Container(")]
          if scroll_mask is not None and (not home_hero_groups or any(list(controls).index(group) <= list(controls).index(scroll_mask) for group in home_hero_groups)):
              errors.append("Home hero titles and actions must render above the lower-row scroll mask")
          rail_children = [child for child in rail_list if child.tag == "control"] if rail_list is not None else []
          if len(rail_children) != 4:
              errors.append("Home scrolling viewport must contain four grouped heading/shelf rows")
          for container_id, play_id, nav_target in ((9001, 9111, 1001), (9002, 9113, 1001), (9003, 9115, 1002), (9004, 9117, 1003)):
              hero_groups = [group for group in controls.findall("control")
                             if group.get("type") == "group"
                             and group.findtext("control/label", "").startswith(f"$INFO[Container({container_id}).ListItem.Label]")]
              hero_group = next((group for group in hero_groups
                                 if group.find(f"./control[@id='{play_id}']") is not None), None)
              buttons = hero_group.findall("./control[@type='button']") if hero_group is not None else []
              if hero_group is None or int(hero_group.findtext("height", "0")) < 270 or len(buttons) != 2 or [button.findtext("label") for button in buttons] != ["PLAY", "MORE INFO"]:
                  errors.append(f"Home row {container_id} is missing its two nested hero actions")
                  continue
              if buttons[0].findtext("onclick") != f"PlayMedia($INFO[Container({container_id}).ListItem.File])":
                  errors.append(f"Home row {container_id} PLAY action is not bound to its selected item")
              if [node.text for node in buttons[1].findall("onclick")] != [f"SetFocus({container_id})", "Action(Info)"]:
                  errors.append(f"Home row {container_id} MORE INFO action is not bound to its selected item")
              if any(button.findtext("texturefocus") != "focus-bar.png" for button in buttons) or [button.findtext("texturenofocus") for button in buttons] != ["white.png", "black.png"] or [button.findtext("textcolor") for button in buttons] != ["black", "white"]:
                  errors.append(f"Home row {container_id} hero actions are missing their contrasting surfaces and focus treatment")
              if container_id == 9001:
                  visibility = hero_group.findtext("visible", "")
                  excluded_focus = (9002, 9113, 9114, 9003, 9115, 9116, 9004, 9117, 9118)
                  if len(hero_groups) != 1 or any(f"!Control.HasFocus({control_id})" not in visibility for control_id in excluded_focus):
                      errors.append("Home row 1 must use one consolidated hero group that stays visible for its poster/actions and yields to rows 2–4")
              row_group = rail_list.find(f"./control[@type='group'][@id='{9060 + container_id - 9000}']") if rail_list is not None else None
              shelf = row_group.find(f"./control[@type='fixedlist'][@id='{container_id}']") if row_group is not None else None
              if shelf is None or shelf.findtext("onup") != f"SetFocus({play_id})" or row_group.findtext("onup") != f"SetFocus({play_id})":
                  errors.append(f"Home row {container_id} cannot navigate up to its hero actions")
          for index in range(1, 5):
              row_group = rail_children[index - 1] if len(rail_children) == 4 else None
              row_controls = [child for child in row_group if child.tag == "control"] if row_group is not None else []
              heading = row_controls[0] if len(row_controls) == 3 else None
              row_accent = row_controls[1] if len(row_controls) == 3 else None
              shelf = row_controls[2] if len(row_controls) == 3 else None
              if row_group is None or row_group.get("type") != "group" or row_group.get("id") != str(9060 + index) or row_group.findtext("height") != "430":
                  errors.append(f"Home widget {index} must be one grouped row inside the scrolling viewport")
              if heading is None or heading.get("type") != "label" or heading.findtext("label") != f"$INFO[Skin.String(Cineva.Widget{index}.Name)]" or (heading.findtext("top"), heading.findtext("height")) != ("0", "32") or heading.findtext("font") != "font18":
                  errors.append(f"Home widget {index} heading is missing from its row group")
              if row_accent is None or row_accent.get("type") != "image" or (row_accent.findtext("left"), row_accent.findtext("top"), row_accent.findtext("width"), row_accent.findtext("height")) != ("0", "34", "58", "3") or row_accent.findtext("texture") != "focus-bar.png" or row_accent.findtext("visible") != f"Control.HasFocus({9000 + index})":
                  errors.append(f"Home widget {index} is missing its active-rail accent")
              if shelf is None or shelf.get("type") != "fixedlist" or shelf.get("id") != str(9000 + index) or (shelf.findtext("top"), shelf.findtext("height")) != ("38", "390") or shelf.findtext("onup") != f"SetFocus({9111 + (index - 1) * 2})":
                  errors.append(f"Home widget {index} shelf geometry or upward focus route is incorrect")
              later_focus_ids = [control_id for later_index in range(index + 1, 5)
                                 for control_id in (9000 + later_index, 9111 + (later_index - 1) * 2, 9112 + (later_index - 1) * 2)]
              if later_focus_ids:
                  hide_previous_row = " + ".join(f"!Control.HasFocus({control_id})" for control_id in later_focus_ids)
                  expected_visibility = f"!String.IsEmpty(Skin.String(Cineva.Widget{index}.Path)) + {hide_previous_row}"
                  if heading is None or heading.findtext("visible") != expected_visibility or shelf is None or shelf.findtext("visible") != expected_visibility:
                      errors.append(f"Home widget {index} must stop painting passed shelves while preserving its grouplist row")
              elif heading is None or heading.findtext("visible") != f"!String.IsEmpty(Skin.String(Cineva.Widget{index}.Path))" or shelf is None or shelf.findtext("visible") != f"!String.IsEmpty(Skin.String(Cineva.Widget{index}.Path))":
                  errors.append("Final Home shelf must remain visible without a later-row focus gate")
              if shelf is not None:
                  expected_down = f"SetFocus({9000 + index + 1})" if index < 4 else "SetFocus(1001)"
                  if shelf.findtext("ondown") != expected_down or row_group.findtext("ondown") != expected_down:
                      errors.append(f"Home widget {index} shelf cannot move down to the next row")
                  for layout in shelf.findall("./itemlayout") + shelf.findall("./focusedlayout"):
                      if (layout.get("width"), layout.get("height")) != ("285", "390"):
                          errors.append(f"Home widget {index} poster cards do not use the 6-up rail geometry")
          nav = next((g for g in controls.findall("control") if g.get("type") == "group" and g.find("./control[@id='1001']") is not None), None)
          if nav is None or any(button.findtext("focusedcolor") != "white" or button.findtext("texturefocus") != "focus-bar.png" for button in nav.findall("./control[@type='button']")):
              errors.append("Home navigation buttons need visible explicit textures and text color")
          if nav is not None:
              expected_down = {"1001": "9111", "1002": "9115", "1003": "9117"}
              for button_id, target_id in expected_down.items():
                  button = nav.find(f"./control[@id='{button_id}']")
                  if button is None or button.findtext("ondown") != f"SetFocus({target_id})":
                      errors.append(f"Home navigation button {button_id} does not enter its matching hero actions")
              active_marker = nav.find("./control[@id='9201']")
              if active_marker is None or active_marker.findtext("texture") != "focus-bar.png" or active_marker.findtext("visible") != "Window.IsActive(home)":
                  errors.append("Home navigation must retain its active-section marker after focus moves into the shelves")
          if controls.find("./control[@id='9010']") is not None:
              errors.append("Floating More Widgets button still obscures the fourth shelf")
          fonts = ET.parse(root / "xml/Font.xml").getroot()
          for font_file in ("Lato-Regular.ttf", "Lato-Semibold.ttf", "Lato-Black.ttf"):
              if not (root / "fonts" / font_file).is_file():
                  errors.append(f"Bundled Lato font is missing: {font_file}")
          compact_font = next((node for node in fonts.findall("./fontset[@id='Default']/font") if node.findtext("name") == "font9"), None)
          if compact_font is None or (compact_font.findtext("filename"), compact_font.findtext("size")) != ("Lato-Regular.ttf", "17"):
              errors.append("Home poster font9 must be defined at a readable 16px size")
          focus_border = pathlib.Path("skin.cineva/media/poster-focus.png").read_bytes()
          if focus_border[:8] != bytes.fromhex("89504e470d0a1a0a") or (int.from_bytes(focus_border[16:20], "big"), int.from_bytes(focus_border[20:24], "big")) != (8, 8):
              errors.append("Packaged crimson poster-focus texture is missing or has the wrong dimensions")
          resume_track = pathlib.Path("skin.cineva/media/resume-track.png").read_bytes()
          if resume_track[:8] != bytes.fromhex("89504e470d0a1a0a") or (int.from_bytes(resume_track[16:20], "big"), int.from_bytes(resume_track[20:24], "big")) != (8, 8):
              errors.append("Packaged charcoal resume-track texture is missing or has the wrong dimensions")
          includes = ET.parse(root / "xml/Includes.xml").getroot()
          poster = includes.find("./include[@name='CinevaPosterItem']")
          normal_title = poster.find("./control[@type='label']") if poster is not None else None
          focused_poster = includes.find("./include[@name='CinevaFocusedPosterItem']")
          focused_title = focused_poster.find("./control[@type='label']") if focused_poster is not None else None
          if poster is None or poster.findtext("./control[@type='image']/height") != "320" or normal_title is None or (normal_title.findtext("width"), normal_title.findtext("top"), normal_title.findtext("height"), normal_title.findtext("font"), normal_title.findtext("wrapmultiline")) != ("285", "322", "46", "font10", "true") or normal_title.find("wrap") is not None:
              errors.append("Poster image and normal title geometry is not the redesigned large-card layout")
          normal_image = poster.find("./control[@type='image']") if poster is not None else None
          if normal_image is None or normal_image.findtext("texture") != "$INFO[ListItem.Art(poster)]":
              errors.append("Home shelves must use semantic poster art, not ambiguous thumbnail/fanart art")
          fixture_source = pathlib.Path("tools/test-fixtures/plugin.video.pov/default.py").read_text()
          if '"poster": poster, "thumb": fanart' not in fixture_source:
              errors.append("GUI fixture must keep portrait poster art distinct from landscape thumbnail/fanart art")
          if normal_title is None or normal_title.findtext("visible") != "!ListItem.IsSelected":
              errors.append("Normal poster title must yield to the row-aware selected-item title")
          normal_progress = poster.find("./control[@type='progress']") if poster is not None else None
          if normal_progress is None or (normal_progress.findtext("left"), normal_progress.findtext("top"), normal_progress.findtext("width"), normal_progress.findtext("height"), normal_progress.findtext("info"), normal_progress.findtext("visible"), normal_progress.findtext("texturebg")) != ("27", "308", "231", "5", "ListItem.PercentPlayed", "ListItem.IsResumable", "resume-track.png"):
              errors.append("Every resumable poster must show its thin red progress strip, even when not focused")
          if focused_title is not None:
              errors.append("Base focused poster template must not retain an unused title layer")
          for container_id in (9001, 9002, 9003, 9004):
              row_group = rail_list.find(f"./control[@type='group'][@id='{9060 + container_id - 9000}']") if rail_list is not None else None
              row = row_group.find(f"./control[@type='fixedlist'][@id='{container_id}']") if row_group is not None else None
              row_focus = row.find("./focusedlayout/include") if row is not None else None
              focus_include = includes.find(f"./include[@name='CinevaFocusedPosterItem{container_id}']")
              focus_images = focus_include.findall("./control[@type='image']") if focus_include is not None else []
              focus_labels = focus_include.findall("./control[@type='label']") if focus_include is not None else []
              focus_progresses = focus_include.findall("./control[@type='progress']") if focus_include is not None else []
              if row_focus is None or row_focus.text != f"CinevaFocusedPosterItem{container_id}":
                  errors.append(f"Home row {container_id} does not use its own focus layout")
              if len(focus_images) != 3 or focus_images[0].findtext("visible") != f"!Control.HasFocus({container_id})" or focus_images[1].findtext("visible") != f"Control.HasFocus({container_id})":
                  errors.append(f"Home row {container_id} must show a normal poster when inactive and focus artwork only when active")
              elif any(image.findtext("texture") != "$INFO[ListItem.Art(poster)]" for image in focus_images[:2]):
                  errors.append(f"Home row {container_id} must use semantic portrait poster art in both focus states")
              elif (focus_images[2].findtext("texture"), focus_images[2].findtext("visible"), focus_images[2].findtext("left"), focus_images[2].findtext("top"), focus_images[2].findtext("width"), focus_images[2].findtext("height")) != ("focus-bar.png", f"Control.HasFocus({container_id})", "104", "386", "78", "4"):
                  errors.append(f"Home row {container_id} focused poster is missing its red selection accent")
              if len(focus_labels) != 2 or focus_labels[0].findtext("visible") != f"!Control.HasFocus({container_id})" or focus_labels[1].findtext("visible") != f"Control.HasFocus({container_id})":
                  errors.append(f"Home row {container_id} must keep exactly one correctly styled title visible")
              elif (focus_labels[1].findtext("font"), focus_labels[1].findtext("top"), focus_labels[1].findtext("height"), focus_labels[1].findtext("width"), focus_labels[1].findtext("wrapmultiline")) != ("font10", "350", "36", "285", "true") or focus_labels[1].find("wrap") is not None:
                  errors.append(f"Home row {container_id} focused title must use the compact, multiline card-title treatment")
              zoom = focus_images[1].find("./animation[@effect='zoom']") if len(focus_images) > 1 else None
              if len(focus_images) > 1 and (focus_images[1].findtext("left"), focus_images[1].findtext("top"), focus_images[1].findtext("width"), focus_images[1].findtext("height")) != ("13", "-7", "260", "347"):
                  errors.append(f"Home row {container_id} focused artwork must stop above its title baseline")
              if zoom is None or (zoom.get("end"), zoom.get("time")) != ("105", "150"):
                  errors.append(f"Home row {container_id} focused poster needs the restrained, title-safe selection zoom")
              expected_progress_visibility = {
                  f"!Control.HasFocus({container_id}) + ListItem.IsResumable",
                  f"Control.HasFocus({container_id}) + ListItem.IsResumable",
              }
              if len(focus_progresses) != 2 or {p.findtext("visible") for p in focus_progresses} != expected_progress_visibility:
                  errors.append(f"Home row {container_id} must show one resumable progress strip in both inactive and active card states")
              elif any((p.findtext("left"), p.findtext("top"), p.findtext("width"), p.findtext("height"), p.findtext("info"), p.findtext("texturebg")) != ("27", "308", "231", "5", "ListItem.PercentPlayed", "resume-track.png") for p in focus_progresses):
                  errors.append(f"Home row {container_id} resume progress geometry is inconsistent between focus states")
          catalogue = ET.parse(root / "xml/MyVideoNav.xml").getroot()
          panel = catalogue.find("./controls/control[@type='panel']")
          layout = panel.find("itemlayout") if panel is not None else None
          if panel is None or (panel.findtext("left"), panel.findtext("top"), panel.findtext("width"), panel.findtext("height")) != ("54", "252", "1812", "790"):
              errors.append("Catalogue panel is not using the full-width cinematic grid")
          if layout is None or (layout.get("width"), layout.get("height")) != ("330", "390"):
              errors.append("Catalogue poster cards are missing the redesigned grid geometry")
          details = ET.parse(root / "xml/DialogVideoInfo.xml").getroot()
          detail_poster = next((c for c in details.findall("./controls/control") if c.get("type") == "image" and c.findtext("texture") == "$INFO[ListItem.Art(poster)]"), None)
          detail_plot = details.find("./controls/control[@type='textbox']")
          if detail_poster is None or (detail_poster.findtext("left"), detail_poster.findtext("top"), detail_poster.findtext("width"), detail_poster.findtext("height")) != ("1240", "100", "470", "710"):
              errors.append("Video details poster is not in the redesigned right-side composition")
          if detail_plot is None or (detail_plot.findtext("left"), detail_plot.findtext("top"), detail_plot.findtext("width"), detail_plot.findtext("height")) != ("104", "350", "1000", "300"):
              errors.append("Video details synopsis is not using the redesigned text column")
          osd = ET.parse(root / "xml/VideoOSD.xml").getroot()
          osd_progress = osd.find("./controls/control[@type='progress']")
          if osd_progress is None or (osd_progress.findtext("left"), osd_progress.findtext("top"), osd_progress.findtext("width")) != ("80", "880", "1760"):
              errors.append("Player OSD seek bar is not using the full-width layout")
          search = ET.parse(root / "xml/custom11112.xml").getroot()
          if any(button.findtext("texturefocus") != "focus-bar.png" for button in search.findall(".//control[@type='button']")):
              errors.append("Search hub buttons are missing the unified focus treatment")
          skin = ET.parse(root / "addon.xml").getroot()
          if skin.attrib.get("version") != "0.5.3":
              errors.append("Skin ZIP version is not 0.5.3")
          settings = ET.parse("tools/script.cineva.widgets/resources/settings.xml").getroot()
          registry = settings.find(".//setting[@id='widget_registry']")
          if registry is None or registry.attrib.get("type") != "string":
              errors.append("widget_registry must be declared as a string setting")
          if errors:
              print("\n".join(errors))
              sys.exit(1)
          print(f"Validated {len(files)} skin XML files and widget settings.")
          PY
