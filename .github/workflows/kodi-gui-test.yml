name: CINÉVA Kodi GUI smoke test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  kodi-gui:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Build release ZIP and commit it when source fixes change
        run: |
          python tools/build_skin_archive.py
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ] && ! git diff --quiet -- skin.cineva-0.5.3.zip; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add skin.cineva-0.5.3.zip
            git commit -m "Build updated CINÉVA 0.5.3 skin archive"
            git push origin HEAD:main || echo "::warning::Could not push rebuilt skin ZIP; GUI test still uses the rebuilt local ZIP."
          fi

      - name: Expand uploaded skin archive and prepare add-ons
        run: |
          mkdir -p artifacts
          test -s skin.cineva-0.5.3.zip
          unzip -q skin.cineva-0.5.3.zip -d .
          test -f skin.cineva/addon.xml
          test -d skin.cineva/xml
          test -f skin.cineva/xml/Home.xml
          test -f tools/script.cineva.widgets/addon.xml
          # Validate the packaged runtime fixes; never silently patch the test copy.
          python - <<'PY'
          import xml.etree.ElementTree as ET
          import zlib
          from pathlib import Path
          home = ET.parse("skin.cineva/xml/Home.xml").getroot()
          if home.findtext("defaultcontrol") != "1001":
            raise SystemExit("Home must default to HOME navigation control 1001")
          if (home.findtext("onload") or "").strip() != "RunScript(script.cineva.widgets,action=init)":
            raise SystemExit("Home must initialize widget strings through the Python manager")
          confirm = ET.parse("skin.cineva/xml/DialogConfirm.xml").getroot()
          if confirm.findtext("defaultcontrol") != "11":
            raise SystemExit("Keep Skin must default to control 11 (Yes); control 10 is No")
          for button in confirm.findall(".//control[@type='button']"):
            if button.findtext("texturefocus") != "focus-bar.png" or button.findtext("texturenofocus") != "black.png":
              raise SystemExit("Keep Skin buttons need explicit visible focus and no-focus textures")
          startup = ET.parse("skin.cineva/xml/Startup.xml").getroot()
          if startup.find("defaultcontrol") is not None or startup.find(".//control[@id='50']") is not None:
            raise SystemExit("Startup.xml still focuses the empty panel 50")
          if (startup.findtext("onload") or "").strip() != "ActivateWindow(Home)":
            raise SystemExit("Startup.xml must hand off to Home after a skin switch")
          controls = home.find("controls")
          row_focus_conditions = {f"Control.HasFocus({focus_id})" for focus_id in (9001, 9002, 9003, 9004)}
          orphan_row_accents = [node for node in controls.findall("control")
                                if node.get("type") == "image"
                                and node.findtext("texture") == "focus-bar.png"
                                and node.findtext("visible", "") in row_focus_conditions
                                and (node.findtext("left"), node.findtext("width"), node.findtext("height")) == ("0", "58", "3")]
          if orphan_row_accents:
              raise SystemExit("Home row focus accents must remain inside their scrolling shelf groups")
          hero_group = next((g for g in controls.findall("control") if g.get("type") == "group" and g.findtext("control/label", "").startswith("$INFO[Container(")), None)
          hero_title = next((c for c in hero_group.findall("control") if c.get("type") == "label" and "$INFO[Container(9001).ListItem.Label]" in c.findtext("label", "")), None) if hero_group is not None else None
          hero_plot = hero_group.find("./control[@type='textbox']") if hero_group is not None else None
          hero_meta = next((c for c in hero_group.findall("control") if c.get("type") == "label" and "$INFO[Container(9001).ListItem.Year]" in c.findtext("label", "")), None) if hero_group is not None else None
          hero_eyebrow = hero_group.find("./control[@id='9300']") if hero_group is not None else None
          if hero_group is None or hero_group.findtext("top") != "118" or hero_group.findtext("height") != "330" or hero_title is None or hero_title.findtext("top") != "24" or hero_title.findtext("height") != "84" or hero_meta is None or hero_meta.findtext("top") != "112" or hero_meta.findtext("font") != "font10" or hero_meta.findtext("textcolor") != "silver" or hero_plot is None or (hero_plot.findtext("top"), hero_plot.findtext("height"), hero_plot.findtext("font")) != ("166", "72", "font13") or hero_eyebrow is None or (hero_eyebrow.findtext("top"), hero_eyebrow.findtext("height"), hero_eyebrow.findtext("label"), hero_eyebrow.findtext("visible"), hero_eyebrow.findtext("font"), hero_eyebrow.findtext("textcolor")) != ("0", "24", "CONTINUE WATCHING", "String.Contains(Skin.String(Cineva.Widget1.Path),in_progress)", "font9", "FFE50914"):
            raise SystemExit("Home hero must present title first, metadata second and synopsis third with distinct baselines")
          for group in (g for g in controls.findall("control") if g.get("type") == "group" and g.findtext("control/label", "").startswith("$INFO[Container(")):
            source_label = group.findtext("control/label", "")
            container_id = int(source_label.split("Container(", 1)[1].split(")", 1)[0])
            metadata = next((c for c in group.findall("control") if c.get("type") == "label" and ".ListItem.Year]" in c.findtext("label", "")), None)
            expected = (f"$INFO[Container({container_id}).ListItem.Year]"
                        f"$INFO[Container({container_id}).ListItem.Duration,  •  ]"
                        f"$INFO[Container({container_id}).ListItem.Genre,  •  ]"
                        f"$INFO[Container({container_id}).ListItem.Rating,  •  ]")
            row_index = container_id - 9000
            eyebrow_base_id = 9300 + (row_index - 1) * 3
            source_path = f"Skin.String(Cineva.Widget{row_index}.Path)"
            eyebrow_specs = (
                ("CONTINUE WATCHING", f"String.Contains({source_path},in_progress)"),
                ("TRENDING NOW", f"String.Contains({source_path},trending)"),
                ("YOUR COLLECTION", f"!String.Contains({source_path},in_progress) + !String.Contains({source_path},trending)")
            )
            for offset, (expected_label, expected_visibility) in enumerate(eyebrow_specs):
                eyebrow = group.find(f"./control[@id='{eyebrow_base_id + offset}']")
                if eyebrow is None or (eyebrow.findtext("top"), eyebrow.findtext("height"), eyebrow.findtext("label"), eyebrow.findtext("visible"), eyebrow.findtext("font"), eyebrow.findtext("textcolor")) != ("0", "24", expected_label, expected_visibility, "font9", "FFE50914"):
                    raise SystemExit(f"Home hero {container_id} is missing its source-aware {expected_label} eyebrow")
            buttons = group.findall("./control[@type='button']")
            if len(buttons) != 2 or any(button.findtext("top") != "262" for button in buttons):
              raise SystemExit(f"Home hero {container_id} actions are not aligned beneath the synopsis")
            if metadata is None or metadata.findtext("label") != expected:
              raise SystemExit(f"Home hero {container_id} metadata leaves separators for empty fields")
          topbar_index = next((i for i, node in enumerate(list(controls))
                               if node.tag == "include" and (node.text or "").strip() == "CinevaTopBar"), -1)
          shade_index = next((i for i, node in enumerate(list(controls))
                              if node.tag == "control" and node.findtext("texture") == "hero-shade.png"), -1)
          if topbar_index <= shade_index:
            raise SystemExit("CINÉVA top navigation is layered underneath the hero artwork")
          top_shade = controls.find("./control[@id='9100']")
          top_texture = top_shade.find("texture") if top_shade is not None else None
          if top_shade is None or top_shade.findtext("height") != "320" or top_texture is None or top_texture.attrib.get("flipy") != "true":
            raise SystemExit("Home hero is missing the mirrored top fade for readable navigation")
          left_shade = controls.find("./control[@id='9105']")
          if left_shade is None or (left_shade.findtext("left"), left_shade.findtext("top"), left_shade.findtext("width"), left_shade.findtext("height")) != ("0", "0", "1920", "440") or left_shade.findtext("texture") != "hero-left-shade.png":
            raise SystemExit("Home hero is missing its cinematic left-side contrast overlay")
          left_shade_index = next((i for i, node in enumerate(list(controls)) if node is left_shade), -1)
          if left_shade_index < 0 or topbar_index <= left_shade_index:
            raise SystemExit("CINÉVA top navigation must be layered above the hero contrast overlay")
          topbar_shade = controls.find("./control[@id='9108']")
          topbar_shade_index = next((i for i, node in enumerate(list(controls)) if node is topbar_shade), -1)
          nav_group_index = next((i for i, node in enumerate(list(controls))
                                  if node.get("type") == "group" and node.find("./control[@id='1001']") is not None), -1)
          if topbar_shade is None or (topbar_shade.findtext("left"), topbar_shade.findtext("top"), topbar_shade.findtext("width"), topbar_shade.findtext("height"), topbar_shade.findtext("texture")) != ("0", "0", "1920", "180", "hero-topbar-shade.png") or nav_group_index <= topbar_shade_index or topbar_index <= topbar_shade_index:
            raise SystemExit("Home topbar must sit above a full-width contrast veil")
          topbar_fade_data = Path("skin.cineva/media/hero-topbar-shade.png").read_bytes()
          if topbar_fade_data[:8] != bytes.fromhex("89504e470d0a1a0a") or (int.from_bytes(topbar_fade_data[16:20], "big"), int.from_bytes(topbar_fade_data[20:24], "big")) != (1920, 180):
            raise SystemExit("Topbar contrast texture must be a 1920x180 PNG")
          offset = 8
          idat = bytearray()
          while offset < len(topbar_fade_data):
            chunk_length = int.from_bytes(topbar_fade_data[offset:offset + 4], "big")
            chunk_type = topbar_fade_data[offset + 4:offset + 8]
            chunk_data = topbar_fade_data[offset + 8:offset + 8 + chunk_length]
            if chunk_type == b"IDAT":
              idat.extend(chunk_data)
            offset += chunk_length + 12
          decoded = zlib.decompress(bytes(idat))
          stride = 1 + 1920 * 4
          alpha_at = lambda row: decoded[row * stride + 1 + 3]
          if len(decoded) != stride * 180 or not (150 <= alpha_at(0) <= 170) or not (20 <= alpha_at(90) <= 50) or alpha_at(179) != 0 or not (alpha_at(0) > alpha_at(90) > alpha_at(179)):
            raise SystemExit("Topbar contrast veil must fade smoothly from strong top opacity to transparent")
          hero_artwork = [node for node in controls.findall("control")
                          if node.get("type") == "image" and node.findtext("texture", "").startswith("$INFO[Container(")]
          hero_shade = next((node for node in controls.findall("control")
                             if node.get("type") == "image" and node.findtext("texture") == "hero-shade.png"), None)
          if len(hero_artwork) != 4 or any(node.findtext("height") != "750" for node in hero_artwork) or hero_shade is None or hero_shade.findtext("height") != "750":
            raise SystemExit("Home hero fanart and shade must extend through the lower-row transition")
          for container_id, play_id in ((9002, 9113), (9003, 9115), (9004, 9117)):
            artwork = next((node for node in hero_artwork if f"Container({container_id})" in node.findtext("texture", "")), None)
            expected_art_visibility = " | ".join(
              f"Control.HasFocus({focus_id}) + !String.IsEmpty(Container({container_id}).ListItem.Art(fanart))"
              for focus_id in (container_id, play_id, play_id + 1)
          )
            if artwork is None or artwork.findtext("visible") != expected_art_visibility:
              raise SystemExit(f"Home row {container_id} hero fanart disappears when its action buttons receive focus")
          bottom_shade = controls.find("./control[@id='9106']")
          if bottom_shade is None or (bottom_shade.findtext("left"), bottom_shade.findtext("top"), bottom_shade.findtext("width"), bottom_shade.findtext("height")) != ("0", "320", "1920", "430") or bottom_shade.findtext("texture") != "hero-bottom-fade.png":
            raise SystemExit("Home hero is missing its extended full-width fade into the poster shelves")
          bottom_fade_data = Path("skin.cineva/media/hero-bottom-fade.png").read_bytes()
          if bottom_fade_data[:8] != bytes.fromhex("89504e470d0a1a0a") or (int.from_bytes(bottom_fade_data[16:20], "big"), int.from_bytes(bottom_fade_data[20:24], "big")) != (1920, 430):
            raise SystemExit("Packaged hero-to-shelf fade texture is missing or has the wrong dimensions")
          overlay_data = Path("skin.cineva/media/hero-left-shade.png").read_bytes()
          if overlay_data[:8] != bytes.fromhex("89504e470d0a1a0a") or (int.from_bytes(overlay_data[16:20], "big"), int.from_bytes(overlay_data[20:24], "big")) != (1920, 440):
            raise SystemExit("Packaged hero contrast texture is missing or has the wrong dimensions")
          rail_list = controls.find("./control[@type='grouplist'][@id='9050']")
          if rail_list is None or (rail_list.findtext("left"), rail_list.findtext("top"), rail_list.findtext("width"), rail_list.findtext("height")) != ("105", "454", "1710", "670") or (rail_list.findtext("orientation"), rail_list.findtext("itemgap"), rail_list.findtext("scrolltime")) != ("vertical", "12", "220"):
            raise SystemExit("Home rails are missing their vertical scrolling viewport")
          scroll_mask = controls.find("./control[@id='9107']")
          expected_scroll_focus = " | ".join(f"Control.HasFocus({control_id})" for control_id in (9002, 9113, 9114, 9003, 9115, 9116, 9004, 9117, 9118))
          if scroll_mask is None or (scroll_mask.findtext("left"), scroll_mask.findtext("top"), scroll_mask.findtext("width"), scroll_mask.findtext("height")) != ("0", "320", "1920", "430") or scroll_mask.findtext("texture") != "rail-scroll-mask.png" or scroll_mask.findtext("visible") != expected_scroll_focus:
            raise SystemExit("Home lower-row focus is missing its conditional hero-to-rail scroll mask")
          if list(controls).index(scroll_mask) >= list(controls).index(rail_list):
            raise SystemExit("Home scroll mask must render behind the scrolling poster rails")
          home_hero_groups = [group for group in controls.findall("control")
                              if group.get("type") == "group"
                              and group.findtext("control/label", "").startswith("$INFO[Container(")]
          if not home_hero_groups or any(list(controls).index(group) <= list(controls).index(scroll_mask) for group in home_hero_groups):
            raise SystemExit("Home hero titles and actions must render above the lower-row scroll mask")
          scroll_mask_data = Path("skin.cineva/media/rail-scroll-mask.png").read_bytes()
          if scroll_mask_data[:8] != bytes.fromhex("89504e470d0a1a0a") or (int.from_bytes(scroll_mask_data[16:20], "big"), int.from_bytes(scroll_mask_data[20:24], "big")) != (1920, 430):
            raise SystemExit("Packaged lower-row scroll mask is missing or has the wrong dimensions")
          rail_children = [child for child in rail_list if child.tag == "control"] if rail_list is not None else []
          if len(rail_children) != 4:
            raise SystemExit("Home scrolling viewport must contain four grouped heading/shelf rows")
          for container_id, play_id, nav_target in ((9001, 9111, 1001), (9002, 9113, 1001), (9003, 9115, 1002), (9004, 9117, 1003)):
            hero_groups = [group for group in controls.findall("control")
                           if group.get("type") == "group"
                           and group.findtext("control/label", "").startswith(f"$INFO[Container({container_id}).ListItem.Label]")]
            hero_group = next((group for group in hero_groups
                               if group.find(f"./control[@id='{play_id}']") is not None), None)
            buttons = hero_group.findall("./control[@type='button']") if hero_group is not None else []
            if hero_group is None or len(buttons) != 2 or [button.findtext("label") for button in buttons] != ["PLAY", "MORE INFO"]:
              raise SystemExit(f"Home row {container_id} is missing its two nested hero actions")
            if buttons[0].findtext("onclick") != f"PlayMedia($INFO[Container({container_id}).ListItem.File])" or buttons[1].findtext("onclick") != f"SetFocus({container_id})" or [node.text for node in buttons[1].findall("onclick")] != [f"SetFocus({container_id})", "Action(Info)"]:
              raise SystemExit(f"Home row {container_id} hero actions are not wired to its selected item")
            if [button.findtext("texturenofocus") for button in buttons] != ["white.png", "black.png"] or [button.findtext("textcolor") for button in buttons] != ["black", "gainsboro"]:
              raise SystemExit(f"Home row {container_id} hero actions do not have contrasting Play/Info surfaces")
            row_group = rail_list.find(f"./control[@type='group'][@id='{9060 + container_id - 9000}']") if rail_list is not None else None
            shelf = row_group.find(f"./control[@type='fixedlist'][@id='{container_id}']") if row_group is not None else None
            if shelf is None or shelf.findtext("onup") != f"SetFocus({play_id})" or row_group.findtext("onup") != f"SetFocus({play_id})":
              raise SystemExit(f"Home row {container_id} cannot navigate up to its hero actions")
          for index in range(1, 5):
            row_group = rail_children[index - 1] if len(rail_children) == 4 else None
            row_controls = [child for child in row_group if child.tag == "control"] if row_group is not None else []
            heading = row_controls[0] if len(row_controls) == 3 else None
            row_accent = row_controls[1] if len(row_controls) == 3 else None
            shelf = row_controls[2] if len(row_controls) == 3 else None
            if row_group is None or row_group.get("type") != "group" or row_group.get("id") != str(9060 + index) or row_group.findtext("height") != "480":
              raise SystemExit(f"Home widget {index} is not a single scrollable row group")
            if heading is None or heading.get("type") != "label" or heading.findtext("label") != f"$INFO[Skin.String(Cineva.Widget{index}.Name)]" or (heading.findtext("top"), heading.findtext("height")) != ("0", "38") or heading.findtext("font") != "font18":
              raise SystemExit(f"Home widget {index} heading is missing from its row group")
            if row_accent is None or row_accent.get("type") != "image" or (row_accent.findtext("left"), row_accent.findtext("top"), row_accent.findtext("width"), row_accent.findtext("height")) != ("0", "40", "58", "3") or row_accent.findtext("texture") != "focus-bar.png" or row_accent.findtext("visible") != f"Control.HasFocus({9000 + index})":
              raise SystemExit(f"Home widget {index} is missing its active-rail accent")
            if shelf is None or shelf.get("type") != "fixedlist" or shelf.get("id") != str(9000 + index) or (shelf.findtext("top"), shelf.findtext("height")) != ("52", "420") or shelf.findtext("onup") != f"SetFocus({9111 + (index - 1) * 2})":
              raise SystemExit(f"Home widget {index} shelf geometry or upward focus route is incorrect")
            later_focus_ids = [control_id for later_index in range(index + 1, 5)
                               for control_id in (9000 + later_index, 9111 + (later_index - 1) * 2, 9112 + (later_index - 1) * 2)]
            if later_focus_ids:
              hide_previous_row = " + ".join(f"!Control.HasFocus({control_id})" for control_id in later_focus_ids)
              expected_visibility = f"!String.IsEmpty(Skin.String(Cineva.Widget{index}.Path)) + {hide_previous_row}"
              if heading is None or heading.findtext("visible") != expected_visibility or shelf is None or shelf.findtext("visible") != expected_visibility:
                raise SystemExit(f"Home widget {index} still paints a passed shelf behind the pinned hero")
            elif heading is None or heading.findtext("visible") != f"!String.IsEmpty(Skin.String(Cineva.Widget{index}.Path))" or shelf is None or shelf.findtext("visible") != f"!String.IsEmpty(Skin.String(Cineva.Widget{index}.Path))":
              raise SystemExit("Final Home shelf must remain visible without a later-row focus gate")
            expected_down = f"SetFocus({9000 + index + 1})" if index < 4 else "SetFocus(1001)"
            if shelf.findtext("ondown") != expected_down or row_group.findtext("ondown") != expected_down:
              raise SystemExit(f"Home widget {index} cannot navigate down to the next rail")
            for layout in shelf.findall("./itemlayout") + shelf.findall("./focusedlayout"):
              if (layout.get("width"), layout.get("height")) != ("285", "420"):
                raise SystemExit(f"Home widget {index} poster card geometry is not the 6-up layout")
          if controls.find("./control[@id='9010']") is not None:
            raise SystemExit("Obstructive floating More Widgets button is still present")
          fonts = ET.parse("skin.cineva/xml/Font.xml").getroot()
          for font_file in ("Lato-Regular.ttf", "Lato-SemiBold.ttf", "Lato-Black.ttf", "Poppins-Medium.ttf", "Poppins-SemiBold.ttf", "Poppins-ExtraBold.ttf"):
            if not (Path("skin.cineva/fonts") / font_file).is_file():
              raise SystemExit(f"Bundled Lato font is missing: {font_file}")
          compact_font = next((node for node in fonts.findall("./fontset[@id='Default']/font") if node.findtext("name") == "font9"), None)
          if compact_font is None or (compact_font.findtext("filename"), compact_font.findtext("size")) != ("Lato-Regular.ttf", "17"):
            raise SystemExit("Packaged Home font9 is missing its 17px Lato definition")
          hero_font = next((node for node in fonts.findall("./fontset[@id='Default']/font") if node.findtext("name") == "font36"), None)
          shelf_font = next((node for node in fonts.findall("./fontset[@id='Default']/font") if node.findtext("name") == "font18"), None)
          if hero_font is None or (hero_font.findtext("filename"), hero_font.findtext("size")) != ("Poppins-ExtraBold.ttf", "68"):
            raise SystemExit("Home hero title must use the Poppins display face at 68px")
          if shelf_font is None or (shelf_font.findtext("filename"), shelf_font.findtext("size")) != ("Poppins-SemiBold.ttf", "34"):
            raise SystemExit("Home shelf headings must use the Poppins semibold face at 34px")
          includes = ET.parse("skin.cineva/xml/Includes.xml").getroot()
          poster = includes.find("./include[@name='CinevaPosterItem']")
          normal_image = poster.find("./control[@type='image']") if poster is not None else None
          if poster is None or normal_image is None or (normal_image.findtext("left"), normal_image.findtext("top"), normal_image.findtext("width"), normal_image.findtext("height")) != ("12", "0", "261", "348") or poster.findtext("./control[@type='label']/width") != "285" or poster.findtext("./control[@type='label']/top") != "350" or poster.findtext("./control[@type='label']/height") != "46" or poster.findtext("./control[@type='label']/wrapmultiline") != "true" or poster.find("./control[@type='label']/wrap") is not None or poster.findtext("./control[@type='label']/font") != "font10":
            raise SystemExit("Home poster and title layout is missing its enlarged 3:4 artwork or readable title baseline")
          focused_poster = includes.find("./include[@name='CinevaFocusedPosterItem9001']")
          focused_title = next((label for label in focused_poster.findall("./control[@type='label']") if label.findtext("textcolor") == "white"), None) if focused_poster is not None else None
          if focused_title is None or focused_title.findtext("font") != "font10" or focused_title.findtext("top") != "370" or focused_title.findtext("height") != "42" or focused_title.find("wrap") is not None or focused_title.findtext("wrapmultiline") != "true":
            raise SystemExit("Focused poster titles must sit below the focused artwork without overlap")
          focused_image = next((node for node in focused_poster.findall("./control[@type='image']") if node.findtext("visible") == "Control.HasFocus(9001)"), None) if focused_poster is not None else None
          focused_zoom = focused_image.find("./animation[@effect='zoom']") if focused_image is not None else None
          if focused_image is None or (focused_image.findtext("left"), focused_image.findtext("top"), focused_image.findtext("width"), focused_image.findtext("height")) != ("7", "-6", "271", "361") or focused_zoom is None or (focused_zoom.get("end"), focused_zoom.get("time")) != ("104", "180"):
            raise SystemExit("Focused poster artwork must use the title-safe 106% selection zoom")
          normal_progress = poster.find("./control[@type='progress']") if poster is not None else None
          if normal_progress is None or (normal_progress.findtext("left"), normal_progress.findtext("top"), normal_progress.findtext("width"), normal_progress.findtext("height"), normal_progress.findtext("visible"), normal_progress.findtext("info"), normal_progress.findtext("texturebg")) != ("18", "337", "249", "5", "ListItem.IsResumable", "ListItem.PercentPlayed", "resume-track.png"):
            raise SystemExit("Normal poster cards must show a correctly aligned resumable progress strip on a charcoal track")
          focus_progresses = focused_poster.findall("./control[@type='progress']") if focused_poster is not None else []
          if len(focus_progresses) != 2 or {node.findtext("visible") for node in focus_progresses} != {"!Control.HasFocus(9001) + ListItem.IsResumable", "Control.HasFocus(9001) + ListItem.IsResumable"} or any(node.findtext("texturebg") != "resume-track.png" for node in focus_progresses):
            raise SystemExit("Focused poster template must retain one charcoal-track progress strip in both focus states")
          if any((node.findtext("left"), node.findtext("top"), node.findtext("width"), node.findtext("height")) != (("18", "337", "249", "5") if node.findtext("visible").startswith("!") else ("18", "345", "249", "5")) for node in focus_progresses):
