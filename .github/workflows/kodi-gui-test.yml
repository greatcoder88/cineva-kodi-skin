          test -s "$POV/resources/posters/movie-1.jpg"
          test -s "$POV/resources/posters/tv-1.jpg"
          for index in 1 2 3 4 5 6 7 8; do
            test -s "$POV/resources/posters/backdrop-$index.jpg"
            test -s "$POV/resources/posters/tv-backdrop-$index.jpg"
          done
          curl -fL --retry 3 -o /tmp/script.skinshortcuts.zip https://github.com/MikeSiLVO/script.skinshortcuts/archive/refs/tags/v3.0.1.zip
          mkdir -p "$HOME/.var/app/tv.kodi.Kodi/data/addons/script.skinshortcuts"
          unzip -q /tmp/script.skinshortcuts.zip -d /tmp/skinshortcuts
          cp -a /tmp/skinshortcuts/script.skinshortcuts-3.0.1/. "$HOME/.var/app/tv.kodi.Kodi/data/addons/script.skinshortcuts/"
          mkdir -p "$HOME/.var/app/tv.kodi.Kodi/data/userdata"
          cat > "$HOME/.var/app/tv.kodi.Kodi/data/userdata/advancedsettings.xml" <<'XML'
          <advancedsettings><loglevel hide="false">2</loglevel></advancedsettings>
          XML
          # Kodi must generate its complete settings file (including resolutions).


      - name: Launch Kodi, verify active skin through JSON-RPC, and capture GUI
        run: |
          mkdir -p artifacts
          export DISPLAY=:99
          Xvfb :99 -screen 0 1920x1080x24 -ac +extension GLX +render -noreset > /tmp/xvfb.log 2>&1 &
          echo $! > /tmp/xvfb.pid
          sleep 2
          # First boot: allow Kodi to create a valid, version-specific guisettings.xml.
          flatpak run --user tv.kodi.Kodi//beta --standalone > /tmp/kodi-firstboot.log 2>&1 &
          FIRST_PID=$!
          for i in $(seq 1 45); do
            test -s "$HOME/.var/app/tv.kodi.Kodi/data/userdata/guisettings.xml" && break
            sleep 2
          done
          test -s "$HOME/.var/app/tv.kodi.Kodi/data/userdata/guisettings.xml" || (echo "Kodi did not create guisettings.xml"; exit 1)
          kill "$FIRST_PID" 2>/dev/null || true
          # Flatpak's launcher can exit while its app process remains alive.
          # Stop the whole app, then wait for Kodi and its JSON-RPC listener to release.
          flatpak kill --user tv.kodi.Kodi 2>/dev/null || true
          pkill -x kodi.bin 2>/dev/null || true
          pkill -x kodi-x11 2>/dev/null || true
          for attempt in $(seq 1 30); do
            if ! pgrep -x kodi.bin >/dev/null && ! pgrep -x kodi-x11 >/dev/null; then break; fi
            sleep 1
          done
          if pgrep -x kodi.bin >/dev/null || pgrep -x kodi-x11 >/dev/null; then
            echo "A first-boot Kodi process survived shutdown:"
            ps -ef | grep -E '[k]odi.bin|[k]odi-x11'
            exit 1
          fi
          # Port 9090 is Kodi's raw TCP JSON-RPC endpoint. A stale listener
          # prevents the new instance from exposing the API used by GUI tests.
          if ss -ltnp | grep -q ':9090'; then
            echo "Releasing stale JSON-RPC listener before the test launch:"
            ss -ltnp | grep ':9090' || true
            sudo fuser -k 9090/tcp || true
            sleep 2
          fi
          if ss -ltnp | grep -q ':9090'; then
            echo "Port 9090 is still occupied after cleanup:"
            ss -ltnp | grep ':9090' || true
            exit 1
          fi
          sleep 2
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          p = Path.home()/".var/app/tv.kodi.Kodi/data/userdata/guisettings.xml"
          tree = ET.parse(p)
          root = tree.getroot()
          for key, value in {
            "lookandfeel.skin": "skin.cineva",
            "services.webserver": "true",
            "services.webserverport": "8080",
            "services.webserverauthentication": "false"
          }.items():
            node = root.find(f"./setting[@id='{key}']")
            if node is None: node = ET.SubElement(root, "setting", {"id": key})
            node.text = value
          tree.write(p, encoding="UTF-8", xml_declaration=True)
          print("Configured CINÉVA while preserving Kodi-generated resolution settings.")
          PY
          flatpak run --user tv.kodi.Kodi//beta --standalone > /tmp/kodi-stdout.log 2>&1 &
          echo $! > /tmp/kodi.pid
          for i in $(seq 1 60); do
            if pgrep -x kodi.bin >/dev/null || pgrep -x kodi-x11 >/dev/null; then break; fi
            sleep 2
          done
          pgrep -a -x kodi.bin || pgrep -a -x kodi-x11 || (echo "Kodi process did not start"; exit 1)
          sleep 15
          # Preserve a real Kodi framebuffer even if JSON-RPC fails before UI assertions.
          import -display :99 -window root artifacts/kodi-before-jsonrpc.png
          ss -ltnp > artifacts/listeners-before-jsonrpc.txt || true
          python - <<'PY'
          import json, socket, time, subprocess
          def rpc(method, params=None):
            request = {"jsonrpc":"2.0","method":method,"params":params or {},"id":1}
            decoder = json.JSONDecoder()
            with socket.create_connection(("127.0.0.1", 9090), timeout=5) as sock:
              sock.settimeout(5)
              # Kodi raw TCP JSON-RPC has no newline or other frame delimiter.
              sock.sendall(json.dumps(request).encode("utf-8"))
              data = ""
              deadline = time.time() + 10
              while time.time() < deadline:
                try:
                  chunk = sock.recv(65536)
                except socket.timeout:
                  continue
                if not chunk: break
                data += chunk.decode("utf-8", "replace")
                pos = 0
                while pos < len(data):
                  while pos < len(data) and data[pos].isspace(): pos += 1
                  if pos >= len(data): break
                  try:
                    obj, endpos = decoder.raw_decode(data, pos)
                  except json.JSONDecodeError:
                    break
                  pos = endpos
                  if isinstance(obj, dict) and obj.get("id") == 1:
                    if "error" in obj: raise RuntimeError(obj["error"])
                    return obj.get("result")
                data = data[pos:] if pos else data
            raise RuntimeError(f"No JSON-RPC response for {method}; received: {data[:500]!r}")
          last = None
          for attempt in range(30):
            try:
              current = rpc("Settings.GetSettingValue", {"setting":"lookandfeel.skin"})
              current_value = current.get("value") if isinstance(current, dict) else current
              print("Kodi selected skin at test start:", current_value)
              break
            except Exception as exc:
              last = exc
              print("JSON-RPC not ready yet:", repr(exc))
              time.sleep(2)
          else:
            raise SystemExit(f"GUI TEST FAILED: Kodi JSON-RPC unavailable: {last}")

          # Diagnose and explicitly enable the skin before attempting a switch.
          details = rpc("Addons.GetAddonDetails", {"addonid":"skin.cineva","properties":["enabled","version"]})
          print("CINÉVA add-on details before enable:", details)
          enabled = rpc("Addons.SetAddonEnabled", {"addonid":"skin.cineva","enabled":True})
          print("Addons.SetAddonEnabled result:", enabled)
          time.sleep(5)
          details = rpc("Addons.GetAddonDetails", {"addonid":"skin.cineva","properties":["enabled","version"]})
          print("CINÉVA add-on details after enable:", details)

          # Keep one Kodi process alive. Each cycle waits for a fresh skin load,
          # a successful widget-manager run, and a closed Keep Skin dialog.
          from pathlib import Path
          import shutil
          source = Path.cwd() / "skin.cineva"
          target = Path.home() / ".var/app/tv.kodi.Kodi/data/addons/skin.cineva"
          log_path = Path.home()/".var/app/tv.kodi.Kodi/data/temp/kodi.log"
          def log_text():
            return log_path.read_text(errors="replace") if log_path.exists() else ""
          def gui():
            return rpc("GUI.GetProperties", {"properties":["currentwindow","currentcontrol","skin"]})
          pov_details = rpc("Addons.GetAddonDetails", {"addonid":"plugin.video.pov","properties":["enabled","version"]})
          print("POV GUI fixture before enable:", pov_details)
          rpc("Addons.SetAddonEnabled", {"addonid":"plugin.video.pov","enabled":True})
          time.sleep(2)
          pov_details = rpc("Addons.GetAddonDetails", {"addonid":"plugin.video.pov","properties":["enabled","version"]})
          print("POV GUI fixture after enable:", pov_details)
          for cycle in range(1, 4):
            print(f"===== CINÉVA live test cycle {cycle}/3 =====")
            state = gui()
            if state.get("skin",{}).get("id") != "skin.estuary":
              previous_skin_loads = log_text().count("load skin from:")
              result = rpc("Settings.SetSettingValue", {"setting":"lookandfeel.skin","value":"skin.estuary"})
              print("Switched to Estuary:", result)
              # Every actual skin change opens a Keep Skin confirmation in
              # the newly selected skin. Confirm Estuary before switching back.
              deadline = time.time() + 25
              while time.time() < deadline:
                state = gui()
                if state.get("skin",{}).get("id") == "skin.estuary" and state.get("currentwindow",{}).get("id") == 10100:
                  break
                time.sleep(0.5)
              else:
                raise SystemExit(f"Cycle {cycle}: Estuary Keep Skin dialog did not open: {state}")
              estuary_label = state.get("currentcontrol",{}).get("label","").strip()
              if estuary_label.lower() != "yes":
                # Estuary's stock confirmation defaults to No; move left to
                # the explicit Yes action so the test can continue the cycle.
                subprocess.run(["xdotool","key","Left"],check=True)
                time.sleep(0.3)
                state = gui()
                estuary_label = state.get("currentcontrol",{}).get("label","").strip()
              if estuary_label.lower() != "yes":
                raise SystemExit(f"Cycle {cycle}: could not focus Yes in Estuary Keep Skin: {estuary_label!r}")
              subprocess.run(["xdotool","key","Return"],check=True)
              deadline = time.time() + 20
              while time.time() < deadline:
                state = gui()
                if state.get("skin",{}).get("id") == "skin.estuary" and state.get("currentwindow",{}).get("id") != 10100:
                  break
                time.sleep(0.5)
              else:
                raise SystemExit(f"Cycle {cycle}: Estuary confirmation did not close: {state}")
              if log_text().count("load skin from:") <= previous_skin_loads:
                raise SystemExit(f"Cycle {cycle}: Estuary skin reload was not recorded")
              time.sleep(1)
            else:
              print("Already on Estuary; skipping redundant skin switch.")
            before = log_text()
            before_loads = before.count("load skin from:")
            before_inits = before.count("CINEVA_WIDGETS_INITIALIZED=4")
            if target.exists():
              shutil.rmtree(target)
            shutil.copytree(source, target)
            print("Refreshed CINÉVA add-on files in place.")
            result = rpc("Settings.SetSettingValue", {"setting":"lookandfeel.skin","value":"skin.cineva"})
            print("Switched to CINÉVA:", result)
            deadline = time.time() + 35
            while time.time() < deadline:
              logs = log_text()
              if "EXCEPTION: Invalid setting type" in logs:
                raise SystemExit("Widget manager failed: widget_registry has an invalid setting type")
              load_count = logs.count("load skin from:")
              init_count = logs.count("CINEVA_WIDGETS_INITIALIZED=4")
              state = gui()
              if load_count > before_loads and init_count > before_inits and state.get("currentwindow",{}).get("id") == 10100:
                break
              time.sleep(0.5)
            else:
              raise SystemExit(f"Cycle {cycle}: fresh CINÉVA load, widget initialization or Keep Skin dialog was missing. Log tail:\n{log_text()[-6000:]}")
            print("Keep Skin dialog state:", state)
            time.sleep(1)
            subprocess.run(["import","-display",":99","-window","root",f"artifacts/cineva-confirmation-{cycle}.png"],check=True)
            current_label = state.get("currentcontrol",{}).get("label","").strip()
            if current_label.lower() != "yes":
              raise SystemExit(f"Cycle {cycle}: Keep Skin did not default to Yes; focused control={current_label!r}")
            subprocess.run(["xdotool","key","Return"],check=True)
            deadline = time.time() + 15
            while time.time() < deadline:
              state = gui()
              if state.get("currentwindow",{}).get("id") != 10100:
                break
              time.sleep(0.5)
            else:
              raise SystemExit(f"Cycle {cycle}: Keep Skin dialog did not close after confirming Yes")
            selected = rpc("Settings.GetSettingValue", {"setting":"lookandfeel.skin"})
            selected_value = selected.get("value") if isinstance(selected, dict) else selected
            if selected_value != "skin.cineva" or state.get("skin",{}).get("id") != "skin.cineva":
              raise SystemExit(f"Cycle {cycle}: CINÉVA not retained after confirmation: {selected}; GUI={state}")
            print("Keep Skin dialog closed; active skin:", state.get("skin"), "window:", state.get("currentwindow"))
            # Startup.xml must hand off to the real Home window; the background
            # can look like Home while currentwindow is still Startup (12999).
            deadline = time.time() + 12
            while time.time() < deadline:
              state = gui()
              current_window = state.get("currentwindow",{})
              if current_window.get("id") == 10000 or current_window.get("label","").strip().lower() == "home":
                break
              time.sleep(0.5)
            else:
              raise SystemExit(f"Cycle {cycle}: skin stayed on Startup instead of Home: {state}")
            print("Home window active:", state.get("currentwindow"))
            paths = [
              "plugin://plugin.video.pov/?mode=build_movie_list&action=in_progress_movies&name=Continue%20Watching%20Movies",
              "plugin://plugin.video.pov/?mode=build_tvshow_list&action=in_progress_tvshows&name=Continue%20Watching%20TV%20Shows",
              "plugin://plugin.video.pov/?mode=build_movie_list&action=tmdb_movies_trending&name=Trending%20Movies",
              "plugin://plugin.video.pov/?mode=build_tvshow_list&action=tmdb_tv_trending&name=Trending%20TV%20Shows",
            ]
            hero_fanart_by_row = {}
            for row, path in enumerate(paths, 1):
              directory = rpc("Files.GetDirectory", {"directory":path,"media":"video","properties":["title","file","thumbnail","art"]})
              items = directory.get("files",[]) if isinstance(directory,dict) else []
              posters = [item.get("thumbnail") or (item.get("art") or {}).get("poster") or (item.get("art") or {}).get("thumb") for item in items]
              fanarts = [(item.get("art") or {}).get("fanart") for item in items]
              poster_count = sum(1 for poster in posters if poster)
              unique_posters = len(set(poster for poster in posters if poster))
              unique_fanarts = len(set(fanart for fanart in fanarts if fanart))
              if fanarts:
                hero_fanart_by_row[row] = fanarts[0]
              print(f"Widget row {row}: items={len(items)}, poster_art={poster_count}, unique_posters={unique_posters}, unique_fanarts={unique_fanarts}, first={items[0] if items else None}")
              if len(items) < 8 or poster_count < 8 or unique_posters < 8 or unique_fanarts < 8:
                raise SystemExit(f"Widget row {row} did not return eight distinct poster-backed and fanart-backed items")
            if hero_fanart_by_row.get(1) == hero_fanart_by_row.get(2):
              raise SystemExit("Movie and TV Home rows share the same hero fanart; dynamic hero switching cannot be visually verified")
            rpc("Input.Down")  # Home navigation -> PLAY action
            rpc("Input.Down")  # PLAY action -> first poster
            deadline = time.time() + 12
            focused_label = ""
            while time.time() < deadline:
              state = gui()
              focused_label = state.get("currentcontrol",{}).get("label","").strip()
              if focused_label == "The Shawshank Redemption":
                break
              time.sleep(0.5)
            if focused_label != "The Shawshank Redemption":
              raise SystemExit(f"Home shelf 9001 did not focus its first item: {state}")
            print("Home poster shelf focused on:", focused_label)
            time.sleep(0.8)
            subprocess.run(["import","-display",":99","-window","root",f"artifacts/cineva-home-cycle-{cycle}.png"],check=True)
            if cycle == 1:
              # Derive the progress strip from the packaged Home rail and poster
              # layout. Its actual screen row is rail.top + row.top + shelf.top
              # + progress.top, not the artwork/title area; the crop follows the XML geometry.
              import xml.etree.ElementTree as ET
              home_root = ET.parse("skin.cineva/xml/Home.xml").getroot()
              includes_root = ET.parse("skin.cineva/xml/Includes.xml").getroot()
              rail = home_root.find("./controls/control[@type='grouplist'][@id='9050']")
              first_row = rail.find("./control[@id='9061']") if rail is not None else None
              shelf = first_row.find("./control[@id='9001']") if first_row is not None else None
              poster = includes_root.find("./include[@name='CinevaFocusedPosterItem9001']")
              progress = poster.find("./control[@type='progress']") if poster is not None else None
              if any(node is None for node in (rail, first_row, shelf, progress)):
                raise SystemExit("Could not locate the packaged Continue Watching progress geometry")
              progress_y = sum(int(node.findtext("top", "0")) for node in (rail, first_row, shelf, progress))
              progress_x = int(rail.findtext("left", "0"))
              progress_width = int(rail.findtext("width", "0"))
              progress_height = int(progress.findtext("height", "0"))
              crop = f"{progress_width}x{progress_height}+{progress_x}+{progress_y}"
              # Count CINÉVA crimson, not general red/orange poster artwork.
              signal = subprocess.run(["convert",f"artifacts/cineva-home-cycle-{cycle}.png","-crop",crop,"-fx","((r>0.7)&&(g<0.12)&&(b<0.12))?1:0","-format","%[fx:mean]","info:"],text=True,capture_output=True,check=True)
              try:
                progress_signal = float(signal.stdout.strip())
              except ValueError:
                raise SystemExit(f"Could not measure rendered Continue Watching progress bars: {signal.stdout!r}")
              if progress_signal < 0.20:
                raise SystemExit(f"Continue Watching progress bars are not visibly rendered in the Home screenshot (crimson coverage={progress_signal:.4f})")
              print(f"Verified live Continue Watching progress bars in the Home screenshot (crimson coverage={progress_signal:.4f}, y={progress_y}).")
            subprocess.run(["xdotool","key","Up"],check=True)
            deadline = time.time() + 8
            while time.time() < deadline:
              state = gui()
              if state.get("currentcontrol",{}).get("label","").strip().upper() == "PLAY":
                break
              time.sleep(0.25)
            else:
              raise SystemExit(f"Home shelf Up did not focus the PLAY hero action: {state}")
            subprocess.run(["import","-display",":99","-window","root","artifacts/cineva-home-actions.png"],check=True)
            eyebrow_signal = subprocess.run(
              ["convert","artifacts/cineva-home-actions.png","-crop","420x30+60+110",
               "-fx","((r>0.55)&&(g<0.35)&&(b<0.35))?1:0","-format","%[fx:mean]","info:"],
              text=True,capture_output=True,check=True
            )
            eyebrow_coverage = float(eyebrow_signal.stdout.strip())
            if eyebrow_coverage < 0.003:
              raise SystemExit(f"Home contextual eyebrow is not visibly rendered (crimson coverage={eyebrow_coverage:.4f})")
            top_left_red = subprocess.run(
              ["convert","artifacts/cineva-home-actions.png","-crop","60x60+0+0",
               "-fx","((r>0.55)&&(g<0.35)&&(b<0.35))?1:0","-format","%[fx:mean]","info:"],
              text=True,capture_output=True,check=True
            )
            top_left_red_coverage = float(top_left_red.stdout.strip())
            if top_left_red_coverage > 0.01:
              raise SystemExit(f"Home has stray red focus accents at the top-left edge (coverage={top_left_red_coverage:.4f})")
            print(f"Verified visible contextual eyebrow and clean top-left navigation margin (eyebrow={eyebrow_coverage:.4f}, stray-red={top_left_red_coverage:.4f}).")
            first_row_mask_off = subprocess.run(
              ["convert","artifacts/cineva-home-actions.png","-crop","1920x120+0+440","-colorspace","gray","-format","%[fx:mean]","info:"],
              text=True,capture_output=True,check=True
            )
            try:
              first_row_region_luma = float(first_row_mask_off.stdout.strip())
            except ValueError:
              raise SystemExit(f"Could not measure the first-row unmasked shelf region: {first_row_mask_off.stdout!r}")
            if first_row_region_luma < 0.12:
              raise SystemExit(f"Scroll mask incorrectly hides the first rail while it is active (luma={first_row_region_luma:.3f})")
            print(f"Verified the first rail remains fully visible while active (region luma={first_row_region_luma:.3f}).")
            # Sample well below the old viewport edge: the next rail should be a
            # substantial artwork preview, not a narrow strip clipped by the Home list.
            second_row_preview = subprocess.run(
              ["convert","artifacts/cineva-home-actions.png","-crop","1800x40+100+1000","-colorspace","gray","-format","%[fx:mean]","info:"],
              text=True,capture_output=True,check=True
            )
            try:
              second_row_preview_luma = float(second_row_preview.stdout.strip())
            except ValueError:
              raise SystemExit(f"Could not measure the second-row Home preview: {second_row_preview.stdout!r}")
            if second_row_preview_luma < 0.12:
              raise SystemExit(f"Second Home rail is clipped before a useful poster preview appears (luma={second_row_preview_luma:.3f})")
            print(f"Verified the second Home rail remains visibly previewed below the first shelf (luma={second_row_preview_luma:.3f}).")
            # JSON-RPC can focus an invisible Kodi control. Verify the first-row
            # PLAY surface is actually painted in the framebuffer, as well as focused.
            first_play = subprocess.run(
              ["convert","artifacts/cineva-home-actions.png","-crop","210x70+60+340",
               "-fx","((r>0.7)&&(g<0.25)&&(b<0.25))?1:0","-format","%[fx:mean]","info:"],
              text=True,capture_output=True,check=True
            )
            try:
              first_play_signal = float(first_play.stdout.strip())
            except ValueError:
              raise SystemExit(f"Could not measure the first-row PLAY surface: {first_play.stdout!r}")
            if first_play_signal < 0.35:
              raise SystemExit(f"First-row PLAY is focusable but not visibly rendered (crimson coverage={first_play_signal:.4f})")
            print(f"Verified visible first-row PLAY action (crimson coverage={first_play_signal:.4f}).")
            subprocess.run(["xdotool","key","Right"],check=True)
            deadline = time.time() + 8
            while time.time() < deadline:
              state = gui()
              if state.get("currentcontrol",{}).get("label","").strip().upper() == "MORE INFO":
                break
              time.sleep(0.25)
            else:
              raise SystemExit(f"Hero action Right did not focus MORE INFO: {state}")
            subprocess.run(["xdotool","key","Down"],check=True)
            deadline = time.time() + 8
            while time.time() < deadline:
              state = gui()
              if state.get("currentcontrol",{}).get("label","").strip() == "The Shawshank Redemption":
                break
              time.sleep(0.25)
            else:
              raise SystemExit(f"Hero action Down did not return to the selected poster: {state}")
            # Move through every row; the grouplist must scroll the lower shelves into view.
            def active_rail_indicator_position(row_number):
              import xml.etree.ElementTree as ET
              home_root = ET.parse("skin.cineva/xml/Home.xml").getroot()
              rail = home_root.find("./controls/control[@type='grouplist'][@id='9050']")
              row_group = rail.find(f"./control[@type='group'][@id='{9060 + row_number}']") if rail is not None else None
              row_accent = row_group.find("./control[@type='image']") if row_group is not None else None
              if any(node is None for node in (rail, row_group, row_accent)):
                raise SystemExit(f"Could not locate row {row_number} active-rail underline geometry")
              # The active group is docked to the viewport's bottom edge when scrolled into view.
              x = int(rail.findtext("left", "0")) + int(row_accent.findtext("left", "0"))
              y = int(rail.findtext("top", "0")) + int(rail.findtext("height", "0")) - int(row_group.findtext("height", "0")) + int(row_accent.findtext("top", "0"))
              return x, y
            expected_row_labels = {2: "Breaking Bad", 3: "The Shawshank Redemption", 4: "Breaking Bad"}
            for row_number in (2, 3, 4):
              subprocess.run(["xdotool","key","Down"],check=True)
              deadline = time.time() + 10
              expected_label = expected_row_labels[row_number]
              while time.time() < deadline:
                state = gui()
                current_label = state.get("currentcontrol",{}).get("label","").strip()
                if current_label == expected_label:
                  break
                time.sleep(0.25)
              else:
                raise SystemExit(f"D-pad Down did not reach Home row {row_number} ({expected_label}): {state}")
              print(f"Scrolled Home to row {row_number}; focused item:", state.get("currentcontrol"))
              if row_number == 2:
                time.sleep(0.8)
                subprocess.run(["import","-display",":99","-window","root","artifacts/cineva-home-row2-focus.png"],check=True)
                # The previous rail should fade away beneath the pinned hero without
                # creating an opaque black stripe across its artwork.
                scroll_mask_signal = subprocess.run(
                  ["convert","artifacts/cineva-home-row2-focus.png","-crop","1920x36+0+394","-colorspace","gray","-format","%[fx:mean]","info:"],
                  text=True,capture_output=True,check=True
                )
                try:
                  masked_region_luma = float(scroll_mask_signal.stdout.strip())
                except ValueError:
                  raise SystemExit(f"Could not measure the lower-row scroll mask: {scroll_mask_signal.stdout!r}")
                if masked_region_luma < 0.04:
                  raise SystemExit(f"Hero-to-rail transition is still an opaque black band (region luma={masked_region_luma:.3f})")
                print(f"Verified the lower-row transition retains a soft hero fade (region luma={masked_region_luma:.3f}).")
                # The active-rail underline follows the docked row position; derive its
                # pixel coordinate from the packaged viewport instead of hard-coding 574.
                indicator_x, indicator_y = active_rail_indicator_position(2)
                indicator_signal = subprocess.run(
                  ["convert","artifacts/cineva-home-row2-focus.png","-crop",f"58x3+{indicator_x}+{indicator_y}",
                   "-fx","((r>0.6)&&(g<0.25)&&(b<0.25))?1:0","-format","%[fx:mean]","info:"],
                  text=True,capture_output=True,check=True
                )
                try:
                  indicator_coverage = float(indicator_signal.stdout.strip())
                except ValueError:
                  raise SystemExit(f"Could not measure row-2 active-rail underline: {indicator_signal.stdout!r}")
                if indicator_coverage < 0.8:
                  raise SystemExit(f"Row-2 heading indicator is not visible at the compact rail position (coverage={indicator_coverage:.3f})")
                print(f"Verified row-2 active-rail underline at y={indicator_y} (coverage={indicator_coverage:.3f}).")
                # The PLAY surface must remain visible when row 2, rather than
                # row 1, supplies the hero. A white unselected button occupies
                # this exact 180x44 region in the 1920x1080 Home layout.
                signal = subprocess.run([
                  "convert", "artifacts/cineva-home-row2-focus.png",
                  "-crop", "180x44+72+380", "-colorspace", "gray",
                  "-threshold", "82%", "-format", "%[fx:mean]", "info:"
                ], text=True, capture_output=True, check=True)
                try:
                  white_coverage = float(signal.stdout.strip())
                except ValueError:
                  raise SystemExit(f"Could not measure row-2 hero PLAY surface: {signal.stdout!r}")
                if white_coverage < 0.55:
                  raise SystemExit(f"Row-2 hero PLAY surface is not visibly rendered (white coverage={white_coverage:.3f})")
                print(f"Verified row-2 hero PLAY surface in rendered screenshot (white coverage={white_coverage:.3f}).")
                subprocess.run(["xdotool","key","Up"],check=True)
                deadline = time.time() + 8
                while time.time() < deadline:
                  state = gui()
                  if state.get("currentcontrol",{}).get("label","").strip().upper() == "PLAY":
                    break
                  time.sleep(0.25)
                else:
                  raise SystemExit(f"Row-2 Up did not focus its PLAY action: {state}")
                subprocess.run(["import","-display",":99","-window","root","artifacts/cineva-home-row2-actions.png"],check=True)
                # The selected row's fanart must remain pinned while focus moves
                # from the poster to PLAY; compare only the unobstructed right hero.
                subprocess.run(["convert","artifacts/cineva-home-row2-focus.png","-crop","760x230+1100+110","+repage","/tmp/hero-row2-focused.png"],check=True)
                subprocess.run(["convert","artifacts/cineva-home-row2-actions.png","-crop","760x230+1100+110","+repage","/tmp/hero-row2-action.png"],check=True)
                hero_action_diff = subprocess.run(["compare","-metric","AE","/tmp/hero-row2-focused.png","/tmp/hero-row2-action.png","null:"],text=True,capture_output=True,check=False)
                hero_action_metric = (hero_action_diff.stderr or hero_action_diff.stdout).strip().split()
                try:
                  hero_action_changed = int(hero_action_metric[0])
                except (IndexError, ValueError):
                  raise SystemExit(f"Could not compare hero art across row-2 action focus: {hero_action_diff.stderr} {hero_action_diff.stdout}")
                if hero_action_changed > 5000:
                  raise SystemExit(f"Row-2 hero fanart changed when PLAY received focus ({hero_action_changed} pixels differ)")
                print(f"Verified row-2 hero fanart remains pinned through PLAY focus ({hero_action_changed} pixels differ).")
                subprocess.run(["xdotool","key","Right"],check=True)
                deadline = time.time() + 8
                while time.time() < deadline:
                  state = gui()
                  if state.get("currentcontrol",{}).get("label","").strip().upper() == "MORE INFO":
                    break
                  time.sleep(0.25)
                else:
                  raise SystemExit(f"Row-2 Right did not focus MORE INFO: {state}")
                subprocess.run(["xdotool","key","Down"],check=True)
                deadline = time.time() + 8
                while time.time() < deadline:
                  state = gui()
                  if state.get("currentcontrol",{}).get("label","").strip() == "Breaking Bad":
                    break
                  time.sleep(0.25)
                else:
                  raise SystemExit(f"Row-2 More Info Down did not return to its poster: {state}")
              if row_number == 4:
                time.sleep(0.8)
                subprocess.run(["import","-display",":99","-window","root","artifacts/cineva-home-row4-scroll.png"],check=True)
                row4_mask_signal = subprocess.run(
                  ["convert","artifacts/cineva-home-row4-scroll.png","-crop","1920x36+0+394","-colorspace","gray","-format","%[fx:mean]","info:"],
                  text=True,capture_output=True,check=True
                )
                try:
                  row4_region_luma = float(row4_mask_signal.stdout.strip())
                except ValueError:
                  raise SystemExit(f"Could not measure the row-4 scroll mask: {row4_mask_signal.stdout!r}")
                if row4_region_luma < 0.04:
                  raise SystemExit(f"Row-4 hero transition still shows an opaque black band (region luma={row4_region_luma:.3f})")
                print(f"Verified the row-4 hero transition retains a soft fade (region luma={row4_region_luma:.3f}).")
                indicator_x, indicator_y = active_rail_indicator_position(4)
                indicator_signal = subprocess.run(
                  ["convert","artifacts/cineva-home-row4-scroll.png","-crop",f"58x3+{indicator_x}+{indicator_y}",
                   "-fx","((r>0.6)&&(g<0.25)&&(b<0.25))?1:0","-format","%[fx:mean]","info:"],
                  text=True,capture_output=True,check=True
                )
                try:
                  indicator_coverage = float(indicator_signal.stdout.strip())
                except ValueError:
                  raise SystemExit(f"Could not measure row-4 active-rail underline: {indicator_signal.stdout!r}")
                if indicator_coverage < 0.8:
                  raise SystemExit(f"Row-4 heading indicator is not visible at the compact rail position (coverage={indicator_coverage:.3f})")
                print(f"Verified row-4 active-rail underline at y={indicator_y} (coverage={indicator_coverage:.3f}).")
            if cycle == 1:
              # Compare only the unobstructed right side of the hero, excluding
              # the title, buttons and date. This proves the actual fanart layer
              # changes when focus moves from a movie rail to a TV rail.
              subprocess.run(["convert","artifacts/cineva-home-cycle-1.png","-crop","760x230+1100+110","+repage","/tmp/cineva-hero-movie.png"],check=True)
              subprocess.run(["convert","artifacts/cineva-home-row2-focus.png","-crop","760x230+1100+110","+repage","/tmp/cineva-hero-tv.png"],check=True)
              comparison = subprocess.run(["compare","-metric","AE","/tmp/cineva-hero-movie.png","/tmp/cineva-hero-tv.png","null:"],text=True,capture_output=True,check=False)
              metric_text = (comparison.stderr or comparison.stdout).strip().split()
              try:
                changed_pixels = int(metric_text[0])
              except (IndexError, ValueError):
                raise SystemExit(f"Could not measure Home hero artwork change: {comparison.stderr} {comparison.stdout}")
              if changed_pixels < 5000:
                raise SystemExit(f"Home hero fanart did not visibly change between movie and TV rails (changed pixels={changed_pixels})")
              print(f"Verified dynamic Home hero artwork changed across movie/TV rails: {changed_pixels} pixels differ.")
          logs = log_text()
          if "EXCEPTION: Invalid setting type" in logs:
            raise SystemExit("GUI test found a widget settings type error")
          if "Control 50 in window 12999 has been asked to focus" in logs:
            raise SystemExit("GUI test found the Startup.xml empty-panel focus error")
          if "CINEVA_WIDGETS_INITIALIZED=4" not in logs:
            raise SystemExit("GUI test never confirmed four default widgets were initialized")
          print("Verified all live reload cycles, confirmation closure, four poster-backed rows, Home shelf focus, and hero Play/More Info D-pad navigation.")
          PY
          xdotool getdisplaygeometry
          import -display :99 -window root artifacts/kodi-startup.png
          xdotool key --clearmodifiers Escape
          sleep 2
          import -display :99 -window root artifacts/kodi-after-input.png
          test -s artifacts/kodi-startup.png
          test -s artifacts/kodi-after-input.png
          # The Python GUI assertions above prove the modal closes, shelves populate,
          # and the focused Home item is returned by the test provider.
          LOG="$HOME/.var/app/tv.kodi.Kodi/data/temp/kodi.log"
          grep -F "CINEVA_WIDGETS_INITIALIZED=4" "$LOG" >/dev/null
          ! grep -F "EXCEPTION: Invalid setting type" "$LOG"
          ! grep -F "Control 50 in window 12999 has been asked to focus" "$LOG"
          echo "Verified: widget manager initialized and all GUI assertions passed."

      - name: Collect Kodi logs and runtime details
        if: always()
        run: |
          mkdir -p artifacts
          cp /tmp/kodi-stdout.log artifacts/ 2>/dev/null || true
          cp /tmp/xvfb.log artifacts/ 2>/dev/null || true
          LOG="$(find "$HOME/.var/app/tv.kodi.Kodi" -type f -name kodi.log -print -quit 2>/dev/null || true)"
          if [ -n "$LOG" ]; then
            echo "Kodi log found at: $LOG"
            cp "$LOG" artifacts/kodi.log
            grep -Ei 'ERROR|CRITICAL|failed|Traceback|skin.cineva' "$LOG" > artifacts/kodi-errors.txt || true
          else
            echo "Kodi log not found under Flatpak app data" > artifacts/kodi-log-missing.txt
            find "$HOME/.var/app/tv.kodi.Kodi" -maxdepth 6 -type f -print > artifacts/kodi-profile-files.txt 2>/dev/null || true
          fi
          flatpak info --user tv.kodi.Kodi//beta > artifacts/kodi-flatpak-version.txt 2>&1 || true

      - name: Stop Kodi and Xvfb
        if: always()
        run: |
          pkill -x kodi.bin 2>/dev/null || true
          pkill -x kodi-x11 2>/dev/null || true
          kill "$(cat /tmp/xvfb.pid)" 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cineva-kodi-gui-test
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
