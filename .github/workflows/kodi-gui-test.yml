      - name: Validate packaged Home poster fallback
        run: |
          python - <<'PY'
          import pathlib
          import struct
          import zlib
          import xml.etree.ElementTree as ET
          root = pathlib.Path("skin.cineva")
          includes = ET.parse(root / "xml/Includes.xml").getroot()
          names = ["CinevaPosterItem", "CinevaFocusedPosterItem"] + [
              f"CinevaFocusedPosterItem{row}" for row in (9001, 9002, 9003, 9004)
          ]
          for name in names:
              include = includes.find(f"./include[@name='{name}']")
              if include is None:
                  raise SystemExit(f"Missing poster include: {name}")
              poster_images = [
                  node for node in include.findall("./control[@type='image']")
                  if (node.findtext("texture") or "").strip() == "$INFO[ListItem.Art(poster)]"
              ]
              if not poster_images or any(
                  node.find("texture").attrib.get("fallback") != "poster-placeholder.png"
                  for node in poster_images
              ):
                  raise SystemExit(f"{name} does not provide the branded missing-poster fallback")
          data = (root / "media/poster-placeholder.png").read_bytes()
          if data[:8] != bytes.fromhex("89504e470d0a1a0a"):
              raise SystemExit("Branded poster fallback is not a PNG")
          width, height = struct.unpack(">II", data[16:24])
          if (width, height) != (342, 513):
              raise SystemExit(f"Poster fallback must be 342x513, got {width}x{height}")
          offset, compressed = 8, bytearray()
          while offset < len(data):
              length = int.from_bytes(data[offset:offset + 4], "big")
              kind = data[offset + 4:offset + 8]
              payload = data[offset + 8:offset + 8 + length]
              crc = int.from_bytes(data[offset + 8 + length:offset + 12 + length], "big")
              if zlib.crc32(kind + payload) & 0xffffffff != crc:
                  raise SystemExit("Poster fallback PNG has a corrupt chunk CRC")
              if kind == b"IDAT":
                  compressed.extend(payload)
              offset += length + 12
          decoded = zlib.decompress(bytes(compressed))
          if len(decoded) != (1 + width * 4) * height:
              raise SystemExit("Poster fallback PNG pixel payload has an invalid length")
          print("Normal and focused Home cards package the valid 342x513 branded fallback.")
          PY

      - name: Validate missing-fanart Home hero fallback
        run: |
          python - <<'PY'
          import struct
          from pathlib import Path
          import xml.etree.ElementTree as ET
          home = ET.parse("skin.cineva/xml/Home.xml").getroot()
          controls = home.find("controls")
          artwork = [node for node in controls.findall("control")
                     if node.get("type") == "image"
                     and ".ListItem.Art(fanart)]" in node.findtext("texture", "")]
          if len(artwork) != 4:
            raise SystemExit(f"Expected four dynamic Home hero layers, got {len(artwork)}")
          for node in artwork:
            texture = node.find("texture")
            if texture is None or texture.attrib.get("fallback") != "hero-placeholder.png":
              raise SystemExit("A Home hero layer is missing the packaged missing-fanart fallback")
          data = Path("skin.cineva/media/hero-placeholder.png").read_bytes()
          if data[:8] != bytes.fromhex("89504e470d0a1a0a"):
            raise SystemExit("Missing-fanart hero fallback is not a PNG")
          if struct.unpack(">II", data[16:24]) != (1920, 750):
            raise SystemExit("Missing-fanart hero fallback must be 1920x750")
          print("Packaged Home hero uses a valid 1920x750 fallback when providers omit fanart.")
          PY

