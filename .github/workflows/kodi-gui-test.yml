name: CINÉVA Kodi GUI smoke test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  kodi-gui:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Build release ZIP and commit it when source fixes change
        run: |
          python tools/build_skin_archive.py
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ] && ! git diff --quiet -- skin.cineva-0.5.3.zip; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add skin.cineva-0.5.3.zip
            git commit -m "Build updated CINÉVA 0.5.3 skin archive"
            git push origin HEAD:main || echo "::warning::Could not push rebuilt skin ZIP; GUI test still uses the rebuilt local ZIP."
          fi

      - name: Expand uploaded skin archive and prepare add-ons
        run: |
          mkdir -p artifacts
          test -s skin.cineva-0.5.3.zip
          unzip -q skin.cineva-0.5.3.zip -d .
          test -f skin.cineva/addon.xml
          test -d skin.cineva/xml
          test -f skin.cineva/xml/Home.xml
          test -f tools/script.cineva.widgets/addon.xml
          # Validate the packaged runtime fixes; never silently patch the test copy.
          python - <<'PY'
          import xml.etree.ElementTree as ET
          home = ET.parse("skin.cineva/xml/Home.xml").getroot()
          if home.findtext("defaultcontrol") != "1001":
            raise SystemExit("Home must default to HOME navigation control 1001")
          if (home.findtext("onload") or "").strip() != "RunScript(script.cineva.widgets,action=init)":
            raise SystemExit("Home must initialize widget strings through the Python manager")
          confirm = ET.parse("skin.cineva/xml/DialogConfirm.xml").getroot()
          if confirm.findtext("defaultcontrol") != "11":
            raise SystemExit("Keep Skin must default to control 11 (Yes); control 10 is No")
          for button in confirm.findall(".//control[@type='button']"):
            if button.findtext("texturefocus") != "focus-bar.png" or button.findtext("texturenofocus") != "black.png":
              raise SystemExit("Keep Skin buttons need explicit visible focus and no-focus textures")
          startup = ET.parse("skin.cineva/xml/Startup.xml").getroot()
          if startup.find("defaultcontrol") is not None or startup.find(".//control[@id='50']") is not None:
            raise SystemExit("Startup.xml still focuses the empty panel 50")
          if (startup.findtext("onload") or "").strip() != "ActivateWindow(Home)":
            raise SystemExit("Startup.xml must hand off to Home after a skin switch")
          controls = home.find("controls")
          hero_group = next((g for g in controls.findall("control") if g.get("type") == "group" and g.findtext("control/label", "").startswith("$INFO[Container(")), None)
          hero_title = next((c for c in hero_group.findall("control") if c.get("type") == "label" and "$INFO[Container(9001).ListItem.Label]" in c.findtext("label", "")), None) if hero_group is not None else None
          hero_plot = hero_group.find("./control[@type='textbox']") if hero_group is not None else None
          hero_meta = next((c for c in hero_group.findall("control") if c.get("type") == "label" and "$INFO[Container(9001).ListItem.Year]" in c.findtext("label", "")), None) if hero_group is not None else None
          if hero_group is None or hero_group.findtext("top") != "124" or hero_title is None or hero_title.findtext("top") != "30" or hero_meta is None or hero_meta.findtext("top") != "8" or hero_plot is None or (hero_plot.findtext("top"), hero_plot.findtext("height")) != ("96", "58"):
            raise SystemExit("Home hero title, metadata and synopsis do not have the compact action-ready composition")
          topbar_index = next((i for i, node in enumerate(list(controls))
                               if node.tag == "include" and (node.text or "").strip() == "CinevaTopBar"), -1)
          shade_index = next((i for i, node in enumerate(list(controls))
                              if node.tag == "control" and node.findtext("texture") == "hero-shade.png"), -1)
          if topbar_index <= shade_index:
            raise SystemExit("CINÉVA top navigation is layered underneath the hero artwork")
          top_shade = controls.find("./control[@id='9100']")
          top_texture = top_shade.find("texture") if top_shade is not None else None
          if top_shade is None or top_shade.findtext("height") != "260" or top_texture is None or top_texture.attrib.get("flipy") != "true":
            raise SystemExit("Home hero is missing the mirrored top fade for readable navigation")
          for container_id, play_id, nav_target in ((9001, 9111, 1001), (9002, 9113, 1001), (9003, 9115, 1002), (9004, 9117, 1003)):
            action_group = controls.find(f"./control[@id='{9100 + container_id - 9000}']")
            buttons = action_group.findall("./control[@type='button']") if action_group is not None else []
            if len(buttons) != 2 or [button.findtext("label") for button in buttons] != ["PLAY", "MORE INFO"]:
              raise SystemExit(f"Home row {container_id} is missing its two hero actions")
            if buttons[0].findtext("onclick") != f"PlayMedia($INFO[Container({container_id}).ListItem.File])" or buttons[1].findtext("onclick") != f"SetFocus({container_id})" or [node.text for node in buttons[1].findall("onclick")] != [f"SetFocus({container_id})", "Action(Info)"]:
              raise SystemExit(f"Home row {container_id} hero actions are not wired to its selected item")
            shelf = controls.find(f"./control[@type='fixedlist'][@id='{container_id}']")
            if shelf is None or shelf.findtext("onup") != f"SetFocus({play_id})":
              raise SystemExit(f"Home row {container_id} cannot navigate up to its hero actions")
          row_positions = ((370, 406), (715, 751), (1060, 1096), (1405, 1441))
          for index, (heading_top, shelf_top) in enumerate(row_positions, 1):
            heading = next((c for c in controls.findall("control")
                            if c.get("type") == "label"
                            and c.findtext("label") == f"$INFO[Skin.String(Cineva.Widget{index}.Name)]"), None)
            shelf = controls.find(f"./control[@type='fixedlist'][@id='{9000 + index}']")
            if heading is None or heading.findtext("top") != str(heading_top):
              raise SystemExit(f"Home widget {index} heading is not at the verified non-overlap position")
            if shelf is None or shelf.findtext("top") != str(shelf_top) or shelf.findtext("height") != "300":
              raise SystemExit(f"Home widget {index} shelf geometry is incorrect")
          if controls.find("./control[@id='9010']") is not None:
            raise SystemExit("Obstructive floating More Widgets button is still present")
          includes = ET.parse("skin.cineva/xml/Includes.xml").getroot()
          poster = includes.find("./include[@name='CinevaPosterItem']")
          if poster is None or poster.findtext("./control[@type='image']/height") != "276" or poster.findtext("./control[@type='label']/width") != "270" or poster.findtext("./control[@type='label']/top") != "278" or poster.findtext("./control[@type='label']/height") != "20":
            raise SystemExit("Home poster and title layout is missing its redesigned large-card geometry")
          catalogue = ET.parse("skin.cineva/xml/MyVideoNav.xml").getroot()
          panel = catalogue.find("./controls/control[@type='panel']")
          layout = panel.find("itemlayout") if panel is not None else None
          if panel is None or (panel.findtext("left"), panel.findtext("top"), panel.findtext("width"), panel.findtext("height")) != ("54", "252", "1812", "790"):
            raise SystemExit("Catalogue panel is not using the full-width cinematic grid")
          if layout is None or (layout.get("width"), layout.get("height")) != ("300", "350"):
            raise SystemExit("Catalogue poster cards are missing the redesigned grid geometry")
          details = ET.parse("skin.cineva/xml/DialogVideoInfo.xml").getroot()
          detail_poster = next((c for c in details.findall("./controls/control") if c.get("type") == "image" and c.findtext("texture") == "$INFO[ListItem.Art(poster)]"), None)
          detail_plot = details.find("./controls/control[@type='textbox']")
          if detail_poster is None or (detail_poster.findtext("left"), detail_poster.findtext("top"), detail_poster.findtext("width"), detail_poster.findtext("height")) != ("1260", "116", "430", "650"):
            raise SystemExit("Video details poster is not in the redesigned right-side composition")
          if detail_plot is None or (detail_plot.findtext("left"), detail_plot.findtext("top"), detail_plot.findtext("width"), detail_plot.findtext("height")) != ("104", "350", "1000", "300"):
            raise SystemExit("Video details synopsis is not using the redesigned text column")
          osd = ET.parse("skin.cineva/xml/VideoOSD.xml").getroot()
          osd_progress = osd.find("./controls/control[@type='progress']")
          if osd_progress is None or (osd_progress.findtext("left"), osd_progress.findtext("top"), osd_progress.findtext("width")) != ("80", "880", "1760"):
            raise SystemExit("Player OSD seek bar is not using the full-width layout")
          search = ET.parse("skin.cineva/xml/custom11112.xml").getroot()
          if any(button.findtext("texturefocus") != "focus-bar.png" for button in search.findall(".//control[@type='button']")):
            raise SystemExit("Search hub buttons are missing the unified focus treatment")
          skin = ET.parse("skin.cineva/addon.xml").getroot()
          if skin.attrib.get("version") != "0.5.3":
            raise SystemExit("Skin archive version must be 0.5.3")
          widget = ET.parse("tools/script.cineva.widgets/addon.xml").getroot()
          if widget.attrib.get("version") != "0.1.3":
            raise SystemExit("Widget manager version must be 0.1.3")
          setting = ET.parse("tools/script.cineva.widgets/resources/settings.xml").getroot().find(".//setting[@id='widget_registry']")
          if setting is None or setting.attrib.get("type") != "string":
            raise SystemExit("widget_registry must be declared as a string setting")
          nav = next((g for g in controls.findall("control") if g.get("type") == "group" and g.find("./control[@id='1001']") is not None), None)
          if nav is None or any(button.findtext("focusedcolor") != "white" or button.findtext("texturefocus") != "focus-bar.png" for button in nav.findall("./control[@type='button']")):
            raise SystemExit("Home navigation buttons need visible explicit textures and text color")
          print("Packaged Home, dialog, Startup and settings schema validated.")
          PY
          zip -qr artifacts/cineva-expanded-source.zip skin.cineva tools/script.cineva.widgets tools/test-fixtures/plugin.video.pov tools/download_test_posters.py

      - name: Install GUI runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak xvfb xdotool imagemagick jq fonts-dejavu-core

      - name: Install Kodi Piers beta from Flathub beta
        run: |
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak remote-add --user --if-not-exists flathub-beta https://dl.flathub.org/beta-repo/flathub-beta.flatpakrepo
          flatpak install --user --noninteractive -y flathub org.freedesktop.Platform//26.08
          flatpak install --user --noninteractive -y flathub-beta tv.kodi.Kodi//beta
          flatpak info --user tv.kodi.Kodi//beta

      - name: Install CINÉVA into isolated Kodi profile
        run: |
          mkdir -p "$HOME/.var/app/tv.kodi.Kodi/data/addons/skin.cineva"
          mkdir -p "$HOME/.var/app/tv.kodi.Kodi/data/addons/script.cineva.widgets"
          cp -a skin.cineva/. "$HOME/.var/app/tv.kodi.Kodi/data/addons/skin.cineva/"
          cp -a tools/script.cineva.widgets/. "$HOME/.var/app/tv.kodi.Kodi/data/addons/script.cineva.widgets/"
          # Test-only POV-compatible provider returns deterministic poster-backed ListItems.
          POV="$HOME/.var/app/tv.kodi.Kodi/data/addons/plugin.video.pov"
          mkdir -p "$POV/resources/posters"
          cp -a tools/test-fixtures/plugin.video.pov/. "$POV/"
          python tools/download_test_posters.py "$POV/resources/posters"
          test -s "$POV/resources/posters/movie-1.jpg"
          test -s "$POV/resources/posters/tv-1.jpg"
          for index in 1 2 3 4 5 6; do test -s "$POV/resources/posters/backdrop-$index.jpg"; done
          curl -fL --retry 3 -o /tmp/script.skinshortcuts.zip https://github.com/MikeSiLVO/script.skinshortcuts/archive/refs/tags/v3.0.1.zip
          mkdir -p "$HOME/.var/app/tv.kodi.Kodi/data/addons/script.skinshortcuts"
          unzip -q /tmp/script.skinshortcuts.zip -d /tmp/skinshortcuts
          cp -a /tmp/skinshortcuts/script.skinshortcuts-3.0.1/. "$HOME/.var/app/tv.kodi.Kodi/data/addons/script.skinshortcuts/"
          mkdir -p "$HOME/.var/app/tv.kodi.Kodi/data/userdata"
          cat > "$HOME/.var/app/tv.kodi.Kodi/data/userdata/advancedsettings.xml" <<'XML'
          <advancedsettings><loglevel hide="false">2</loglevel></advancedsettings>
          XML
          # Kodi must generate its complete settings file (including resolutions).


      - name: Launch Kodi, verify active skin through JSON-RPC, and capture GUI
        run: |
          mkdir -p artifacts
          export DISPLAY=:99
          Xvfb :99 -screen 0 1920x1080x24 -ac +extension GLX +render -noreset > /tmp/xvfb.log 2>&1 &
          echo $! > /tmp/xvfb.pid
          sleep 2
          # First boot: allow Kodi to create a valid, version-specific guisettings.xml.
          flatpak run --user tv.kodi.Kodi//beta --standalone > /tmp/kodi-firstboot.log 2>&1 &
          FIRST_PID=$!
          for i in $(seq 1 45); do
            test -s "$HOME/.var/app/tv.kodi.Kodi/data/userdata/guisettings.xml" && break
            sleep 2
          done
          test -s "$HOME/.var/app/tv.kodi.Kodi/data/userdata/guisettings.xml" || (echo "Kodi did not create guisettings.xml"; exit 1)
          kill "$FIRST_PID" 2>/dev/null || true
          pkill -x kodi.bin 2>/dev/null || true
          pkill -x kodi-x11 2>/dev/null || true
          sleep 3
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          p = Path.home()/".var/app/tv.kodi.Kodi/data/userdata/guisettings.xml"
          tree = ET.parse(p)
          root = tree.getroot()
          for key, value in {
            "lookandfeel.skin": "skin.cineva",
            "services.webserver": "true",
            "services.webserverport": "8080",
            "services.webserverauthentication": "false"
          }.items():
            node = root.find(f"./setting[@id='{key}']")
            if node is None: node = ET.SubElement(root, "setting", {"id": key})
            node.text = value
          tree.write(p, encoding="UTF-8", xml_declaration=True)
          print("Configured CINÉVA while preserving Kodi-generated resolution settings.")
          PY
          flatpak run --user tv.kodi.Kodi//beta --standalone > /tmp/kodi-stdout.log 2>&1 &
          echo $! > /tmp/kodi.pid
          for i in $(seq 1 60); do
            if pgrep -x kodi.bin >/dev/null || pgrep -x kodi-x11 >/dev/null; then break; fi
            sleep 2
          done
          pgrep -a -x kodi.bin || pgrep -a -x kodi-x11 || (echo "Kodi process did not start"; exit 1)
          sleep 15
          python - <<'PY'
          import json, socket, time, subprocess
          def rpc(method, params=None):
            request = {"jsonrpc":"2.0","method":method,"params":params or {},"id":1}
            decoder = json.JSONDecoder()
            with socket.create_connection(("127.0.0.1", 9090), timeout=5) as sock:
              sock.settimeout(5)
              # Kodi raw TCP JSON-RPC has no newline or other frame delimiter.
              sock.sendall(json.dumps(request).encode("utf-8"))
              data = ""
              deadline = time.time() + 10
              while time.time() < deadline:
                try:
                  chunk = sock.recv(65536)
                except socket.timeout:
                  continue
                if not chunk: break
                data += chunk.decode("utf-8", "replace")
                pos = 0
                while pos < len(data):
                  while pos < len(data) and data[pos].isspace(): pos += 1
                  if pos >= len(data): break
                  try:
                    obj, endpos = decoder.raw_decode(data, pos)
                  except json.JSONDecodeError:
                    break
                  pos = endpos
                  if isinstance(obj, dict) and obj.get("id") == 1:
                    if "error" in obj: raise RuntimeError(obj["error"])
                    return obj.get("result")
                data = data[pos:] if pos else data
            raise RuntimeError(f"No JSON-RPC response for {method}; received: {data[:500]!r}")
          last = None
          for attempt in range(30):
            try:
              current = rpc("Settings.GetSettingValue", {"setting":"lookandfeel.skin"})
              current_value = current.get("value") if isinstance(current, dict) else current
              print("Kodi selected skin at test start:", current_value)
              break
            except Exception as exc:
              last = exc
              print("JSON-RPC not ready yet:", repr(exc))
              time.sleep(2)
          else:
            raise SystemExit(f"GUI TEST FAILED: Kodi JSON-RPC unavailable: {last}")

          # Diagnose and explicitly enable the skin before attempting a switch.
          details = rpc("Addons.GetAddonDetails", {"addonid":"skin.cineva","properties":["enabled","version"]})
          print("CINÉVA add-on details before enable:", details)
          enabled = rpc("Addons.SetAddonEnabled", {"addonid":"skin.cineva","enabled":True})
          print("Addons.SetAddonEnabled result:", enabled)
          time.sleep(5)
          details = rpc("Addons.GetAddonDetails", {"addonid":"skin.cineva","properties":["enabled","version"]})
          print("CINÉVA add-on details after enable:", details)

          # Keep one Kodi process alive. Each cycle waits for a fresh skin load,
          # a successful widget-manager run, and a closed Keep Skin dialog.
          from pathlib import Path
          import shutil
          source = Path.cwd() / "skin.cineva"
          target = Path.home() / ".var/app/tv.kodi.Kodi/data/addons/skin.cineva"
          log_path = Path.home()/".var/app/tv.kodi.Kodi/data/temp/kodi.log"
          def log_text():
            return log_path.read_text(errors="replace") if log_path.exists() else ""
          def gui():
            return rpc("GUI.GetProperties", {"properties":["currentwindow","currentcontrol","skin"]})
          pov_details = rpc("Addons.GetAddonDetails", {"addonid":"plugin.video.pov","properties":["enabled","version"]})
          print("POV GUI fixture before enable:", pov_details)
          rpc("Addons.SetAddonEnabled", {"addonid":"plugin.video.pov","enabled":True})
          time.sleep(2)
          pov_details = rpc("Addons.GetAddonDetails", {"addonid":"plugin.video.pov","properties":["enabled","version"]})
          print("POV GUI fixture after enable:", pov_details)
          for cycle in range(1, 4):
            print(f"===== CINÉVA live test cycle {cycle}/3 =====")
            state = gui()
            if state.get("skin",{}).get("id") != "skin.estuary":
              previous_skin_loads = log_text().count("load skin from:")
              result = rpc("Settings.SetSettingValue", {"setting":"lookandfeel.skin","value":"skin.estuary"})
              print("Switched to Estuary:", result)
              # Every actual skin change opens a Keep Skin confirmation in
              # the newly selected skin. Confirm Estuary before switching back.
              deadline = time.time() + 25
              while time.time() < deadline:
                state = gui()
                if state.get("skin",{}).get("id") == "skin.estuary" and state.get("currentwindow",{}).get("id") == 10100:
                  break
                time.sleep(0.5)
              else:
                raise SystemExit(f"Cycle {cycle}: Estuary Keep Skin dialog did not open: {state}")
              estuary_label = state.get("currentcontrol",{}).get("label","").strip()
              if estuary_label.lower() != "yes":
                # Estuary's stock confirmation defaults to No; move left to
                # the explicit Yes action so the test can continue the cycle.
                subprocess.run(["xdotool","key","Left"],check=True)
                time.sleep(0.3)
                state = gui()
                estuary_label = state.get("currentcontrol",{}).get("label","").strip()
              if estuary_label.lower() != "yes":
                raise SystemExit(f"Cycle {cycle}: could not focus Yes in Estuary Keep Skin: {estuary_label!r}")
              subprocess.run(["xdotool","key","Return"],check=True)
              deadline = time.time() + 20
              while time.time() < deadline:
                state = gui()
                if state.get("skin",{}).get("id") == "skin.estuary" and state.get("currentwindow",{}).get("id") != 10100:
                  break
                time.sleep(0.5)
              else:
                raise SystemExit(f"Cycle {cycle}: Estuary confirmation did not close: {state}")
              if log_text().count("load skin from:") <= previous_skin_loads:
                raise SystemExit(f"Cycle {cycle}: Estuary skin reload was not recorded")
              time.sleep(1)
            else:
              print("Already on Estuary; skipping redundant skin switch.")
            before = log_text()
            before_loads = before.count("load skin from:")
            before_inits = before.count("CINEVA_WIDGETS_INITIALIZED=4")
            if target.exists():
              shutil.rmtree(target)
            shutil.copytree(source, target)
            print("Refreshed CINÉVA add-on files in place.")
            result = rpc("Settings.SetSettingValue", {"setting":"lookandfeel.skin","value":"skin.cineva"})
            print("Switched to CINÉVA:", result)
            deadline = time.time() + 35
            while time.time() < deadline:
              logs = log_text()
              if "EXCEPTION: Invalid setting type" in logs:
                raise SystemExit("Widget manager failed: widget_registry has an invalid setting type")
              load_count = logs.count("load skin from:")
              init_count = logs.count("CINEVA_WIDGETS_INITIALIZED=4")
              state = gui()
              if load_count > before_loads and init_count > before_inits and state.get("currentwindow",{}).get("id") == 10100:
                break
              time.sleep(0.5)
            else:
              raise SystemExit(f"Cycle {cycle}: fresh CINÉVA load, widget initialization or Keep Skin dialog was missing. Log tail:\n{log_text()[-6000:]}")
            print("Keep Skin dialog state:", state)
            time.sleep(1)
            subprocess.run(["import","-display",":99","-window","root",f"artifacts/cineva-confirmation-{cycle}.png"],check=True)
            current_label = state.get("currentcontrol",{}).get("label","").strip()
            if current_label.lower() != "yes":
              raise SystemExit(f"Cycle {cycle}: Keep Skin did not default to Yes; focused control={current_label!r}")
            subprocess.run(["xdotool","key","Return"],check=True)
            deadline = time.time() + 15
            while time.time() < deadline:
              state = gui()
              if state.get("currentwindow",{}).get("id") != 10100:
                break
              time.sleep(0.5)
            else:
              raise SystemExit(f"Cycle {cycle}: Keep Skin dialog did not close after confirming Yes")
            selected = rpc("Settings.GetSettingValue", {"setting":"lookandfeel.skin"})
            selected_value = selected.get("value") if isinstance(selected, dict) else selected
            if selected_value != "skin.cineva" or state.get("skin",{}).get("id") != "skin.cineva":
              raise SystemExit(f"Cycle {cycle}: CINÉVA not retained after confirmation: {selected}; GUI={state}")
            print("Keep Skin dialog closed; active skin:", state.get("skin"), "window:", state.get("currentwindow"))
            # Startup.xml must hand off to the real Home window; the background
            # can look like Home while currentwindow is still Startup (12999).
            deadline = time.time() + 12
            while time.time() < deadline:
              state = gui()
              current_window = state.get("currentwindow",{})
              if current_window.get("id") == 10000 or current_window.get("label","").strip().lower() == "home":
                break
              time.sleep(0.5)
            else:
              raise SystemExit(f"Cycle {cycle}: skin stayed on Startup instead of Home: {state}")
            print("Home window active:", state.get("currentwindow"))
            paths = [
              "plugin://plugin.video.pov/?mode=build_movie_list&action=in_progress_movies&name=Continue%20Watching%20Movies",
              "plugin://plugin.video.pov/?mode=build_tvshow_list&action=in_progress_tvshows&name=Continue%20Watching%20TV%20Shows",
              "plugin://plugin.video.pov/?mode=build_movie_list&action=tmdb_movies_trending&name=Trending%20Movies",
              "plugin://plugin.video.pov/?mode=build_tvshow_list&action=tmdb_tv_trending&name=Trending%20TV%20Shows",
            ]
            for row, path in enumerate(paths, 1):
              directory = rpc("Files.GetDirectory", {"directory":path,"media":"video","properties":["title","file","thumbnail","art"]})
              items = directory.get("files",[]) if isinstance(directory,dict) else []
              posters = [item.get("thumbnail") or (item.get("art") or {}).get("poster") or (item.get("art") or {}).get("thumb") for item in items]
              poster_count = sum(1 for poster in posters if poster)
              unique_posters = len(set(poster for poster in posters if poster))
              print(f"Widget row {row}: items={len(items)}, poster_art={poster_count}, unique_posters={unique_posters}, first={items[0] if items else None}")
              if len(items) < 6 or poster_count < 6 or unique_posters < 6:
                raise SystemExit(f"Widget row {row} did not return six distinct poster-backed items")
            rpc("Input.Down")  # Home navigation -> PLAY action
            rpc("Input.Down")  # PLAY action -> first poster
            deadline = time.time() + 12
            focused_label = ""
            while time.time() < deadline:
              state = gui()
              focused_label = state.get("currentcontrol",{}).get("label","").strip()
              if focused_label == "The Shawshank Redemption":
                break
              time.sleep(0.5)
            if focused_label != "The Shawshank Redemption":
              raise SystemExit(f"Home shelf 9001 did not focus its first item: {state}")
            print("Home poster shelf focused on:", focused_label)
            subprocess.run(["import","-display",":99","-window","root",f"artifacts/cineva-home-cycle-{cycle}.png"],check=True)
            subprocess.run(["xdotool","key","Up"],check=True)
            deadline = time.time() + 8
            while time.time() < deadline:
              state = gui()
              if state.get("currentcontrol",{}).get("label","").strip().upper() == "PLAY":
                break
              time.sleep(0.25)
            else:
              raise SystemExit(f"Home shelf Up did not focus the PLAY hero action: {state}")
            subprocess.run(["import","-display",":99","-window","root","artifacts/cineva-home-actions.png"],check=True)
            subprocess.run(["xdotool","key","Right"],check=True)
            deadline = time.time() + 8
            while time.time() < deadline:
              state = gui()
              if state.get("currentcontrol",{}).get("label","").strip().upper() == "MORE INFO":
                break
              time.sleep(0.25)
            else:
              raise SystemExit(f"Hero action Right did not focus MORE INFO: {state}")
            subprocess.run(["xdotool","key","Down"],check=True)
            deadline = time.time() + 8
            while time.time() < deadline:
              state = gui()
              if state.get("currentcontrol",{}).get("label","").strip() == "The Shawshank Redemption":
                break
              time.sleep(0.25)
            else:
              raise SystemExit(f"Hero action Down did not return to the selected poster: {state}")
          logs = log_text()
          if "EXCEPTION: Invalid setting type" in logs:
            raise SystemExit("GUI test found a widget settings type error")
          if "Control 50 in window 12999 has been asked to focus" in logs:
            raise SystemExit("GUI test found the Startup.xml empty-panel focus error")
          if "CINEVA_WIDGETS_INITIALIZED=4" not in logs:
            raise SystemExit("GUI test never confirmed four default widgets were initialized")
          print("Verified all live reload cycles, confirmation closure, four poster-backed rows, Home shelf focus, and hero Play/More Info D-pad navigation.")
          PY
          xdotool getdisplaygeometry
          import -display :99 -window root artifacts/kodi-startup.png
          xdotool key --clearmodifiers Escape
          sleep 2
          import -display :99 -window root artifacts/kodi-after-input.png
          test -s artifacts/kodi-startup.png
          test -s artifacts/kodi-after-input.png
          # The Python GUI assertions above prove the modal closes, shelves populate,
          # and the focused Home item is returned by the test provider.
          LOG="$HOME/.var/app/tv.kodi.Kodi/data/temp/kodi.log"
          grep -F "CINEVA_WIDGETS_INITIALIZED=4" "$LOG" >/dev/null
          ! grep -F "EXCEPTION: Invalid setting type" "$LOG"
          ! grep -F "Control 50 in window 12999 has been asked to focus" "$LOG"
          echo "Verified: widget manager initialized and all GUI assertions passed."

      - name: Collect Kodi logs and runtime details
        if: always()
        run: |
          cp /tmp/kodi-stdout.log artifacts/ 2>/dev/null || true
          cp /tmp/xvfb.log artifacts/ 2>/dev/null || true
          LOG="$(find "$HOME/.var/app/tv.kodi.Kodi" -type f -name kodi.log -print -quit 2>/dev/null || true)"
          if [ -n "$LOG" ]; then
            echo "Kodi log found at: $LOG"
            cp "$LOG" artifacts/kodi.log
            grep -Ei 'ERROR|CRITICAL|failed|Traceback|skin.cineva' "$LOG" > artifacts/kodi-errors.txt || true
          else
            echo "Kodi log not found under Flatpak app data" > artifacts/kodi-log-missing.txt
            find "$HOME/.var/app/tv.kodi.Kodi" -maxdepth 6 -type f -print > artifacts/kodi-profile-files.txt 2>/dev/null || true
          fi
          flatpak info --user tv.kodi.Kodi//beta > artifacts/kodi-flatpak-version.txt 2>&1 || true

      - name: Stop Kodi and Xvfb
        if: always()
        run: |
          pkill -x kodi.bin 2>/dev/null || true
          pkill -x kodi-x11 2>/dev/null || true
          kill "$(cat /tmp/xvfb.pid)" 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cineva-kodi-gui-test
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
