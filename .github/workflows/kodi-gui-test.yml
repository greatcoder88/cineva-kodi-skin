          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak remote-add --user --if-not-exists flathub-beta https://dl.flathub.org/beta-repo/flathub-beta.flatpakrepo
          flatpak install --user --noninteractive -y flathub org.freedesktop.Platform//26.08
          flatpak install --user --noninteractive -y flathub-beta tv.kodi.Kodi//beta
          flatpak info --user tv.kodi.Kodi//beta

      - name: Install CINÉVA into isolated Kodi profile
        run: |
          mkdir -p "$HOME/.var/app/tv.kodi.Kodi/data/addons/skin.cineva"
          mkdir -p "$HOME/.var/app/tv.kodi.Kodi/data/addons/script.cineva.widgets"
          cp -a skin.cineva/. "$HOME/.var/app/tv.kodi.Kodi/data/addons/skin.cineva/"
          cp -a tools/script.cineva.widgets/. "$HOME/.var/app/tv.kodi.Kodi/data/addons/script.cineva.widgets/"
          # Test-only POV-compatible provider returns deterministic poster-backed ListItems.
          POV="$HOME/.var/app/tv.kodi.Kodi/data/addons/plugin.video.pov"
          mkdir -p "$POV/resources/posters"
          cp -a tools/test-fixtures/plugin.video.pov/. "$POV/"
          python tools/download_test_posters.py "$POV/resources/posters"
          test -s "$POV/resources/posters/movie-1.jpg"
          test -s "$POV/resources/posters/tv-1.jpg"
          test -s "$POV/resources/posters/clearlogo-movie-1.png"
          test -s "$POV/resources/posters/clearlogo-tv-1.png"
          for index in 1 2 3 4 5 6 7 8; do
            test -s "$POV/resources/posters/backdrop-$index.jpg"
            test -s "$POV/resources/posters/tv-backdrop-$index.jpg"
          done
          curl -fL --retry 3 -o /tmp/script.skinshortcuts.zip https://github.com/MikeSiLVO/script.skinshortcuts/archive/refs/tags/v3.0.1.zip
          mkdir -p "$HOME/.var/app/tv.kodi.Kodi/data/addons/script.skinshortcuts"
          unzip -q /tmp/script.skinshortcuts.zip -d /tmp/skinshortcuts
          cp -a /tmp/skinshortcuts/script.skinshortcuts-3.0.1/. "$HOME/.var/app/tv.kodi.Kodi/data/addons/script.skinshortcuts/"
          mkdir -p "$HOME/.var/app/tv.kodi.Kodi/data/userdata"
          cat > "$HOME/.var/app/tv.kodi.Kodi/data/userdata/advancedsettings.xml" <<'XML'
          <advancedsettings><loglevel hide="false">2</loglevel></advancedsettings>
          XML
          # Kodi must generate its complete settings file (including resolutions).


      - name: Launch Kodi, verify active skin through JSON-RPC, and capture GUI
        run: |
          mkdir -p artifacts
          export DISPLAY=:99
          Xvfb :99 -screen 0 1920x1080x24 -ac +extension GLX +render -noreset > /tmp/xvfb.log 2>&1 &
          echo $! > /tmp/xvfb.pid
          sleep 2
          # First boot: explicitly use X11 under Xvfb and retain diagnostics.
          # Some Kodi beta builds choose Wayland automatically when launched
          # through Flatpak; that leaves the Xvfb GUI profile uninitialized.
          USERDATA="$HOME/.var/app/tv.kodi.Kodi/data/userdata"
          SETTINGS="$USERDATA/guisettings.xml"
          mkdir -p "$USERDATA"
          boot_kodi_once() {
            local attempt="$1"
            echo "Starting Kodi first-boot attempt $attempt on X11..."
            flatpak run --user tv.kodi.Kodi//beta --standalone --windowing=x11 \
              > "/tmp/kodi-firstboot-$attempt.log" 2>&1 &
            FIRST_PID=$!
            for i in $(seq 1 60); do
              test -s "$SETTINGS" && return 0
              if ! kill -0 "$FIRST_PID" 2>/dev/null && ! pgrep -x kodi.bin >/dev/null; then
                echo "Kodi first-boot launcher exited before creating guisettings.xml."
                break
              fi
              sleep 2
            done
            return 1
          }
          if ! boot_kodi_once 1; then
            echo "First boot did not initialize the profile; collecting diagnostics and retrying."
            cat /tmp/kodi-firstboot-1.log || true
            flatpak kill --user tv.kodi.Kodi 2>/dev/null || true
            pkill -x kodi.bin 2>/dev/null || true
            pkill -x kodi-x11 2>/dev/null || true
            sleep 3
            if ! boot_kodi_once 2; then
              echo "Kodi did not create guisettings.xml after two X11 startup attempts."
              cat /tmp/kodi-firstboot-2.log || true
              ps -ef | grep -E '[k]odi|[X]vfb' || true
              find "$HOME/.var/app/tv.kodi.Kodi" -maxdepth 6 -type f -printf '%p %s bytes\\n' 2>/dev/null | tail -80 || true
              exit 1
            fi
          fi
          test -s "$SETTINGS"
          echo "Kodi initialized guisettings.xml ($(wc -c < "$SETTINGS") bytes)."
          kill "$FIRST_PID" 2>/dev/null || true
          # Flatpak's launcher can exit while the Kodi wrapper and app child
          # remain. Stop the app cgroup, terminate both processes, and ignore
          # zombies: they no longer hold the GUI or JSON-RPC listener.
          flatpak kill --user tv.kodi.Kodi 2>/dev/null || true
          pkill -TERM -x kodi.bin 2>/dev/null || true
          pkill -TERM -x kodi-x11 2>/dev/null || true
          pkill -TERM -x kodi 2>/dev/null || true
          kodi_processes() {
            ps -eo pid=,stat=,comm= | awk '
              ($3 == "kodi.bin" || $3 == "kodi-x11" || $3 == "kodi") &&
              $2 !~ /^Z/ { print $1 }
            '
          }
          for attempt in $(seq 1 12); do
            if ! kodi_processes | grep -q .; then break; fi
            sleep 1
          done
          if kodi_processes | grep -q .; then
            echo "Kodi did not exit after graceful shutdown; forcing the isolated test instance down:"
            ps -eo pid,ppid,stat,comm,args | grep -E '[k]odi(\.bin|-x11)?'
            pkill -KILL -x kodi.bin 2>/dev/null || true
            pkill -KILL -x kodi-x11 2>/dev/null || true
            pkill -KILL -x kodi 2>/dev/null || true
            sleep 2
          fi
          if kodi_processes | grep -q .; then
            echo "A live first-boot Kodi process survived forced shutdown:"
            ps -eo pid,ppid,stat,comm,args | grep -E '[k]odi(\.bin|-x11)?'
            exit 1
          fi
          # Port 9090 is Kodi's raw TCP JSON-RPC endpoint. A stale listener
          # prevents the new instance from exposing the API used by GUI tests.
          if ss -ltnp | grep -q ':9090'; then
            echo "Releasing stale JSON-RPC listener before the test launch:"
            ss -ltnp | grep ':9090' || true
            sudo fuser -k 9090/tcp || true
            sleep 2
          fi
          if ss -ltnp | grep -q ':9090'; then
            echo "Port 9090 is still occupied after cleanup:"
            ss -ltnp | grep ':9090' || true
            exit 1
          fi
          sleep 2
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          p = Path.home()/".var/app/tv.kodi.Kodi/data/userdata/guisettings.xml"
          tree = ET.parse(p)
          root = tree.getroot()
          for key, value in {
            "lookandfeel.skin": "skin.cineva",
            "services.webserver": "true",
            "services.webserverport": "8080",
            "services.webserverauthentication": "false"
          }.items():
            node = root.find(f"./setting[@id='{key}']")
            if node is None: node = ET.SubElement(root, "setting", {"id": key})
            node.text = value
          tree.write(p, encoding="UTF-8", xml_declaration=True)
          print("Configured CINÉVA while preserving Kodi-generated resolution settings.")
          PY
          # Detach Kodi from the Actions shell process group. A transient runner/Flatpak
          # signal previously stopped the app during Home startup before JSON-RPC opened.
          launch_kodi() {
            nohup setsid -f flatpak run --user tv.kodi.Kodi//beta --standalone </dev/null > /tmp/kodi-stdout.log 2>&1
          }
          for launch_attempt in 1 2; do
            launch_kodi
            for i in $(seq 1 45); do
              if (pgrep -x kodi.bin >/dev/null || pgrep -x kodi-x11 >/dev/null) && ss -ltn | grep -q ':9090'; then
                break
              fi
              if ! pgrep -x kodi.bin >/dev/null && ! pgrep -x kodi-x11 >/dev/null && [ "$i" -gt 5 ]; then
                break
              fi
              sleep 2
            done
            if ss -ltn | grep -q ':9090'; then
              break
            fi
            echo "Kodi did not keep its GUI/JSON-RPC listener alive on launch attempt $launch_attempt; restarting once."
            flatpak kill --user tv.kodi.Kodi 2>/dev/null || true
            pkill -x kodi.bin 2>/dev/null || true
            pkill -x kodi-x11 2>/dev/null || true
            sleep 2
          done
          if ! ss -ltn | grep -q ':9090'; then
            pgrep -a -x kodi.bin || pgrep -a -x kodi-x11 || true
            echo "Kodi did not expose its JSON-RPC listener after two detached launch attempts."
            exit 1
          fi
          pgrep -a -x kodi.bin || pgrep -a -x kodi-x11 || true
          sleep 10
          # Preserve a real Kodi framebuffer after the Home window and JSON-RPC are ready.
          import -display :99 -window root artifacts/kodi-before-jsonrpc.png
          ss -ltnp > artifacts/listeners-before-jsonrpc.txt || true
          python - <<'PY'
          import json, socket, time, subprocess
          def rpc(method, params=None):
            request = {"jsonrpc":"2.0","method":method,"params":params or {},"id":1}
            decoder = json.JSONDecoder()
            with socket.create_connection(("127.0.0.1", 9090), timeout=5) as sock:
              sock.settimeout(5)
              # Kodi raw TCP JSON-RPC has no newline or other frame delimiter.
              sock.sendall(json.dumps(request).encode("utf-8"))
              data = ""
              deadline = time.time() + 10
              while time.time() < deadline:
                try:
                  chunk = sock.recv(65536)
                except socket.timeout:
                  continue
                if not chunk: break
                data += chunk.decode("utf-8", "replace")
                pos = 0
                while pos < len(data):
                  while pos < len(data) and data[pos].isspace(): pos += 1
                  if pos >= len(data): break
                  try:
                    obj, endpos = decoder.raw_decode(data, pos)
                  except json.JSONDecodeError:
                    break
                  pos = endpos
                  if isinstance(obj, dict) and obj.get("id") == 1:
                    if "error" in obj: raise RuntimeError(obj["error"])
                    return obj.get("result")
                data = data[pos:] if pos else data
            raise RuntimeError(f"No JSON-RPC response for {method}; received: {data[:500]!r}")
          last = None
          for attempt in range(30):
            try:
              current = rpc("Settings.GetSettingValue", {"setting":"lookandfeel.skin"})
              current_value = current.get("value") if isinstance(current, dict) else current
              print("Kodi selected skin at test start:", current_value)
              break
            except Exception as exc:
              last = exc
              print("JSON-RPC not ready yet:", repr(exc))
              time.sleep(2)
          else:
            raise SystemExit(f"GUI TEST FAILED: Kodi JSON-RPC unavailable: {last}")

          # Diagnose and explicitly enable the skin before attempting a switch.
          details = rpc("Addons.GetAddonDetails", {"addonid":"skin.cineva","properties":["enabled","version"]})
          print("CINÉVA add-on details before enable:", details)
          enabled = rpc("Addons.SetAddonEnabled", {"addonid":"skin.cineva","enabled":True})
          print("Addons.SetAddonEnabled result:", enabled)
          time.sleep(5)
          details = rpc("Addons.GetAddonDetails", {"addonid":"skin.cineva","properties":["enabled","version"]})
          print("CINÉVA add-on details after enable:", details)

          # Keep one Kodi process alive. Each cycle waits for a fresh skin load,
          # a successful widget-manager run, and a closed Keep Skin dialog.
          from pathlib import Path
          import shutil
          source = Path.cwd() / "skin.cineva"
          target = Path.home() / ".var/app/tv.kodi.Kodi/data/addons/skin.cineva"
          log_path = Path.home()/".var/app/tv.kodi.Kodi/data/temp/kodi.log"
          def log_text():
            return log_path.read_text(errors="replace") if log_path.exists() else ""
          def gui():
            return rpc("GUI.GetProperties", {"properties":["currentwindow","currentcontrol","skin"]})
          pov_details = rpc("Addons.GetAddonDetails", {"addonid":"plugin.video.pov","properties":["enabled","version"]})
          print("POV GUI fixture before enable:", pov_details)
          rpc("Addons.SetAddonEnabled", {"addonid":"plugin.video.pov","enabled":True})
          time.sleep(2)
          pov_details = rpc("Addons.GetAddonDetails", {"addonid":"plugin.video.pov","properties":["enabled","version"]})
          print("POV GUI fixture after enable:", pov_details)
          for cycle in range(1, 4):
            print(f"===== CINÉVA live test cycle {cycle}/3 =====")
            state = gui()
            if state.get("skin",{}).get("id") != "skin.estuary":
              previous_skin_loads = log_text().count("load skin from:")
              result = rpc("Settings.SetSettingValue", {"setting":"lookandfeel.skin","value":"skin.estuary"})
              print("Switched to Estuary:", result)
              # Every actual skin change opens a Keep Skin confirmation in
              # the newly selected skin. Confirm Estuary before switching back.
              deadline = time.time() + 25
              while time.time() < deadline:
                state = gui()
                if state.get("skin",{}).get("id") == "skin.estuary" and state.get("currentwindow",{}).get("id") == 10100:
                  break
                time.sleep(0.5)
              else:
                raise SystemExit(f"Cycle {cycle}: Estuary Keep Skin dialog did not open: {state}")
              estuary_label = state.get("currentcontrol",{}).get("label","").strip()
              if estuary_label.lower() != "yes":
                # Estuary's stock confirmation defaults to No; move left to
                # the explicit Yes action so the test can continue the cycle.
                subprocess.run(["xdotool","key","Left"],check=True)
                time.sleep(0.3)
                state = gui()
                estuary_label = state.get("currentcontrol",{}).get("label","").strip()
              if estuary_label.lower() != "yes":
                raise SystemExit(f"Cycle {cycle}: could not focus Yes in Estuary Keep Skin: {estuary_label!r}")
              subprocess.run(["xdotool","key","Return"],check=True)
              deadline = time.time() + 20
              while time.time() < deadline:
                state = gui()
                if state.get("skin",{}).get("id") == "skin.estuary" and state.get("currentwindow",{}).get("id") != 10100:
                  break
                time.sleep(0.5)
              else:
                raise SystemExit(f"Cycle {cycle}: Estuary confirmation did not close: {state}")
              if log_text().count("load skin from:") <= previous_skin_loads:
                raise SystemExit(f"Cycle {cycle}: Estuary skin reload was not recorded")
              time.sleep(1)
            else:
              print("Already on Estuary; skipping redundant skin switch.")
            before = log_text()
            before_loads = before.count("load skin from:")
            before_inits = before.count("CINEVA_WIDGETS_INITIALIZED=4")
            if target.exists():
              shutil.rmtree(target)
            shutil.copytree(source, target)
            print("Refreshed CINÉVA add-on files in place.")
            result = rpc("Settings.SetSettingValue", {"setting":"lookandfeel.skin","value":"skin.cineva"})
            print("Switched to CINÉVA:", result)
            deadline = time.time() + 35
            while time.time() < deadline:
              logs = log_text()
              if "EXCEPTION: Invalid setting type" in logs:
                raise SystemExit("Widget manager failed: widget_registry has an invalid setting type")
              load_count = logs.count("load skin from:")
              init_count = logs.count("CINEVA_WIDGETS_INITIALIZED=4")
              state = gui()
              if load_count > before_loads and init_count > before_inits and state.get("currentwindow",{}).get("id") == 10100:
                break
              time.sleep(0.5)
            else:
              raise SystemExit(f"Cycle {cycle}: fresh CINÉVA load, widget initialization or Keep Skin dialog was missing. Log tail:\n{log_text()[-6000:]}")
            print("Keep Skin dialog state:", state)
            time.sleep(1)
            subprocess.run(["import","-display",":99","-window","root",f"artifacts/cineva-confirmation-{cycle}.png"],check=True)
            current_label = state.get("currentcontrol",{}).get("label","").strip()
            if current_label.lower() != "yes":
              raise SystemExit(f"Cycle {cycle}: Keep Skin did not default to Yes; focused control={current_label!r}")
            subprocess.run(["xdotool","key","Return"],check=True)
            deadline = time.time() + 15
            while time.time() < deadline:
              state = gui()
              if state.get("currentwindow",{}).get("id") != 10100:
                break
              time.sleep(0.5)
            else:
              raise SystemExit(f"Cycle {cycle}: Keep Skin dialog did not close after confirming Yes")
            selected = rpc("Settings.GetSettingValue", {"setting":"lookandfeel.skin"})
            selected_value = selected.get("value") if isinstance(selected, dict) else selected
            if selected_value != "skin.cineva" or state.get("skin",{}).get("id") != "skin.cineva":
              raise SystemExit(f"Cycle {cycle}: CINÉVA not retained after confirmation: {selected}; GUI={state}")
            print("Keep Skin dialog closed; active skin:", state.get("skin"), "window:", state.get("currentwindow"))
            # Startup.xml must hand off to the real Home window; the background
            # can look like Home while currentwindow is still Startup (12999).
            deadline = time.time() + 12
            while time.time() < deadline:
              state = gui()
              current_window = state.get("currentwindow",{})
              if current_window.get("id") == 10000 or current_window.get("label","").strip().lower() == "home":
                break
              time.sleep(0.5)
            else:
              raise SystemExit(f"Cycle {cycle}: skin stayed on Startup instead of Home: {state}")
            print("Home window active:", state.get("currentwindow"))
            # Capture the actual Home rendering after the Keep Skin dialog closes,
            # before any navigation changes the selected poster or active control.
            subprocess.run(["import","-display",":99","-window","root",
                            "artifacts/cineva-home-initial.png"],check=True)
            paths = [
              "plugin://plugin.video.pov/?mode=build_movie_list&action=in_progress_movies&name=Continue%20Watching%20Movies",
              "plugin://plugin.video.pov/?mode=build_tvshow_list&action=in_progress_tvshows&name=Continue%20Watching%20TV%20Shows",
              "plugin://plugin.video.pov/?mode=build_movie_list&action=tmdb_movies_trending&name=Trending%20Movies",
              "plugin://plugin.video.pov/?mode=build_tvshow_list&action=tmdb_tv_trending&name=Trending%20TV%20Shows",
            ]
            hero_fanart_by_row = {}
            first_row_items = None
            for row, path in enumerate(paths, 1):
              directory = rpc("Files.GetDirectory", {"directory":path,"media":"video","properties":["title","file","thumbnail","art"]})
              items = directory.get("files",[]) if isinstance(directory,dict) else []
              if row == 1:
                first_row_items = items
              posters = [item.get("thumbnail") or (item.get("art") or {}).get("poster") or (item.get("art") or {}).get("thumb") for item in items]
              fanarts = [(item.get("art") or {}).get("fanart") for item in items]
              poster_count = sum(1 for poster in posters if poster)
              unique_posters = len(set(poster for poster in posters if poster))
              unique_fanarts = len(set(fanart for fanart in fanarts if fanart))
              missing_fanarts = [index for index, fanart in enumerate(fanarts) if not fanart]
              expected_missing_fanarts = 1 if row in (2, 4) else 0
              expected_unique_fanarts = 7 if row in (2, 4) else 8
              if fanarts:
                hero_fanart_by_row[row] = fanarts[0]
              print(f"Widget row {row}: items={len(items)}, poster_art={poster_count}, unique_posters={unique_posters}, unique_fanarts={unique_fanarts}, missing_fanarts={missing_fanarts}, first={items[0] if items else None}")
              if (len(items) < 8 or poster_count < 8 or unique_posters < 8
                  or unique_fanarts != expected_unique_fanarts
                  or len(missing_fanarts) != expected_missing_fanarts
                  or (expected_missing_fanarts and (missing_fanarts != [0] or items[0].get("label") != "Breaking Bad"))):
                raise SystemExit(
                  f"Widget row {row} did not match its poster/fanart fixture contract "
                  f"(expected {expected_unique_fanarts} distinct fanarts and missing indices "
                  f"{[0] if expected_missing_fanarts else []}, got {unique_fanarts} and {missing_fanarts})"
                )
            if hero_fanart_by_row.get(1) == hero_fanart_by_row.get(2):
              raise SystemExit("Movie and TV Home rows share the same hero fanart; dynamic hero switching cannot be visually verified")
            # The shelf intentionally opens with its configured focusposition,
            # not item zero. Derive the expected title from the packaged XML and
            # the fixture directory so this GUI assertion follows the real UI.
            import xml.etree.ElementTree as ET
            home_root = ET.parse(source / "xml" / "Home.xml").getroot()
            home_rail = home_root.find("./controls/control[@type='grouplist'][@id='9050']")
            first_row = home_rail.find("./control[@type='group'][@id='9061']") if home_rail is not None else None
            home_shelf = first_row.find("./control[@type='fixedlist'][@id='9001']") if first_row is not None else None
            if first_row_items is None or home_shelf is None:
              raise SystemExit("Could not derive initial Home focus from the packaged first shelf")
            focus_position = int(home_shelf.findtext("focusposition", "0"))
            if not 0 <= focus_position < len(first_row_items):
              raise SystemExit(f"Home shelf focusposition {focus_position} is outside its {len(first_row_items)} fixture items")
            expected_focus_label = first_row_items[focus_position].get("label", "").strip()
            if not expected_focus_label:
              raise SystemExit(f"Home shelf focusposition {focus_position} resolves to an empty fixture label")
            print(f"Expected initial Home poster focus: item {focus_position + 1}/{len(first_row_items)} — {expected_focus_label}")
            rpc("Input.Down")  # Home navigation -> PLAY action
            rpc("Input.Down")  # PLAY action -> configured centered poster
            deadline = time.time() + 12
            focused_label = ""
            while time.time() < deadline:
              state = gui()
              focused_label = state.get("currentcontrol",{}).get("label","").strip()
              if focused_label == expected_focus_label:
                break
              time.sleep(0.5)
            if focused_label != expected_focus_label:
              raise SystemExit(
                f"Home shelf 9001 did not focus its configured item "
                f"{focus_position + 1}/{len(first_row_items)} ({expected_focus_label!r}): {state}"
              )
            print("Home poster shelf focused on:", focused_label)
            # Save the exact focused poster state, then follow the visible
            # hero actions with real D-pad keys. Poster focus selects the title;
            # the dedicated RESUME/PLAY button is the explicit playback action.
            subprocess.run(["import","-display",":99","-window","root",
                            "artifacts/cineva-home-poster-focused.png"],check=True)
            # Verify the live shelf counter and directional cues against Kodi's
            # own container state, then capture the scrolled state before returning
            # to the originally focused poster for the hero-action tests.
            initial_labels = rpc("XBMC.GetInfoLabels", {"labels":[
              "Container(9001).CurrentItem", "Container(9001).NumItems"
            ]})
            initial_flags = rpc("XBMC.GetInfoBooleans", {"booleans":[
              "Container(9001).HasNext", "Container(9001).HasPrevious"
            ]})
            def info_true(value):
              return value is True or str(value).strip().lower() in {"true", "1"}
            initial_position = int(initial_labels.get("Container(9001).CurrentItem", "0"))
            total_items = int(initial_labels.get("Container(9001).NumItems", "0"))
            if total_items != 8 or not info_true(initial_flags.get("Container(9001).HasNext")):
              raise SystemExit(f"Home shelf 9001 did not expose its next-page cue: labels={initial_labels}; flags={initial_flags}")
            for _ in range(6):
              subprocess.run(["xdotool","key","Right"],check=True)
              time.sleep(0.12)
            scrolled_labels = rpc("XBMC.GetInfoLabels", {"labels":[
              "Container(9001).CurrentItem", "Container(9001).NumItems"
            ]})
            scrolled_flags = rpc("XBMC.GetInfoBooleans", {"booleans":[
              "Container(9001).HasNext", "Container(9001).HasPrevious"
            ]})
            scrolled_position = int(scrolled_labels.get("Container(9001).CurrentItem", "0"))
            if scrolled_position <= initial_position or not info_true(scrolled_flags.get("Container(9001).HasPrevious")):
              raise SystemExit(f"Home shelf 9001 did not expose its previous-page cue after scrolling: labels={scrolled_labels}; flags={scrolled_flags}")
            subprocess.run(["import","-display",":99","-window","root",
                            "artifacts/cineva-home-shelf-scrolled.png"],check=True)
            # The selected poster should stay in the middle of the visible rail
            # after scrolling, rather than snapping to the far-left edge and
            # leaving the remaining viewport empty.
            focus_lane = []
            for slot in range(6):
              x = 60 + slot * 299 + 20
              signal = subprocess.run(
                ["convert","artifacts/cineva-home-shelf-scrolled.png",
                 "-crop",f"40x300+{x}+433",
                 "-fx","((r>0.6)&&(g<0.25)&&(b<0.25))?1:0",
                 "-format","%[fx:mean]","info:"],
