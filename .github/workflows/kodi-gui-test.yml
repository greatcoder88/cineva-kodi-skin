                  hero_action_changed = int(hero_action_metric[0])
                except (IndexError, ValueError):
                  raise SystemExit(f"Could not compare hero art across row-2 action focus: {hero_action_diff.stderr} {hero_action_diff.stdout}")
                if hero_action_changed > 5000:
                  raise SystemExit(f"Row-2 hero fanart changed when PLAY received focus ({hero_action_changed} pixels differ)")
                print(f"Verified row-2 hero fanart remains pinned through PLAY focus ({hero_action_changed} pixels differ).")
                subprocess.run(["xdotool","key","Right"],check=True)
                deadline = time.time() + 8
                while time.time() < deadline:
                  state = gui()
                  if state.get("currentcontrol",{}).get("label","").strip().upper() == "MORE INFO":
                    break
                  time.sleep(0.25)
                else:
                  raise SystemExit(f"Row-2 Right did not focus MORE INFO: {state}")
                subprocess.run(["xdotool","key","Down"],check=True)
                deadline = time.time() + 8
                while time.time() < deadline:
                  state = gui()
                  if state.get("currentcontrol",{}).get("label","").strip() == "Breaking Bad":
                    break
                  time.sleep(0.25)
                else:
                  raise SystemExit(f"Row-2 More Info Down did not return to its poster: {state}")
              if row_number == 4:
                time.sleep(0.8)
                subprocess.run(["import","-display",":99","-window","root","artifacts/cineva-home-row4-scroll.png"],check=True)
                verify_lower_row_bottom_clear("artifacts/cineva-home-row4-scroll.png", "row 4")
                verify_missing_fanart_poster_hero("artifacts/cineva-home-row4-scroll.png", "row 4")
                row4_mask_signal = subprocess.run(
                  ["convert","artifacts/cineva-home-row4-scroll.png","-crop","1920x36+0+394","-colorspace","gray","-format","%[fx:mean]","info:"],
                  text=True,capture_output=True,check=True
                )
                try:
                  row4_region_luma = float(row4_mask_signal.stdout.strip())
                except ValueError:
                  raise SystemExit(f"Could not measure the row-4 scroll mask: {row4_mask_signal.stdout!r}")
                if row4_region_luma < 0.04:
                  raise SystemExit(f"Row-4 hero transition still shows an opaque black band (region luma={row4_region_luma:.3f})")
                print(f"Verified the row-4 hero transition retains a soft fade (region luma={row4_region_luma:.3f}).")
                indicator_x, indicator_y = active_rail_indicator_position(4)
                indicator_signal = subprocess.run(
                  ["convert","artifacts/cineva-home-row4-scroll.png","-crop",f"58x3+{indicator_x}+{indicator_y}",
                   "-fx","((r>0.6)&&(g<0.25)&&(b<0.25))?1:0","-format","%[fx:mean]","info:"],
                  text=True,capture_output=True,check=True
                )
                try:
                  indicator_coverage = float(indicator_signal.stdout.strip())
                except ValueError:
                  raise SystemExit(f"Could not measure row-4 active-rail underline: {indicator_signal.stdout!r}")
                if indicator_coverage < 0.8:
                  raise SystemExit(f"Row-4 heading indicator is not visible at the compact rail position (coverage={indicator_coverage:.3f})")
                print(f"Verified row-4 active-rail underline at y={indicator_y} (coverage={indicator_coverage:.3f}).")
            if cycle == 1:
              # Compare only the unobstructed right side of the hero, excluding
              # the title, buttons and date. This proves the actual fanart layer
              # changes when focus moves from a movie rail to a TV rail.
              subprocess.run(["convert","artifacts/cineva-home-cycle-1.png","-crop","760x230+1100+110","+repage","/tmp/cineva-hero-movie.png"],check=True)
              subprocess.run(["convert","artifacts/cineva-home-row2-focus.png","-crop","760x230+1100+110","+repage","/tmp/cineva-hero-tv.png"],check=True)
              comparison = subprocess.run(["compare","-metric","AE","/tmp/cineva-hero-movie.png","/tmp/cineva-hero-tv.png","null:"],text=True,capture_output=True,check=False)
              metric_text = (comparison.stderr or comparison.stdout).strip().split()
              try:
                changed_pixels = int(metric_text[0])
              except (IndexError, ValueError):
                raise SystemExit(f"Could not measure Home hero artwork change: {comparison.stderr} {comparison.stdout}")
              if changed_pixels < 5000:
                raise SystemExit(f"Home hero fanart did not visibly change between movie and TV rails (changed pixels={changed_pixels})")
              print(f"Verified dynamic Home hero artwork changed across movie/TV rails: {changed_pixels} pixels differ.")
          # Exercise the new catalogue navigation in the real Kodi GUI,
          # not only through XML assertions. Every category must open Kodi's
          # native Video database window and Escape must return to its caller.
          def wait_for_control(label, timeout=10):
            deadline = time.time() + timeout
            while time.time() < deadline:
              state = gui()
              if state.get("currentcontrol", {}).get("label", "").strip().upper() == label.upper():
                return state
              time.sleep(0.2)
            raise SystemExit(f"Timed out waiting for focused navigation control {label!r}: {state}")

          def wait_for_window(window_id, timeout=12):
            deadline = time.time() + timeout
            while time.time() < deadline:
              state = gui()
              if state.get("currentwindow", {}).get("id") == window_id:
                return state
              time.sleep(0.25)
            raise SystemExit(f"Timed out waiting for Kodi window {window_id}: {state}")

          def press(key):
            subprocess.run(["xdotool", "key", key], check=True)
            time.sleep(0.18)

          nav_labels = {
            "HOME", "MOVIES", "TV SHOWS", "ALL MOVIES", "ALL SHOWS",
            "GENRES", "YEARS", "COLLECTIONS", "STUDIOS", "RECENT",
            "EDIT WIDGETS", "SEARCH", "SETTINGS",
          }

          def focus_nav(label, timeout=10):
            # Kodi restores the catalogue window to its section tab after
            # returning from a native library window. Walk the actual D-pad
            # chain from that restored tab instead of assuming the old focus
            # id survives a window transition.
            deadline = time.time() + timeout
            state = gui()
            while time.time() < deadline:
              current = state.get("currentcontrol", {}).get("label", "").strip().upper()
              if current == label.upper():
                return state
              if current not in nav_labels:
                raise SystemExit(f"Catalogue returned without a usable navigation focus: {state}")
              press("Right")
              state = gui()
            raise SystemExit(f"Timed out moving catalogue navigation to {label!r}: {state}")

          def open_native_category(page_id, label):
            focus_nav(label)
            press("Return")
            wait_for_window(10025)
            print(f"Opened native Kodi library destination {label!r} from window {page_id}.")
            press("Escape")
            state = wait_for_window(page_id)
            restored = state.get("currentcontrol", {}).get("label", "").strip().upper()
            if restored not in nav_labels:
              raise SystemExit(f"Back returned to catalogue window {page_id} without D-pad focus: {state}")
            print(f"Back returned to catalogue window {page_id} after {label!r}; focus restored to {restored}.")

          # Home -> Movies using the actual remote focus chain.
          press("Down")
          wait_for_control("HOME")
          press("Right")
          wait_for_control("MOVIES")
          press("Return")
          wait_for_window(11117)
          # Empty catalogue pages land on their own active section tab.
          wait_for_control("MOVIES")
          subprocess.run(["import", "-display", ":99", "-window", "root",
                          "artifacts/cineva-movies-navigation.png"], check=True)
          press("Down")
          wait_for_control("EDIT MOVIE WIDGETS")
          subprocess.run(["import", "-display", ":99", "-window", "root",
                          "artifacts/cineva-movies-empty-state.png"], check=True)
          press("Return")
          wait_for_window(11115)
          press("Escape")
          wait_for_window(11117)
          if gui().get("currentcontrol", {}).get("label", "").strip().upper() == "EDIT MOVIE WIDGETS":
            press("Up")
          wait_for_control("MOVIES")
          open_native_category(11117, "ALL MOVIES")
          for label in ("GENRES", "YEARS", "COLLECTIONS", "RECENT"):
            open_native_category(11117, label)

          # Movies -> TV Shows, then exercise the TV-specific library nodes.
          focus_nav("TV SHOWS")
          press("Return")
          wait_for_window(11118)
          wait_for_control("TV SHOWS")
          subprocess.run(["import", "-display", ":99", "-window", "root",
                          "artifacts/cineva-tvshows-navigation.png"], check=True)
          press("Down")
          wait_for_control("EDIT TV WIDGETS")
          subprocess.run(["import", "-display", ":99", "-window", "root",
                          "artifacts/cineva-tvshows-empty-state.png"], check=True)
          press("Return")
          wait_for_window(11116)
          press("Escape")
          wait_for_window(11118)
          if gui().get("currentcontrol", {}).get("label", "").strip().upper() == "EDIT TV WIDGETS":
            press("Up")
          wait_for_control("TV SHOWS")
          open_native_category(11118, "ALL SHOWS")
          for label in ("GENRES", "YEARS", "STUDIOS", "RECENT"):
            open_native_category(11118, label)

          # TV Shows was opened from Movies, so Back returns through Movies to Home.
          press("Escape")
          wait_for_window(11117)
          press("Escape")
          wait_for_window(10000)
          # Home may restore its previous MOVIES/TV SHOWS tab; walk right to Search.
          focus_nav("SEARCH")
          press("Return")
          wait_for_window(11112)
          subprocess.run(["import", "-display", ":99", "-window", "root",
                          "artifacts/cineva-search-navigation.png"], check=True)
          press("Escape")
          wait_for_window(10000)
          focus_nav("SETTINGS")
          press("Return")
          wait_for_window(11113)
          subprocess.run(["import", "-display", ":99", "-window", "root",
                          "artifacts/cineva-settings-navigation.png"], check=True)

          # Verify the category rails still expose a complete, unique set of
          # focusable actions in the packaged XML used by this Kodi process.
          import xml.etree.ElementTree as ET
          expected_catalogue = {
            "custom11117.xml": {
              "ALL MOVIES": "ActivateWindow(Videos,videodb://movies/titles/,return)",
              "GENRES": "ActivateWindow(Videos,videodb://movies/genres/,return)",
              "YEARS": "ActivateWindow(Videos,videodb://movies/years/,return)",
              "COLLECTIONS": "ActivateWindow(Videos,videodb://movies/sets/,return)",
              "RECENT": "ActivateWindow(Videos,videodb://movies/recentlyaddedmovies/,return)",
            },
            "custom11118.xml": {
              "ALL SHOWS": "ActivateWindow(Videos,videodb://tvshows/titles/,return)",
              "GENRES": "ActivateWindow(Videos,videodb://tvshows/genres/,return)",
              "YEARS": "ActivateWindow(Videos,videodb://tvshows/years/,return)",
              "STUDIOS": "ActivateWindow(Videos,videodb://tvshows/studios/,return)",
              "RECENT": "ActivateWindow(Videos,videodb://tvshows/recentlyaddedepisodes/,return)",
            },
          }
          for filename, expected_actions in expected_catalogue.items():
            root = ET.parse("skin.cineva/xml/" + filename).getroot()
            nav = next(node for node in root.findall("./controls/control")
                       if node.get("type") == "group"
                       and node.find("./control[@id='1001']") is not None)
            buttons = {node.findtext("label"): node for node in nav.findall("./control[@type='button']")}
            marker_id, active_window, marker_left, marker_width = (
              ("12002", 11118, "183", "69")
              if filename == "custom11118.xml"
              else ("12001", 11117, "92", "56")
            )
            active_focus = "1003" if filename == "custom11118.xml" else "1002"
            if root.findtext("defaultcontrol") != active_focus:
              raise SystemExit(f"{filename} does not default focus to its active section tab")
            marker = nav.find("./control[@type='image'][@id='{}']".format(marker_id))
            if marker is None or (
                marker.findtext("left"), marker.findtext("top"),
                marker.findtext("width"), marker.findtext("height"),
                marker.findtext("texture"), marker.findtext("visible")
            ) != (marker_left, "42", marker_width, "4", "focus-bar.png",
                  "Window.IsActive({})".format(active_window)):
              raise SystemExit(f"{filename} is missing its active-section crimson underline")
            if any(button.find("texturenofocus") is not None
                   or button.findtext("texturefocus") != "focus-bar.png"
                   for button in buttons.values()):
              raise SystemExit(f"{filename} navigation tabs do not match the transparent Home header style")
            empty_condition = " + ".join(
              f"String.IsEmpty(Container({9200 + slot}).ListItem.Label)"
              for slot in range(1, 5)
            )
            expected_down = [
              (f"!String.IsEmpty(Container({9200 + slot}).ListItem.Label)",
               f"SetFocus({9200 + slot})")
              for slot in range(1, 5)
            ] + [(None, "SetFocus(12114)")]
            for label, action in expected_actions.items():
              button = buttons.get(label)
              if button is None or button.findtext("onclick") != action:
                raise SystemExit(f"{filename} is missing the working {label} library destination")
            for button in buttons.values():
              if [(node.get("condition"), node.text) for node in button.findall("ondown")] != expected_down:
                raise SystemExit(f"{filename} {button.findtext('label')} does not skip empty shelves and route to the empty-state CTA")
            cta = root.find("./controls/control[@id='12114']")
            if cta is None or (
                cta.findtext("label"),
                cta.findtext("onclick"),
                cta.findtext("visible")
            ) != (
                "EDIT TV WIDGETS" if filename == "custom11118.xml" else "EDIT MOVIE WIDGETS",
                "ActivateWindow(11116)" if filename == "custom11118.xml" else "ActivateWindow(11115)",
                empty_condition
            ):
              raise SystemExit(f"{filename} is missing its visible, working empty-state widget editor action")
            if len(buttons) != 10 or len({node.get("id") for node in buttons.values()}) != 10:
              raise SystemExit(f"{filename} catalogue navigation must contain ten unique controls")
          print("Verified Movies and TV Shows D-pad navigation, all nine native library categories, and Back returns in Kodi GUI.")

          logs = log_text()
          if "EXCEPTION: Invalid setting type" in logs:
            raise SystemExit("GUI test found a widget settings type error")
          if "Control 50 in window 12999 has been asked to focus" in logs:
            raise SystemExit("GUI test found the Startup.xml empty-panel focus error")
          if "CINEVA_WIDGETS_INITIALIZED=4" not in logs:
            raise SystemExit("GUI test never confirmed four default widgets were initialized")
          print("Verified all live reload cycles, confirmation closure, four poster-backed rows, Home shelf focus, and hero Play/More Info D-pad navigation.")
          PY
          xdotool getdisplaygeometry
          import -display :99 -window root artifacts/kodi-startup.png
          xdotool key --clearmodifiers Escape
          sleep 2
          import -display :99 -window root artifacts/kodi-after-input.png
          test -s artifacts/kodi-startup.png
          test -s artifacts/kodi-after-input.png
          # The Python GUI assertions above prove the modal closes, shelves populate,
          # and the focused Home item is returned by the test provider.
          LOG="$HOME/.var/app/tv.kodi.Kodi/data/temp/kodi.log"
          grep -F "CINEVA_WIDGETS_INITIALIZED=4" "$LOG" >/dev/null
          ! grep -F "EXCEPTION: Invalid setting type" "$LOG"
          ! grep -F "Control 50 in window 12999 has been asked to focus" "$LOG"
          echo "Verified: widget manager initialized and all GUI assertions passed."

      - name: Collect Kodi logs and runtime details
        if: always()
        run: |
          mkdir -p artifacts
          cp /tmp/kodi-stdout.log artifacts/ 2>/dev/null || true
          cp /tmp/kodi-firstboot-1.log artifacts/ 2>/dev/null || true
          cp /tmp/kodi-firstboot-2.log artifacts/ 2>/dev/null || true
          cp /tmp/xvfb.log artifacts/ 2>/dev/null || true
          LOG="$(find "$HOME/.var/app/tv.kodi.Kodi" -type f -name kodi.log -print -quit 2>/dev/null || true)"
          if [ -n "$LOG" ]; then
            echo "Kodi log found at: $LOG"
            cp "$LOG" artifacts/kodi.log
            grep -Ei 'ERROR|CRITICAL|failed|Traceback|skin.cineva' "$LOG" > artifacts/kodi-errors.txt || true
          else
            echo "Kodi log not found under Flatpak app data" > artifacts/kodi-log-missing.txt
            find "$HOME/.var/app/tv.kodi.Kodi" -maxdepth 6 -type f -print > artifacts/kodi-profile-files.txt 2>/dev/null || true
          fi
          flatpak info --user tv.kodi.Kodi//beta > artifacts/kodi-flatpak-version.txt 2>&1 || true

      - name: Stop Kodi and Xvfb
        if: always()
        run: |
          pkill -x kodi.bin 2>/dev/null || true
          pkill -x kodi-x11 2>/dev/null || true
          kill "$(cat /tmp/xvfb.pid)" 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cineva-kodi-gui-test
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
