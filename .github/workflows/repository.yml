name: CINÉVA Kodi repository
on:
  push:
    branches: [main]
    paths:
      - "tools/build_repository.py"
      - "tools/build_skin_archive.py"
      - "tools/script.cineva.widgets/**"
      - ".github/workflows/repository.yml"
      - "skin.cineva/**"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cineva-repository-feed
  cancel-in-progress: true
jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build packages and repository site
        run: |
          python tools/build_skin_archive.py
          python tools/build_repository.py
      - name: Validate repository feed and Kodi directory indexes
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from zipfile import ZipFile
          import hashlib
          import xml.etree.ElementTree as ET
          root = Path("repository-site")
          xml = (root / "addons.xml").read_bytes()
          assert hashlib.md5(xml).hexdigest() == (root / "addons.xml.md5").read_text().strip()
          ids = {x.get("id") for x in ET.fromstring(xml).findall("addon")}
          assert ids == {"skin.cineva", "script.cineva.widgets"}, ids
          repo_zip = root / "repository.cineva-0.1.3.zip"
          assert repo_zip.is_file(), "root-level repository installer missing"
          with ZipFile(repo_zip) as z:
              addon = ET.fromstring(z.read("repository.cineva/addon.xml"))
          ext = addon.find("./extension[@point='xbmc.addon.repository']")
          base = "https://greatcoder88.github.io/cineva-kodi-skin"
          assert ext is not None
          directory = ext.find("dir")
          assert directory is not None
          assert directory.findtext("info") == base + "/addons.xml"
          assert directory.findtext("checksum") == base + "/addons.xml.md5"
          datadir = directory.find("datadir")
          assert datadir is not None and datadir.text == base + "/zips/"
          assert datadir.get("zip") == "true"
          class Links(HTMLParser):
              def __init__(self):
                  super().__init__(); self.links=[]; self.href=None; self.label=[]
              def handle_starttag(self, tag, attrs):
                  if tag == "a": self.href=dict(attrs).get("href"); self.label=[]
              def handle_data(self, data):
                  if self.href is not None: self.label.append(data)
              def handle_endtag(self, tag):
                  if tag == "a" and self.href is not None:
                      self.links.append((self.href, "".join(self.label).strip())); self.href=None
          def links(path):
              p=Links(); p.feed(path.read_text()); return set(p.links)
          assert ("repository.cineva-0.1.3.zip","repository.cineva-0.1.3.zip") in links(root/"index.html")
          assert ("zips/","zips/") in links(root/"index.html")
          for addon_id in ("repository.cineva","skin.cineva","script.cineva.widgets"):
              folder=root/"zips"/addon_id
              files=list(folder.glob("*.zip"))
              assert files, f"missing ZIP in {folder}"
              found=links(folder/"index.html")
              assert all((f.name,f.name) in found for f in files), (addon_id,found)
          skin_zip=root/"zips"/"skin.cineva"/"skin.cineva-0.5.20.zip"
          with ZipFile(skin_zip) as z:
              skin=ET.fromstring(z.read("skin.cineva/addon.xml"))
          dependency=skin.find("./requires/import[@addon='script.cineva.widgets']")
          assert skin.get("version") == "0.5.20"
          assert dependency is not None and dependency.get("version") == "0.1.7"
          helper_dir=Path("tools/script.cineva.widgets")
          helper_zip=root/"zips"/"script.cineva.widgets"/"script.cineva.widgets-0.1.7.zip"
          expected={
              "script.cineva.widgets/"+p.relative_to(helper_dir).as_posix():p.read_bytes()
              for p in helper_dir.rglob("*") if p.is_file()
          }
          with ZipFile(helper_zip) as z:
              packaged={name for name in z.namelist() if not name.endswith("/")}
              assert packaged == set(expected), (packaged, set(expected))
              for name, data in expected.items():
                  assert z.read(name) == data, f"packaged helper differs from source: {name}"
          print("CINÉVA feed, skin/helper dependency versions, and every packaged helper source file validated byte-for-byte.")
          PY
      - name: Publish browsable repository to GitHub Pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./repository-site
          force_orphan: true
