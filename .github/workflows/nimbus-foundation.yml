name: CINÉVA Nimbus foundation

on:
  push:
    branches: [redesign/nimbus-foundation]
    paths:
      - "tools/build_nimbus_base.py"
      - "tools/download_test_posters.py"
      - "tools/test-fixtures/plugin.video.pov/**"
      - "tests/test_nimbus_base.py"
      - ".github/workflows/nimbus-foundation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cineva-nimbus-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the pinned Nimbus-derived skin and API-free bridge
        run: python tools/build_nimbus_base.py
      - name: Test builder transformations with isolated upstream fixtures
        run: python -m unittest discover -s tests -p 'test_nimbus_base.py' -v
      - name: Verify real upstream XML, licenses, dependencies and package contents
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib
          import xml.etree.ElementTree as ET

          root = Path("dist/nimbus-foundation")
          skin_zip = root / "skin.cineva-0.8.0-nimbus.zip"
          bridge_zip = root / "script.cineva.nimbus-0.1.1.zip"
          assert skin_zip.is_file() and bridge_zip.is_file()
          with ZipFile(skin_zip) as skin, ZipFile(bridge_zip) as bridge:
              skin_names = set(skin.namelist())
              bridge_names = set(bridge.namelist())
              for path in (
                  "skin.cineva/xml/Home.xml",
                  "skin.cineva/xml/Includes_Home.xml",
                  "skin.cineva/xml/Includes_HomeLayouts.xml",
                  "skin.cineva/xml/View_54_Flix.xml",
                  "skin.cineva/xml/SkinSettings.xml",
                  "skin.cineva/LICENSE.txt",
                  "skin.cineva/NOTICE.txt",
                  "skin.cineva/CINEVA_BASELINE.json",
              ):
                  assert path in skin_names, f"Missing Nimbus foundation file: {path}"
              manifest = ET.fromstring(skin.read("skin.cineva/addon.xml"))
              assert manifest.get("id") == "skin.cineva"
              assert manifest.get("version") == "0.8.0"
              assert manifest.find("./requires/import[@addon='xbmc.gui']").get("version") == "5.18.0"
              assert manifest.find("./requires/import[@addon='script.cineva.nimbus']").get("version") == "0.1.1"
              assert "script.nimbus.helper" not in skin.read("skin.cineva/addon.xml").decode()
              for path in skin_names:
                  if path.endswith(".xml"):
                      ET.fromstring(skin.read(path))
              bridge_manifest = ET.fromstring(bridge.read("script.cineva.nimbus/addon.xml"))
              assert bridge_manifest.get("id") == "script.cineva.nimbus"
              service_extension = bridge_manifest.find("./extension[@point='xbmc.service']")
              assert service_extension is not None
              assert service_extension.get("library") == "resources/lib/service.py"
              assert "script.cineva.nimbus/resources/lib/service.py" in bridge_names
              assert not any("/apis/" in p or "/monitors/" in p for p in bridge_names)
              service = bridge.read("script.cineva.nimbus/resources/lib/service.py").decode()
              assert "CINEVA_NIMBUS_BRIDGE_SERVICE_STARTED" in service
              assert "requests" not in service.lower() and "urlopen" not in service.lower()
              assert "http://" not in service.lower() and "https://" not in service.lower()
              assert not any(b"requests.get(" in bridge.read(p) for p in bridge_names if p.endswith(".py"))
          for path in (skin_zip, bridge_zip):
              print(path.name, path.stat().st_size, hashlib.sha256(path.read_bytes()).hexdigest())
          print("Nimbus-derived skin package and API-free bridge validated.")
          PY
      - name: Verify deterministic ZIP output
        run: |
          before="$(sha256sum dist/nimbus-foundation/*.zip | sort | sha256sum | cut -d' ' -f1)"
          python tools/build_nimbus_base.py
          after="$(sha256sum dist/nimbus-foundation/*.zip | sort | sha256sum | cut -d' ' -f1)"
          test "$before" = "$after"
          echo "Deterministic Nimbus package hashes: $after"
      - uses: actions/upload-artifact@v4
        with:
          name: cineva-nimbus-foundation-packages
          path: dist/nimbus-foundation/*.zip
          if-no-files-found: error
          retention-days: 14

  kodi-gui:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the exact packages used by the GUI test
        run: python tools/build_nimbus_base.py
      - name: Install GUI runtime
        run: |
          # The hosted Ubuntu image carries a Microsoft apt source that can
          # intermittently return 403 and abort apt-get update. This job only
          # needs Ubuntu packages, so remove that unrelated source first.
          for source in /etc/apt/sources.list.d/*; do
            if [ -f "$source" ] && grep -q "packages.microsoft.com" "$source"; then
              echo "Skipping blocked third-party apt source: $source"
              sudo rm -f "$source"
            fi
          done
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y flatpak xvfb xdotool imagemagick jq psmisc
      - name: Install Kodi Piers beta
        run: |
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak remote-add --user --if-not-exists flathub-beta https://dl.flathub.org/beta-repo/flathub-beta.flatpakrepo
          flatpak install --user --noninteractive -y flathub org.freedesktop.Platform//26.08
          flatpak install --user --noninteractive -y flathub-beta tv.kodi.Kodi//beta
          flatpak info --user tv.kodi.Kodi//beta
      - name: Install Nimbus-derived CINÉVA and its local bridge
        run: |
          ADDONS="$HOME/.var/app/tv.kodi.Kodi/data/addons"
          STAGE="$GITHUB_WORKSPACE/nimbus-stage"
          mkdir -p "$ADDONS" "$STAGE"
          unzip -q dist/nimbus-foundation/skin.cineva-0.8.0-nimbus.zip -d "$STAGE"
          unzip -q dist/nimbus-foundation/script.cineva.nimbus-0.1.1.zip -d "$STAGE"
          cp -a "$STAGE/skin.cineva" "$ADDONS/"
          cp -a "$STAGE/script.cineva.nimbus" "$ADDONS/"
          test -f "$ADDONS/skin.cineva/xml/Home.xml"
          test -f "$ADDONS/skin.cineva/xml/Includes_Home.xml"
          test -f "$ADDONS/script.cineva.nimbus/resources/lib/modules/cpath_maker.py"
          USERDATA="$HOME/.var/app/tv.kodi.Kodi/data/userdata"
          mkdir -p "$USERDATA/addon_data/skin.cineva"
          cat > "$USERDATA/addon_data/skin.cineva/settings.xml" <<'XML'
          <settings version="2"><setting id="firsttimerun" value="true" /></settings>
          XML
          cat > "$USERDATA/advancedsettings.xml" <<'XML'
          <advancedsettings><loglevel hide="false">2</loglevel></advancedsettings>
          XML
      - name: Launch Kodi, verify the Nimbus-based Home and capture screenshots
        run: |
          mkdir -p artifacts
          export DISPLAY=:99
          Xvfb :99 -screen 0 1920x1080x24 -ac +extension GLX +render -noreset > /tmp/xvfb.log 2>&1 &
          echo $! > /tmp/xvfb.pid
          sleep 2
          KODI_DATA="$HOME/.var/app/tv.kodi.Kodi/data"
          USERDATA="$KODI_DATA/userdata"
          SETTINGS="$USERDATA/guisettings.xml"
          # Kodi writes kodi.log beside userdata, not inside userdata/temp.
          KODI_LOG="$KODI_DATA/temp/kodi.log"
          boot_kodi_once() {
            local attempt="$1"
            local previous_size=""
            local stable_samples=0
            # Force X11: Kodi 22 Flatpak may otherwise select Wayland, leaving
            # the Xvfb profile with defaults and never initializing Home.
            flatpak run --user tv.kodi.Kodi//beta --standalone --windowing=x11 \
              > "/tmp/nimbus-firstboot-$attempt.log" 2>&1 &
            FIRST_PID=$!
            for i in $(seq 1 120); do
              if ! pgrep -x kodi.bin >/dev/null && ! kill -0 "$FIRST_PID" 2>/dev/null; then
                echo "Kodi exited before completing first-run initialization."
                return 1
              fi
              # File existence is not readiness: Kodi creates guisettings.xml
              # before it has finished writing it. At normal log level Kodi 22
              # records the active skin as "load skin from:"; it does not emit
              # the verbose "Loading skin file: Home.xml" message used by the
              # previous probe. Wait for that real skin-load event, valid XML,
              # and a byte size stable for four polls.
              if grep -qi "load skin from:" "$KODI_LOG" 2>/dev/null; then
                if python - "$SETTINGS" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          try:
              root = ET.parse(sys.argv[1]).getroot()
              if root.tag != "settings":
                  raise ValueError("unexpected guisettings root")
          except Exception:
              raise SystemExit(1)
          PY
                then
                  current_size="$(stat -c '%s' "$SETTINGS")"
                  if [ "$current_size" = "$previous_size" ]; then
                    stable_samples=$((stable_samples + 1))
                  else
                    stable_samples=0
                  fi
                  previous_size="$current_size"
                  if [ "$stable_samples" -ge 4 ]; then
                    echo "Kodi reached Home with a valid, stable guisettings.xml ($current_size bytes)."
                    return 0
                  fi
                else
                  previous_size=""
                  stable_samples=0
                fi
              fi
              sleep 2
            done
            echo "Kodi did not reach Home with a valid, stable guisettings.xml."
            tail -n 100 "$KODI_LOG" 2>/dev/null || true
            return 1
          }
          if ! boot_kodi_once 1; then
            mkdir -p artifacts
            import -display :99 -window root artifacts/nimbus-firstboot-failure.png 2>/dev/null || true
            ps -eo pid,ppid,stat,comm,args > artifacts/nimbus-firstboot-processes.txt || true
            flatpak ps --user > artifacts/nimbus-firstboot-flatpak-ps.txt 2>&1 || true
            find "$HOME/.var/app/tv.kodi.Kodi" -type f \\( -name kodi.log -o -name guisettings.xml \\) -print > artifacts/nimbus-firstboot-state-files.txt 2>&1 || true
            while IFS= read -r path; do
              [ -f "$path" ] && { echo "===== $path ====="; tail -n 120 "$path"; }
            done < artifacts/nimbus-firstboot-state-files.txt > artifacts/nimbus-firstboot-log-tail.txt
            cat /tmp/nimbus-firstboot-1.log || true
            exit 1
          fi
          # Stage the POV-compatible test provider only after Kodi's clean
          # first boot. The plugin must not participate in initial add-on
          # discovery; install its deterministic art before enabling CINÉVA.
          POV_FIXTURE="$GITHUB_WORKSPACE/tools/test-fixtures/plugin.video.pov"
          POV_ADDON="$KODI_DATA/addons/plugin.video.pov"
          mkdir -p "$POV_ADDON/resources/posters"
          cp -a "$POV_FIXTURE"/. "$POV_ADDON"/
          ARTWORK_STAGE="$GITHUB_WORKSPACE/nimbus-artwork-stage"
          mkdir -p "$ARTWORK_STAGE"
          unzip -q dist/nimbus-foundation/skin.cineva-0.8.0-nimbus.zip -d "$ARTWORK_STAGE"
          (
            cd "$ARTWORK_STAGE"
            python "$GITHUB_WORKSPACE/tools/download_test_posters.py" "$POV_ADDON/resources/posters"
          )
          test -s "$POV_ADDON/resources/posters/movie-1.jpg"
          test -s "$POV_ADDON/resources/posters/tv-1.jpg"
          test -s "$POV_ADDON/resources/posters/backdrop-1.jpg"
          test -s "$POV_ADDON/resources/posters/tv-backdrop-1.jpg"
          # Keep the first Kodi session alive after Home is ready. The first
          # startup has already scanned the staged add-ons and initialized Kodi's
          # JSON-RPC server. Restarting Flatpak here previously left orphaned
          # bwrap/kodi.bin processes and a second GUI without a JSON-RPC listener.
          mkdir -p artifacts
          cp "$SETTINGS" artifacts/guisettings-before-activation.xml
          for i in $(seq 1 60); do
            if ss -ltn | grep -q ':9090'; then break; fi
            if ! pgrep -x kodi.bin >/dev/null; then
              echo "Kodi exited after reaching Home but before JSON-RPC became ready."
              tail -n 100 "$KODI_LOG" 2>/dev/null || true
              exit 1
            fi
            sleep 1
          done
          if ! ss -ltn | grep -q ':9090'; then
            echo "Kodi reached Home but did not expose JSON-RPC port 9090."
            tail -n 120 "$KODI_LOG" 2>/dev/null || true
            exit 1
          fi
          echo "First-boot Kodi JSON-RPC listener is ready; activating CINÉVA in the same live session."
          sleep 2
          python - <<'PY'
          import json, socket, time, subprocess, shutil
          from pathlib import Path

          def rpc(method, params=None, response_timeout=8):
              request = {"jsonrpc":"2.0","method":method,"params":params or {},"id":1}
              decoder = json.JSONDecoder()
              with socket.create_connection(("127.0.0.1", 9090), timeout=5) as sock:
                  sock.settimeout(min(2, response_timeout))
                  # Kodi's raw TCP JSON-RPC transport has no newline delimiter;
                  # the complete JSON object is the request boundary.
                  sock.sendall(json.dumps(request).encode())
                  data = ""
                  deadline = time.time() + response_timeout
                  while time.time() < deadline:
                      try:
                          chunk = sock.recv(65536)
                      except socket.timeout:
                          continue
                      if not chunk:
                          break
                      data += chunk.decode("utf-8", "replace")
                      pos = 0
                      while pos < len(data):
                          while pos < len(data) and data[pos].isspace():
                              pos += 1
                          try:
                              obj, endpos = decoder.raw_decode(data, pos)
                          except json.JSONDecodeError:
                              break
                          pos = endpos
                          if isinstance(obj, dict) and obj.get("id") == 1:
                              if "error" in obj:
                                  raise RuntimeError(obj["error"])
                              return obj.get("result")
              raise RuntimeError(f"No JSON-RPC result for {method}: {data[:300]}")

          def rpc_retry(method, params=None, attempts=20):
              last = None
              for attempt in range(attempts):
                  try:
                      return rpc(method, params)
                  except Exception as exc:
                      last = exc
                      print(f"JSON-RPC retry {attempt + 1}/{attempts} for {method}: {exc}")
                      time.sleep(1)
              raise RuntimeError(f"JSON-RPC did not recover for {method}: {last}")

          def gui():
              # Keep each poll short. Skin reload can temporarily close JSON-RPC
              # connections; the outer readiness loop owns the full timeout.
              return rpc("GUI.GetProperties", {"properties":["currentwindow","currentcontrol","skin"]}, response_timeout=2)

          def skin_id(state):
              value = state.get("skin", {})
              return value.get("id") if isinstance(value, dict) else str(value)

          def log_text():
              path = Path.home()/".var/app/tv.kodi.Kodi/data/temp/kodi.log"
              return path.read_text(errors="replace") if path.exists() else ""

          def kodi_process_alive():
              return any(
                  subprocess.run(["pgrep", "-x", name], capture_output=True).returncode == 0
                  for name in ("kodi.bin", "kodi-x11", "kodi")
              )

          # Kodi resets an unenabled, manually staged skin to Estuary while
          # loading its profile. Use the proven live activation path instead:
          # enable the local bridge and skin after Kodi's add-on scan, then
          # select CINÉVA through Settings.SetSettingValue so Kodi opens the
          # native Keep Skin confirmation.
          pov_before = rpc_retry("Addons.GetAddonDetails", {
              "addonid":"plugin.video.pov", "properties":["enabled","version"]
          })
          print("CINÉVA POV test fixture before enable:", pov_before)
          pov_enable = rpc_retry("Addons.SetAddonEnabled", {
              "addonid":"plugin.video.pov", "enabled":True
          })
          print("CINÉVA POV test fixture enable result:", pov_enable)
          initial_skin = rpc_retry("Settings.GetSettingValue", {"setting":"lookandfeel.skin"})
          print("Kodi skin after first startup:", initial_skin)
          bridge_before = rpc_retry("Addons.GetAddonDetails", {
              "addonid":"script.cineva.nimbus", "properties":["enabled","version"]
          })
          print("CINÉVA Nimbus Bridge before enable:", bridge_before)
          bridge_enable = rpc_retry("Addons.SetAddonEnabled", {
              "addonid":"script.cineva.nimbus", "enabled":True
          })
          print("CINÉVA Nimbus Bridge enable result:", bridge_enable)
          skin_before = rpc_retry("Addons.GetAddonDetails", {
              "addonid":"skin.cineva", "properties":["enabled","version"]
          })
          print("CINÉVA skin before enable:", skin_before)
          skin_enable = rpc_retry("Addons.SetAddonEnabled", {
              "addonid":"skin.cineva", "enabled":True
          })
          print("CINÉVA skin enable result:", skin_enable)
          time.sleep(2)
          before_skin_loads = log_text().count("load skin from:")
          switch_result = rpc_retry("Settings.SetSettingValue", {
              "setting":"lookandfeel.skin", "value":"skin.cineva"
          })
          print("Selected CINÉVA through Kodi JSON-RPC:", switch_result)
          state = None
          last_gui_error = None
          deadline = time.time() + 120
          next_status = time.time()
          while time.time() < deadline:
              try:
                  state = gui()
                  last_gui_error = None
                  logs = log_text()
                  loaded_cineva = (
                      logs.count("load skin from:") > before_skin_loads
                      and any(
                          "load skin from:" in line and "/skin.cineva/" in line
                          for line in logs.splitlines()
                      )
                  )
                  if loaded_cineva and skin_id(state) == "skin.cineva":
                      break
              except Exception as exc:
                  last_gui_error = exc
              if time.time() >= next_status:
                  print(
                      "Waiting for Kodi to activate the startup-selected Nimbus skin:",
                      "GUI=", state,
                      "RPC error=", last_gui_error,
                      "actual skin load logged=", any(
                          "load skin from:" in line and "/skin.cineva/" in line
                          for line in log_text().splitlines()
                      ),
                  )
                  next_status = time.time() + 10
              if not kodi_process_alive():
                  raise SystemExit(
                      "Kodi exited before loading the startup-selected skin.cineva. "
                      f"Last GUI={state}; RPC error={last_gui_error}; "
                      f"Kodi log tail:\n{log_text()[-10000:]}"
                  )
              time.sleep(1)
          else:
              failure_screenshot = Path("artifacts/cineva-nimbus-load-timeout.png")
              subprocess.run(
                  ["import","-display",":99","-window","root",str(failure_screenshot)],
                  check=False,
              )
              settings_path = Path.home()/".var/app/tv.kodi.Kodi/data/userdata/guisettings.xml"
              if settings_path.is_file():
                  shutil.copy2(settings_path, "artifacts/guisettings-load-timeout.xml")
              raise SystemExit(
                  "Kodi did not load skin.cineva from its startup selection within 120 seconds. "
                  f"GUI={state}; last RPC error={last_gui_error}; "
                  f"Kodi log tail:\n{log_text()[-10000:]}"
              )

          skin_parse_errors = [
              line for line in log_text().splitlines()
              if "Misplaced [" in line or "Error parsing boolean expression" in line
          ]
          if skin_parse_errors:
              subprocess.run(["import", "-window", "root", "artifacts/nimbus-skin-parse-failure.png"], check=False)
              raise SystemExit("Kodi reported skin boolean-expression errors: " + " | ".join(skin_parse_errors[-8:]))

          skin_details = rpc_retry("Addons.GetAddonDetails", {
              "addonid":"skin.cineva", "properties":["enabled","version"]
          })
          bridge_details = rpc_retry("Addons.GetAddonDetails", {
              "addonid":"script.cineva.nimbus", "properties":["enabled","version"]
          })
          print("Activated Nimbus-derived CINÉVA add-on:", skin_details)
          print("Resolved CINÉVA Nimbus Bridge dependency:", bridge_details)
          skin_record = skin_details.get("addon", skin_details)
          bridge_record = bridge_details.get("addon", bridge_details)
          if skin_record.get("enabled") is not True:
              raise SystemExit(f"Skin loaded but Kodi did not mark skin.cineva enabled: {skin_details}")
          if bridge_record.get("enabled") is not True:
              raise SystemExit(f"Skin loaded but Kodi did not enable its required Nimbus bridge: {bridge_details}")
          activation_log = log_text()
          for addon_id in ("skin.cineva", "script.cineva.nimbus"):
              if f"CAddonMgr: enabled {addon_id}" not in activation_log:
                  raise SystemExit(f"Kodi did not log successful activation of {addon_id}")

          # Confirm the Keep Skin dialog when Kodi presents it.
          if state.get("currentwindow",{}).get("id") == 10100:
              for _ in range(4):
                  label = state.get("currentcontrol",{}).get("label","").strip().lower()
                  if label == "yes":
                      break
                  subprocess.run(["xdotool","key","Left"],check=True)
                  time.sleep(0.25)
                  state = gui()
              if state.get("currentcontrol",{}).get("label","").strip().lower() != "yes":
                  raise SystemExit(f"Keep Skin did not focus Yes: {state}")
              subprocess.run(["xdotool","key","Return"],check=True)
              deadline = time.time() + 20
              while time.time() < deadline:
                  state = gui()
                  if state.get("currentwindow",{}).get("id") != 10100:
                      break
                  time.sleep(0.25)
              else:
                  raise SystemExit(f"Keep Skin confirmation did not close: {state}")

          selected = rpc_retry("Settings.GetSettingValue", {"setting":"lookandfeel.skin"})
          selected_value = selected.get("value") if isinstance(selected, dict) else selected
          state = gui()
          if selected_value != "skin.cineva" or skin_id(state) != "skin.cineva":
              raise SystemExit(f"CINÉVA was not retained after Keep Skin: setting={selected}; GUI={state}")

          state = gui()
          if state.get("currentwindow",{}).get("id") in (1112, 11112, 12002):
              welcome_label = state.get("currentcontrol",{}).get("label","").strip()
              if welcome_label.lower() != "ok":
                  raise SystemExit(f"Nimbus first-run welcome did not focus OK: {state}")
              print("Acknowledging Nimbus first-run welcome and generating default menu/widget includes.")
              before_welcome_home_inits = log_text().count("Window Init (Home.xml)")
              subprocess.run(["xdotool","key","Return"],check=True)
              required_default_includes = [
                  "script-nimbus-main_menu_movies.xml",
                  "script-nimbus-main_menu_tvshows.xml",
                  "script-nimbus-main_menu_custom1.xml",
                  "script-nimbus-main_menu_custom2.xml",
                  "script-nimbus-main_menu_custom3.xml",
                  "script-nimbus-widget_home.xml",
                   "script-nimbus-widget_movies.xml",
                  "script-nimbus-widget_tvshows.xml",
                  "script-nimbus-widget_custom1.xml",
                  "script-nimbus-widget_custom2.xml",
                  "script-nimbus-widget_custom3.xml",
              ]
              skin_xml_dir = Path.home()/".var/app/tv.kodi.Kodi/data/addons/skin.cineva/xml"
              deadline = time.time() + 45
              while time.time() < deadline:
                  state = gui()
                  if (
                      state.get("currentwindow",{}).get("id") in (10100, 12002)
                      and state.get("currentcontrol",{}).get("label","").strip().lower() == "ok"
                  ):
                      print("Dismissing Nimbus's completed menu/widget setup confirmation.")
                      subprocess.run(["xdotool","key","Return"],check=True)
                      time.sleep(0.25)
                      continue
                  missing = [
                      name for name in required_default_includes
                      if not (skin_xml_dir/name).is_file() or (skin_xml_dir/name).stat().st_size == 0
                  ]
                  home_reloaded = log_text().count("Window Init (Home.xml)") > before_welcome_home_inits
                  home_widgets_ready = "CINEVA_NIMBUS_HOME_WIDGETS_READY=4" in log_text()
                  if (
                      skin_id(state) == "skin.cineva"
                      and state.get("currentwindow",{}).get("id") == 10000
                      and not missing
                      and home_reloaded
                      and home_widgets_ready
                  ):
                      break
                  time.sleep(0.25)
              else:
                  subprocess.run(["import", "-window", "root", "artifacts/nimbus-first-run-failure.png"], check=False)
                  raise SystemExit(
                      f"Nimbus first-run setup did not return to Home after Home.xml reloaded with all default includes: "
                      f"missing={missing}; GUI={state}; log tail:\\n{log_text()[-6000:]}"
                  )
              print("Nimbus first-run defaults generated and skin reloaded:", required_default_includes)
          else:
              if state.get("currentwindow",{}).get("id") != 10000:
                  rpc_retry("GUI.ActivateWindow", {"window":"home"})
              deadline = time.time() + 20
              while time.time() < deadline:
                  state = gui()
                  if skin_id(state) == "skin.cineva" and state.get("currentwindow",{}).get("id") == 10000:
                      break
                  time.sleep(0.25)
              if skin_id(state) != "skin.cineva" or state.get("currentwindow",{}).get("id") != 10000:
                  raise SystemExit(f"Nimbus-derived CINÉVA did not reach Home: {state}")
          print("Nimbus-derived CINÉVA Home is active:", json.dumps(state, ensure_ascii=False))
          PY
          sleep 3
          import -display :99 -window root artifacts/cineva-nimbus-home.png
          xdotool key Down || true
          sleep 2
          import -display :99 -window root artifacts/cineva-nimbus-home-down.png
          test -s artifacts/cineva-nimbus-home.png
          test -s artifacts/cineva-nimbus-home-down.png
          LOG="$HOME/.var/app/tv.kodi.Kodi/data/temp/kodi.log"
          if [ -f "$LOG" ]; then
            cp "$LOG" artifacts/kodi.log
            grep -Ei 'ERROR|CRITICAL|Traceback|skin.cineva|script.cineva.nimbus' "$LOG" > artifacts/kodi-errors.txt || true
          fi
          flatpak info --user tv.kodi.Kodi//beta > artifacts/kodi-flatpak-version.txt 2>&1 || true
      - name: Collect diagnostics
        if: always()
        run: |
          mkdir -p artifacts
          cp /tmp/nimbus-firstboot-1.log artifacts/ 2>/dev/null || true
          cp /tmp/nimbus-kodi.log artifacts/ 2>/dev/null || true
          cp /tmp/xvfb.log artifacts/ 2>/dev/null || true
          LOG="$(find "$HOME/.var/app/tv.kodi.Kodi" -type f -name kodi.log -print -quit 2>/dev/null || true)"
          if [ -n "$LOG" ] && [ ! -f artifacts/kodi.log ]; then cp "$LOG" artifacts/kodi.log; fi
          SETTINGS="$HOME/.var/app/tv.kodi.Kodi/data/userdata/guisettings.xml"
          if [ -f "$SETTINGS" ] && [ ! -f artifacts/guisettings.xml ]; then cp "$SETTINGS" artifacts/guisettings.xml; fi
      - name: Stop Kodi and Xvfb
        if: always()
        run: |
          flatpak kill --user tv.kodi.Kodi 2>/dev/null || true
          pkill -x kodi.bin 2>/dev/null || true
          pkill -x kodi-x11 2>/dev/null || true
          kill "$(cat /tmp/xvfb.pid)" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cineva-nimbus-foundation-gui
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
