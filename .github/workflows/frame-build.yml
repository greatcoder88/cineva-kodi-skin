name: Frame Kodi Build

on:
  push:
    branches: [frame-nimbus]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/frame-nimbus'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and verify Frame ZIPs
        run: python tools/build_frame.py
      - name: Record package checksums
        working-directory: dist/frame
        run: sha256sum -- *.zip > SHA256SUMS
      - name: Upload test packages
        uses: actions/upload-artifact@v4
        with:
          name: frame-kodi-${{ github.sha }}
          path: dist/frame/
          if-no-files-found: error
          retention-days: 14
      - name: Report build result
        if: always()
        env:
          FRAME_JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo '## Frame Kodi Build'
            echo "Build result: $FRAME_JOB_STATUS"
            echo "Source commit: $GITHUB_SHA"
            if [ "$FRAME_JOB_STATUS" = success ]; then
              echo 'ZIP integrity, add-on manifests, XML and Python syntax validated.'
              echo 'Kodi runtime and Fire TV remote behavior are outside this build check.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  kodi-gui:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frame-kodi-${{ github.sha }}
          path: dist/frame
      - name: Install Kodi GUI test runtime
        run: |
          for source in /etc/apt/sources.list.d/*; do
            if [ -f "$source" ] && grep -q 'packages.microsoft.com' "$source"; then
              sudo rm -f "$source"
            fi
          done
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y flatpak xvfb imagemagick ffmpeg
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak remote-add --user --if-not-exists flathub-beta https://dl.flathub.org/beta-repo/flathub-beta.flatpakrepo
          flatpak install --user --noninteractive -y flathub org.freedesktop.Platform//26.08
          flatpak install --user --noninteractive -y flathub-beta tv.kodi.Kodi//beta
      - name: Test Home navigation in Kodi
        run: |
          (cd dist/frame && sha256sum --check SHA256SUMS)
          mkdir -p artifacts/frame-gui
          flatpak info --user tv.kodi.Kodi//beta > artifacts/frame-gui/kodi-version.txt
          xvfb-run -a -s '-screen 0 1920x1080x24' python3 tools/test_frame_kodi.py
      - name: Upload Kodi screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frame-gui-${{ github.sha }}
          path: artifacts/frame-gui/
          if-no-files-found: warn
          retention-days: 14
